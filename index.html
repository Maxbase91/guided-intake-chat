<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Intake Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Guided Intake Chat (prototype)
   - Rules decide the buying route AND what must be known for that route.
   - The AI only talks: it phrases one question at a time and reads the answers.
   ========================================================= */
:root{
  --navy:#0f2147; --navy-2:#1b3266; --navy-3:#2c4a8a;
  --amber:#f2a900; --amber-soft:#fff4d6; --amber-ink:#8a5d00;
  --bg:#f5f6fa; --card:#fff; --line:#e4e7ef; --line-2:#eef0f5;
  --ink:#141b2d; --ink-2:#4a5470; --ink-3:#7c859e;
  --ok:#11845b; --ok-soft:#e5f5ee; --warn:#b4570b; --warn-soft:#fdf0e3;
  --bad:#b42318; --bad-soft:#fdecea; --info:#2c4a8a; --info-soft:#eaf0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;flex:none}
.top-in{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#ffcf5c);display:grid;place-items:center;color:var(--navy);font-weight:800;flex:none}
.brand b{display:block;font-family:"Inter Tight";font-size:16px}
.brand span{font-size:12px;color:#aab6d3}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#dfe6f7;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7c859e}
.dot.on{background:#3ad29f;box-shadow:0 0 0 3px rgba(58,210,159,.2)}
.tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.tb:hover{background:rgba(255,255,255,.18)}
.only-m{display:none}
@media(max-width:900px){.only-m{display:inline-flex}.brand span,.pill{display:none}}

/* layout */
.app{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:900px){.chat{border-radius:0;border:0}}
.msgs{flex:1;overflow-y:auto;padding:26px 24px 12px}
@media(max-width:600px){.msgs{padding:16px 12px 8px}}

/* welcome */
.welcome{max-width:600px;margin:24px auto 10px}
.welcome h1{font-size:26px}
.welcome p{color:var(--ink-2);margin:8px 0 18px}
.tries{border-top:1px solid var(--line-2)}
.tries button{display:flex;gap:12px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 4px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.tries button:hover{color:var(--navy);background:#fafbfd}
.tries small{flex:none;width:118px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
@media(max-width:600px){.tries small{width:90px}}

/* messages */
.m{display:flex;gap:10px;margin:0 0 16px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.bub{max-width:min(600px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.classcard{max-width:min(600px,85%);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;font-size:13.5px}
.classcard .ch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}.classcard .cr{margin:4px 0}
.classcard .cc{color:var(--ink-3);font-size:12px}.classcard .cm{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:var(--line-2);font-size:12px;font-weight:600}
.classcard .cx{color:var(--ink-2);font-size:12.5px;margin-top:2px}.classcard .cf{color:var(--ink-3);font-size:12px;margin-top:6px}
.ucol{display:flex;flex-direction:column;align-items:flex-end;max-width:min(600px,85%)}.ucol .bub{max-width:100%}
.ascore{font-size:11px;margin-top:4px;padding:1px 8px;border-radius:99px;font-weight:600}
.ascore.shi{color:#1d6b43;background:#e6f4ec}.ascore.smid{color:#8a5d00;background:#fdf3dc}.ascore.slo{color:#b42318;background:#fdecea}
.m.a .bub{background:#f3f5fa;border-bottom-left-radius:5px}
.m.a .bub b{color:var(--navy)}
.m .wide{flex:1;min-width:0;max-width:680px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sys{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-4px 0 14px}

/* answer shortcuts: small, quiet, only for closed questions */
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.qr button{border:1px solid var(--line);color:var(--ink-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.qr button:hover{border-color:var(--navy-3);color:var(--navy)}

/* composer */
.comp{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;max-height:160px;min-height:48px;outline:none;line-height:1.45}
.comp textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(44,74,138,.12)}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;cursor:not-allowed}

/* recommendation + description cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#2c4a8a 0%,var(--navy) 60%);color:#fff}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink)}
.rec-h .eyebrow{color:#ffd36b}
.rec-h h2{font-size:23px;margin:3px 0 2px}
.rec-h .meta{font-size:13px;color:#c9d3ea}
.sec{padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.chk{display:flex;gap:8px;padding:3px 0}
.chk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--info-soft);color:var(--info)}
.chk i.w{background:var(--warn-soft);color:var(--warn)} .chk i.b{background:var(--bad-soft);color:var(--bad)}
.chk span{color:var(--ink-3);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);background:#fafbfd}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--amber);color:var(--navy)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.lnk{background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.more{padding:12px 20px;border-top:1px solid var(--line-2);font-size:13.5px;background:#fafbfd}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.ovr{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:#6b3a06;margin-top:8px}
.old{opacity:.6;font-size:13px;padding:10px 14px}
.sec.lead{background:#fbfaf5;border-left:3px solid var(--amber);font-size:14.5px;line-height:1.6}
.stepbar{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;overflow-x:auto;scrollbar-width:none}
.stepbar:empty{display:none}
.stepbar .st{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;font-size:13px;color:var(--ink-3);white-space:nowrap;flex:none}
.stepbar .st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.stepbar .st.done{color:var(--ink-2)} .stepbar .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepbar .st.cur{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow)} .stepbar .st.cur i{background:var(--navy);border-color:var(--navy);color:#fff}
.stepbar .st small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.stepbar .sep{flex:none;width:14px;height:1.5px;background:var(--line);align-self:center}
.stagemark{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-3);font-size:12px}
.stagemark:before,.stagemark:after{content:"";flex:1;height:1px;background:var(--line)}
.stagemark b{color:var(--navy);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stagemark span{display:block;text-align:center;line-height:1.4}
.recap{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:min(560px,85%);overflow:hidden;box-shadow:var(--shadow)}
.recap .rh{padding:10px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px}
.recap .rb{padding:8px 14px 10px}
.recap .rr{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
.recap .rr span:first-child{color:var(--ink-3);width:120px;flex:none}
.recap .rf{font-size:12.5px;color:var(--ink-3);padding:0 14px 10px}
.recap.mini{box-shadow:none;background:#f8faf9;border-color:#e3efe9}
.recap.mini .rh{background:transparent;font-weight:500;padding:7px 12px}
.m.a .bub.qchk{background:var(--amber-soft);border:1px solid #f3dfa6}
.m.a .bub.qchk:before{content:"Quick check · ";font-weight:600;color:var(--amber-ink)}
.sec.qual .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.qbadge{font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.q-strong,.q-good{background:var(--ok-soft);color:var(--ok)} .q-fair{background:var(--warn-soft);color:var(--warn)} .q-needs{background:var(--bad-soft);color:var(--bad)}
.qlist{list-style:none;margin:8px 0 0;padding:0}
.qlist li{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.qlist li:before{flex:none;width:18px;text-align:center;font-weight:700}
.qlist li.warn:before{content:"!";color:var(--warn)} .qlist li.info:before{content:"i";color:var(--info)} .qlist li.ok:before{content:"✓";color:var(--ok)}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 2px;display:flex;justify-content:space-between}
.side .grp em{font-style:normal;color:var(--ok);letter-spacing:0;text-transform:none}
.sec.desc{background:#fbfaf5;border-left:3px solid var(--amber)}
.ds{margin:0 0 10px}.ds:last-child{margin:0}.ds h5{margin:0 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.ds p{margin:0;font-size:14.5px;line-height:1.55}
.ds.narr{margin-top:14px;padding-top:12px;border-top:1px dashed #e6d9b0}
.qual h5.qh{margin:10px 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sec.srq .cmp{margin:4px 0 8px;font-size:14px;line-height:1.55}.sec.srq .shortv{background:var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px}.sec.srq .shortv p{margin:3px 0 0}
.sec.srq .cpy{display:flex;gap:14px;margin-top:6px}.qcounts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.qc{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.qc.ok{background:#e6f4ec;color:#1d6b43}.qc.pa{background:#fdf3dc;color:#8a5d00}.qc.tb{background:#eef1f8;color:#3c4a6b}.qc.rk{background:#fdecea;color:#b42318}.qc.na{background:#f3f4f6;color:#6b7280}
.ds .hl{font-size:15px;margin-bottom:4px}.ds .exec p{margin:0 0 8px}.ds .exec p:last-child{margin:0}
.sumt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;background:#fff}.sumt td{border:1px solid #ece3c6;padding:6px 9px;vertical-align:top;line-height:1.45}
.sumt td:first-child{width:32%;color:var(--ink-3);font-weight:600;background:#fdfaf0}.ds ul{margin:2px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.sec.record h4 .muted{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.kvg{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;font-size:13px}.kvg span:nth-child(odd){color:var(--ink-3)}
.sec.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec.chips span{background:var(--line-2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.sec.brdlink{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f6f8fd}
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);overflow:auto;padding:0 12px 40px}
.doctools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:12px 4px;color:#fff}
.doctools .muted{color:#c9d3ea}.doctools .sp{flex:1}
.paper{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;padding:48px 56px;box-shadow:0 20px 50px rgba(0,0,0,.3);outline:none}
@media(max-width:700px){.paper{padding:24px 18px}.hide-sm{display:none}.brd .two{grid-template-columns:1fr}}
body.doc-open{overflow:hidden}
@media print{
  body{display:block;height:auto;background:#fff}
  body.doc-open>*:not(#docRoot){display:none!important}
  .docwrap{position:static;background:none;padding:0;overflow:visible}.doctools{display:none}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .brd h2{break-after:avoid}.brd tr{break-inside:avoid}
}
.sd-h{background:var(--navy);color:#fff;padding:14px 20px}
.sd-h small{font-size:11.5px;color:#aab6d3;letter-spacing:.06em;text-transform:uppercase}
.sd-h .t{font-family:"Inter Tight";font-size:17px;font-weight:700;outline:none;margin-top:2px}
.sd [contenteditable]{outline:none;border-radius:6px}
.sd [contenteditable]:focus{background:#f6f8fd;box-shadow:0 0 0 2px rgba(44,74,138,.15)}

/* side panel */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.side{position:fixed;inset:0 0 0 auto;width:min(360px,92%);background:var(--bg);z-index:30;padding:16px;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 40px rgba(0,0,0,.15)}.side.open{transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.route{font-family:"Inter Tight";font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
.prov{font-size:12px;color:var(--ink-3)}
.prog{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c544);transition:width .4s}
.fact{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px;align-items:flex-start}
.fact:first-of-type{border-top:0}
.fact .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.fact.ok .ic{background:var(--ok);border-color:var(--ok)}
.fact.next .ic{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fact .k{color:var(--ink-3);flex:none;width:112px}
.fact .v{flex:1;text-align:right;font-weight:500;word-break:break-word}
.fact:not(.ok) .v{color:var(--ink-3);font-weight:400}
.muted{color:var(--ink-3);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer section+section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.drawer label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.tgl{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.tgl input{width:18px;height:18px;accent-color:var(--navy)}
.alert{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.err{background:var(--bad-soft);color:var(--bad)}
</style>
<style id="doccss"></style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">G</div>
    <div class="brand"><b>Guided Intake</b><span>Tell us what you need. We find the right way to buy it.</span></div>
    <div class="sp"></div>
    <span class="pill"><span class="dot" id="aiDot"></span><span id="aiLabel">Offline</span></span>
    <button class="tb only-m" id="sumBtn">Summary</button>
    <button class="tb" id="newBtn">New</button>
    <button class="tb" id="cfgBtn">Rules</button>
  </div>
</header>

<div class="app">
  <section class="chat">
    <div class="stepbar" id="stepbar"></div>
    <div class="msgs" id="msgs"></div>
    <div class="qr" id="qr"></div>
    <form class="comp" id="comp">
      <textarea id="inp" rows="1" placeholder="Describe what you need…"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
  <aside class="side" id="side"></aside>
</div>
<div id="drawerRoot"></div>
<div id="docRoot"></div>

<script>
/* =========================================================
   1. CONFIGURATION
   Hosted on Vercel: the key lives in Vercel environment variables
   (GEMINI_API_KEY or GROQ_API_KEY) and never reaches the browser.
   Opened as a local file: paste a key into keys below instead.
   ========================================================= */
const CONFIG = {

// Level 4 classification: meaning and keywords against each entry; the buying category weighs in
function classifyL4(f){
  const t=demandText(f), words5=new Set((t.match(/[a-zäöüß]{4,}/g)||[]).map(w=>w.slice(0,5)));
  const scored=L4.map(e=>{
    const hits=e.kw.filter(k=>t.includes(k)), ov=new Set((e.name+" "+e.desc).toLowerCase().match(/[a-zäöüß]{4,}/g)||[]);

  CONFIG.provider = SERVER ? "server" : CONFIG.keys.gemini ? "gemini" : CONFIG.keys.groq ? "groq" : "offline";
}
async function callLLM(system, history, retried){
  const p=CONFIG.provider, key=CONFIG.keys[p], model=CONFIG.models[p];
  if(p==="server"){
    const r=await fetch("/api/llm",{method:"POST",signal:AbortSignal.timeout(58000),headers:{"Content-Type":"application/json","x-access-code":CONFIG.accessCode||"",...(CONFIG.forceProvider?{"x-force-provider":CONFIG.forceProvider}:{})},body:JSON.stringify({system,history})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401) throw new Error("Access code missing or wrong. Enter it under Rules.");
    // short per-minute limit: wait the few seconds the provider asks for, then try once more
    if(r.status===429 && (retried||0)<2 && d.retryAfter && d.retryAfter<=20){ await new Promise(res=>setTimeout(res,(d.retryAfter+1)*1000)); return callLLM(system, history, (retried||0)+1); }
    if(!r.ok){ const e=new Error(d.error||`Server error ${r.status}`); e.quota=r.status===429||!!d.quota; throw e; }
    if(SERVER && d.provider) SERVER.last=d.provider;
    return parseJSON(d.text);
  }
  if(p==="gemini"){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json"},body:JSON.stringify({
      systemInstruction:{parts:[{text:system}]},
      contents:history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
      generationConfig:{temperature:0.4,responseMimeType:"application/json",...(/flash/i.test(model)?{thinkingConfig:{thinkingBudget:0}}:{})}})});
    const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Gemini error ${r.status}`);
    return parseJSON((d.candidates?.[0]?.content?.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join(""));
  }
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({model,temperature:0.4,response_format:{type:"json_object"},messages:[{role:"system",content:system},...history]})});
  const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Groq error ${r.status}`);
  return parseJSON(d.choices?.[0]?.message?.content);
}
function parseJSON(t){ t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(); try{return JSON.parse(t);}catch(e){const m=t.match(/\{[\s\S]*\}/); if(m){ try{return JSON.parse(m[0]);}catch(e2){} } return {_raw:true, reply:t}; } }

/* ---------- conversation prompt ---------- */
function chatSystem(){
  return `You are the intake assistant of a corporate procurement team. You talk with business colleagues who want to buy something.
You only have a conversation. Fixed rules decide the buying route and which facts are needed. Each turn you get the current state, including the ordered list "still_needed".

Your job each turn:
1. Read the user's latest message and record EVERY fact it contains in "facts", for any key in the list below, not only the one you asked about.
   Business users often put many details into one message (budget, dates, place, data, supplier, success criteria). Capture all of them so they are never asked again. Use null for unknown. Never invent facts.
   If they say they don't know the value, estimate a realistic total in ${CONFIG.currency} (€, never £ or $), set value_is_estimate true, and tell them your estimate and its basis.
   Any answer counts, including "no", "not sure" or "none". Record it.
2. Write "reply":
   - Start with a short, natural reaction to what they said (vary it; do not start with "Got it" every time). Show you understood, using their words.
   - If their message covered several details at once, say briefly what you captured (a few words each), so they see nothing was lost.
   - Where it helps, add one useful remark in plain words: an existing contract or preferred supplier for this, a typical price, or why the next question matters.
   - Then ask about the FIRST item in still_needed that is still unknown after your update. One question at a time; you may combine it with the second item only when they naturally belong together (for example start date and duration).
   - If the user's answer already covers later items in still_needed, record those too so they are not asked again. Include a short, concrete example that fits their need, written into the sentence (for example "such as a current-state process map and a rollout plan").
   - 2 to 4 sentences. Warm, direct, plain English. No procurement jargon, no bullet lists, no headings.
   - The reply is read by a business colleague. NEVER mention field names or internal terms (such as ict_outsourcing, tech_service, personal_data, still_needed, facts, JSON), values like true, false or null,
     or what you "set" or "recorded" in which field. Say it in plain words instead, for example "Noted, the supplier will run it for you."
   - Never name or decide the buying route yourself. Never ask about something not in still_needed.
3. If nothing in still_needed is unknown after your update, set "complete" true and reply with one sentence saying you have what you need.
4. "choices": up to 4 very short answers only when your question is a closed one (yes/no, a duration band, a number of people). Otherwise [].
5. Quality check of the user's latest answer, in "assessment": {"fact":"key of the item they answered","ok":true,"issue":"","follow_up":"","score":1-10}.
   score rates how useful the answer is for the request: 9-10 clear and complete, 6-8 usable but thin, 3-5 vague, 1-2 off-topic. Accepting a suggestion counts as 9.
   Set ok to false when the answer has nothing to do with the question or the request (for example a recipe, a joke or random text): then use issue "off-topic", do NOT record it as a fact, and ask the question again.
   Also set ok to false when the answer is clearly too vague to act on ("stuff", "the usual"), contradicts earlier facts, or is implausible
   (for example a budget far too low for the work described, a start date that has passed, "no personal data" for an HR or payroll system).
   Reasonable answers are ok, even if short. Never challenge an item listed in already_checked.
   When ok is false, "reply" must be only a short, friendly follow-up that names the issue and asks to confirm or correct it. Do not ask the next item in that case.
6. If pending_check is set, the user is answering your earlier check on that item: update the fact if they corrected it, keep it if they confirmed it.
Keep the conversation light: ask only what is in still_needed, and never ask about cost centres, payment models, subcontractors, certifications, service levels, ownership of work or evaluation weights unless the user raises them.

Fact keys:
summary (one plain sentence describing the need), category (one of: ${CATEGORIES.map(c=>`${c.id} = ${c.name}`).join("; ")}), demand_type (goods | services | software | contingent_labour),
Category rules: "cloud" is hosting and infrastructure only (servers, storage, data centre). A business application used as a service (HR, payroll, CRM, finance, procurement tools), even if cloud-based or SaaS, is "software" with demand_type software.
item, quantity (number), value (total ${CONFIG.currency}, number), value_is_estimate (bool), deliverables (one string), duration, needed_by (as they said it),
location (delivery place or where the work happens), supplier (name, or "None"), supplier_reason, personal_data (true | false | "unsure"),
tech_service (true | false | "unsure": the supplier provides, runs or supports technology or data for us), ict_outsourcing (true | false | "unsure": the supplier runs something for us on an ongoing basis that we would otherwise do ourselves; SaaS alone is not outsourcing),
critical_service (bool), offshore (bool), budget_approved ("yes" | "no" | "partly"),
role, headcount (number), skills, day_rate, system_access (true | false | "unsure"), renewal_change, wants_renewal (true if they want to renew or extend an existing contract),
contract_ok (true only if the user explicitly agrees to use the existing contract you asked about; false if they decline. "No preference" is NOT agreement),
decline_contract (true if they decline the existing contract),
background (the business problem it solves and why now), users (target audience: who will use or benefit), functions (supported functions or teams), benefits (key benefits and measurable outcomes), usp (unique selling points: what makes it different),
reg_benefits (regulatory, control, governance or resilience benefits), current_solution (what is used today and why it can't be done internally),
impact_delay (what happens if it doesn't go ahead or is delayed), must_haves (key capabilities it must have), acceptance (how success is judged),
Never ask for something the user already said anywhere in the conversation, even in an answer to a different question: record it instead.
When one answer covers several items (for example the problem, who it is for and what is used today), record every one of them.
The personal_data question also asks which data and where it is stored: record data_details from the same answer. If the user says the supplier will host or run it, also set ict_outsourcing true.
New demand facts: scope_in (what the provider must do and deliver; also record deliverables from the same answer), scope_out, acceptance, acc_review, qualifications, service_levels, kpis,
support_model, service_hours, tools, gov_meetings, reporting, change_mgmt, escalation, supplier_terms, our_deps, prov_assumptions, other_risks,
entity (the legal entity that uses the service and signs: one of ${ENTITIES.map(e=>`${e.id} = ${e.name}`).join("; ")}), in_house (true if our own teams do this today or would normally do it themselves, false if we would always buy it in),
ongoing (true for an ongoing service, false for a one-off), important_fn (true only if the user says it supports a critical or important function), title (working title), l4 (Level 4 code, see below).
Level 4 list: ${L4.map(e=>`${e.code} ${e.name}`).join("; ")}. On the first message set l4 to the best matching code, l4_match (0-100) and l4_reason (one short plain sentence).
If the user types "skip", record nothing for that item.
At the check step (asking = confirm_derived) the user confirms or corrects facts the app worked out; record any correction (entity, ongoing, in_house, tech_service, important_fn, personal_data, title, l4) and reply briefly. Never decide outsourcing yourself.
Suggested answers: items marked suggest=true in still_needed are answered by suggestion. When you ask one, put a concrete suggestion tailored to this request in "suggestion"
(based only on what the user said; plain words, several points separated by semicolons), and in "reply" say briefly that this is your suggestion, show it, and ask whether it fits or what to change.
When an item has "lines", the suggestion must be exactly those lines, each "Label: text" on its own line, in that order.
Never record a suggestion as a fact yourself; the app does that when the user accepts it. If the user changes a suggestion, record their version of that item.
Combined questions: the "background" question also asks the impact of delay, so record background and impact_delay from that one answer.
The software "must_haves" question also asks how success is judged, so record must_haves and acceptance from that one answer. evaluation_priority, supplier_requirements, current_supplier ("None" if new),
volume, support_needs, data_details (which data and where stored), criticality (what happens if it stops; also set critical_service true if clients or regulated activity are hit),
subcontracting (true | false | "unsure"), pricing_model, service_levels, ip_ownership, performance (how the current supplier performed).
External workers or contractors are demand_type contingent_labour.

${contextLines()}

Return JSON only: {"facts":{...only keys you are setting...},"reply":"","asking":"the key from still_needed your question is about","choices":[],"complete":false,"suggestion":"","assessment":{"fact":"","ok":true,"issue":"","follow_up":"","score":10}}
"asking" must be the key of the first unknown item in still_needed. Do not ask about anything else.`;
}
function contextLines(){
  const c=S.f.category;
  if(!c) return "Context: none yet (category unknown).";
  const ctr=CONTRACTS.filter(x=>x.category===c), pref=PREFERRED[c]||[], cat=GOODSLIKE(S.f)?CATALOGUE:[];
  return "Context you may use in remarks:"+
    (ctr.length?`\nActive contracts for this category: ${ctr.map(x=>`${x.title} with ${x.supplier} (ends ${x.expires})`).join("; ")}.`:"\nNo active contract for this category.")+
    (pref.length?`\nPreferred suppliers: ${pref.join(", ")}.`:"")+
    (cat.length?`\nCatalogue: ${cat.map(x=>`${x.name} ${money(x.price)}`).join("; ")}.`:"");
}
function stateBlock(pend){
  const f=S.f, still=S.missing.map((k,i)=>i<3?{key:k,label:FACTS[k].label,stage:STAGES[stageOf(k)].name,ask:FACTS[k].q(f),example:(FACTS[k].ex(f)||""),...(isSug(k)?{suggest:true}:{}),...(BUNDLES[k]?{lines:BUNDLES[k].map(([L])=>L)}:{})}:{key:k,label:FACTS[k].label});
  return `\n\n[STATE]\nknown_facts: ${JSON.stringify(Object.fromEntries(Object.entries(f).filter(([k,v])=>known(v)&&v!==false)))}\n`+
    (S.det?`route_so_far: ${CHANNELS[S.det.route].name}\n`:"")+
    `already_checked: ${JSON.stringify(Object.keys(S.challenged||{}))}\n`+
    (pend?`pending_check: ${JSON.stringify({fact:pend.fact,issue:pend.issue,previous_value:pend.prev})}\n`:"")+
    `still_needed (ask the first unknown one): ${JSON.stringify(still)}`;
}
function chatHistory(){
  const out=[];
  for(const m of S.msgs){
    if(m.kind) continue;
    const role=m.role==="user"?"user":"assistant";
    if(out.length && out[out.length-1].role===role) out[out.length-1].content+="\n"+m.text;
    else out.push({role,content:m.text});
  }
  if(out[0]&&out[0].role!=="user") out.shift();
  return out;
}

// the AI must never show internal field names or values to the user; remove such sentences, or fall back to the standard question
const INTERNAL_KEYS=new RegExp(`\\b(?:${Object.keys(BLANK_FACTS).filter(k=>k.includes("_")).join("|")}|still_needed|known_facts|already_checked|pending_check|route_so_far|facts?\\s*(?:object|json)|json)\\b`,"i");
const INTERNAL_VALS=/\b(?:set|setting|recorded|marked|flagged|updated|stored)\b[^.?!]{0,40}\b(?:to|as)\s+(?:true|false|null|unsure)\b|(?:\b(?:is|as|to|equals)\s+|[=:]\s*)(?:true|false|null)\b/i;
function cleanReply(t){
  if(!t || typeof t!=="string") return t;
  const sents=t.split(/(?<=[.!?])\s+/), kept=sents.filter(x=>!INTERNAL_KEYS.test(x) && !INTERNAL_VALS.test(x)).map(x=>x.replace(/\b[a-z]+(?:_[a-z]+)+\b/g,"").trim()).filter(Boolean);
  return kept.length===sents.length ? t : (kept.join(" ").trim() || null);
}
class Stale extends Error{}
const guard = cid => { if(S.cid!==cid) throw new Stale(); };   // the user started a new conversation meanwhile
async function handleUser(text){
  S.holdScroll=false;
  text=text.trim(); if(!text||S.busy) return;
  const cid=S.cid;
  try{ await handleTurn(text, cid); }
  catch(e){ if(e instanceof Stale) return; console.error(e); if(S.cid===cid) S.msgs.push({role:"assistant",kind:"sys",text:"Something went wrong on my side. Please send that again."}); }
  finally{ if(S.cid===cid){ S.busy=false; render(); } }
}
async function handleTurn(text, cid){
  // answer to the offer to improve a below-threshold description
  if(S.offerImprove){
    const tt=text.trim();
    if(/^(?:yes|yep|yeah|let'?s|improve|ok(?:ay)?|sure|go(?: ahead)?)\b/i.test(tt)) return startImprovement(tt);
    if(/submit anyway|^no\b|not now|^skip|leave it/i.test(tt)){ S.msgs.push({role:"user",text:tt}); S.offerImprove=null; S.belowThresholdOk=true; S.choices=[];
      S.msgs.push({role:"assistant",text:"Okay. The rating and the open points stay visible to the buyer. Press \"Looks right, submit\" on the service description when you're ready."}); render(); return; }
    S.offerImprove=null;
  }
  if(S.sd && /^(make it|shorten|shorter|add more|rewrite|reword)|\b(summary|description|document)\b/i.test(text) && aiReady()) return refineSD(text);
  const asked=S.lastAsked; if(asked) S.asked[asked]=(S.asked[asked]||0)+1;
  const um={role:"user",text}; S.msgs.push(um); S.choices=[]; S.busy=true; render();
  const before={...S.f};
  // the user is answering a check we raised on an earlier answer
  const pend=S.pending; S.pending=null;
  const t=text.trim().toLowerCase();
  const keepIt = pend && pend.kind!=="offtopic" && (/^(yes|yep|yeah|correct|that'?s (right|correct)|right|confirmed?|it is|keep( it)?( as it is)?|as i said|it'?s fixed|fixed|hard deadline|that'?s fine|fine)\b/.test(t) || /is right$/.test(t)) && !/\d/.test(t.replace(/^[^\d]*right/,"")) && words(text)<=6;
  if(pend && !keepIt && pend.kind!=="date") S.f[pend.fact]=null;
  let reply=null, choices=[], complete=false, note=null, aiAsking=null, aiCheck=null, aiSuggestion=null, aiScore=null;
  if(aiReady()){
    try{
      const transcript=S.msgs.filter(m=>!m.kind).slice(0,-1).slice(-8).map(m=>`${m.role==="user"?"User":"Assistant"}: ${m.text}`).join("\n");
      const out = await callLLM(chatSystem(), [{role:"user",content:`${transcript?`Conversation so far:\n${transcript}\n\n`:""}Latest user message:\n${text}${stateBlock(pend)}\n\nAnswer with the JSON object only.`}]);
      guard(cid);
      if(!(pend && keepIt)) mergeFacts(out.facts||{}); else { const nf={...(out.facts||{})}; delete nf[pend.fact]; mergeFacts(nf); }
      if(asked && !known(S.f[asked]) && CLOSED.includes(asked)){ const v=readAnswer(asked,text); if(known(v) && v!=="unsure"||/sure|know/i.test(text)) S.f[asked]=v; }
      if(!(pend && keepIt)) offlineRead(text, asked);
      reply=out._raw?null:cleanReply(out.reply||null); if(reply && !/\?/.test(reply) && !out.complete) reply=null; choices=out.choices||[]; complete=!!out.complete; aiAsking=out.asking||null;
      if(out.assessment && out.assessment.ok===false && out.assessment.fact) aiCheck=out.assessment;
      aiSuggestion=out.suggestion||null;
      if(out.assessment && Number(out.assessment.score)>=1 && Number(out.assessment.score)<=10) aiScore=Math.round(Number(out.assessment.score));
    }catch(e){
      if(e instanceof Stale) throw e; guard(cid);
      const quota=e.quota||/quota|rate limit|429/i.test(e.message||""), slow=e.name==="TimeoutError"||e.name==="AbortError";
      const auth=/access code/i.test(e.message||"");
      note = auth ? "This demo needs an access code for the AI. Open Rules and enter it. Until then I'm using standard questions." : quota ? "The AI has reached its usage limit, so I'm using standard questions for now." : slow ? "The AI took too long, so I'm using standard questions for now." : "The AI services aren't answering right now, so I'm using standard questions for now.";
      if(!(pend && keepIt)) offlineRead(text, asked);
    }
  } else if(!(pend && keepIt)) offlineRead(text, asked);

  // a suggestion the user accepted (or extended) becomes the answer
  const sugResult = asked && !pend && isSug(asked) ? applySuggestion(asked, text) : false;
  if(asked && !pend && isSug(asked) && !sugResult && known(S.f[asked]) && ACCEPT.test(text.trim())) S.f[asked]=null;
  if(sugResult) S.sugAccepted[asked]=true;
  if(asked && BUNDLES[asked] && !sugResult && !pend && givenText(S.f[asked]) && S.f[asked]!=="Confirmed" && !BUNDLES[asked].some(([,x])=>givenText(S.f[x]))){
    const free={kpis_pack:"kpis"}[asked]; if(free){ S.f[free]=String(S.f[asked]); } else setFromSuggestion(asked, String(S.f[asked])); }
  // "skip": the point is recorded as to be determined and listed as an open point
  const skipped = asked && !pend && !["need","confirm_derived"].includes(asked) && /^(skip|skip (?:for now|this|it)|pass)[.!]?$/i.test(text.trim());
  if(skipped){ S.f[asked]="Not given"; if(BUNDLES[asked]) BUNDLES[asked].forEach(([,k])=>{ if(!known(S.f[k])) S.f[k]="Not given"; }); }
  // the check step: confirm what the rules worked out, or correct it in plain words
  if(asked==="confirm_derived" && !pend){
    const tt=text.trim();
    if(!S.checkWait && /^(yes|yep|yeah|correct|that'?s (?:all )?(?:right|correct)|all (?:good|correct|right)|looks (?:good|right)|confirm(?:ed)?)\b/i.test(tt) && !/\bbut\b/i.test(tt)) S.f.confirm_derived="Confirmed";
    else if(!S.checkWait && /^(?:no|nope|something'?s (?:wrong|not right)|not (?:quite )?right|wrong)[.!]?$/i.test(tt)){
      S.checkWait=true; S.f.confirm_derived=null; um.score=null;
      S.msgs.push({role:"assistant",text:"What's not right? Tell me in your own words, for example \"it's a one-off\", \"our teams don't do this today\", \"it's for the Singapore branch\" or \"the category should be technology consulting\"."});
      S.lastAsked="confirm_derived"; S.busy=false; render(); return;
    } else {

      S.f.confirm_derived = S.checkRound>=2 ? "Confirmed with corrections" : null;
    }
  }
  // close the check: keep, correct or (for dates) mark as flexible
  if(pend){
    if(pend.kind==="date"){
      const nd = parseWhen(text) && !/fixed|can move|flexible|later/.test(t) ? text.trim() : null;
      if(nd && nd!==pend.prev){ S.f.needed_by=cap1(nd); S.flags.push({fact:pend.fact,issue:pend.issue,status:"corrected"}); }
      else { S.f.needed_by=pend.prev; S.flags.push({fact:pend.fact,issue:pend.issue,status:/move|flexible|later/.test(t)?"flexible":"confirmed"}); }
    } else if(pend.kind==="thin"){
      const nv=S.f[pend.fact], kept=keepIt||/^keep|^no\b|that'?s (?:it|all)/i.test(t);
      if(kept || !known(nv)){ S.f[pend.fact]=pend.prev; S.flags.push({fact:pend.fact,issue:pend.issue,status:"confirmed"}); }
      else { if(pend.prev && typeof nv==="string" && !nv.includes(String(pend.prev)) && words(nv)<15) S.f[pend.fact]=`${pend.prev}; ${nv}`;
        if(BUNDLES[pend.fact]){ BUNDLES[pend.fact].forEach(([,x])=>{ if(isTBD(S.f[x])) S.f[x]=null; }); const free={kpis_pack:"kpis"}[pend.fact]; if(free) S.f[free]=String(S.f[pend.fact]); else setFromSuggestion(pend.fact,String(S.f[pend.fact])); }
        S.flags.push({fact:pend.fact,issue:pend.issue,status:"corrected"}); }
    } else if(pend.kind==="offtopic"){
      const nv=S.f[pend.fact];
      if(!known(nv) || offTopic(pend.fact, nv) || nv===pend.prev){ S.f[pend.fact]="Not given"; S.flags.push({fact:pend.fact,issue:"no usable answer given",status:"unanswered"}); }
      else S.flags.push({fact:pend.fact,issue:pend.issue,status:"corrected"});
    } else {
      if(!known(S.f[pend.fact])) S.f[pend.fact]=pend.prev;
      S.flags.push({fact:pend.fact,issue:pend.issue,status: JSON.stringify(S.f[pend.fact])===JSON.stringify(pend.prev)?"confirmed":"corrected"});
    }
  }

  if(asked && asked!=="confirm_derived" && !known(S.f[asked]) && (S.asked[asked]||0)>=2) giveUp(asked);
  const prevRoute=S.det&&S.det.route, prevStages=[...(S.stageIds||[])];
  refresh();
  // first classification against the Level 4 list, shown straight away
  if(!prevRoute && S.det && !S.l4Initial){ S.l4Initial=initialL4(); S.msgs.push({role:"assistant",kind:"class"}); }
  if(note) S.msgs.push({role:"assistant",kind:"sys",text:note});

  // quality check of what changed this turn: rules first, then the AI's view; one challenge per item, three per conversation
  const changed=Object.keys(FACTS).filter(k=>known(S.f[k]) && JSON.stringify(before[k])!==JSON.stringify(S.f[k]) && (S.req||[]).concat(["value","needed_by"]).includes(k) && !(pend&&pend.fact===k));
  if(changed.some(k=>["day_rate","duration","headcount","deliverables","quantity"].includes(k)) && known(S.f.value) && !changed.includes("value")) changed.push("value");
  if(prevRoute && S.det && prevRoute!==S.det.route && known(S.f.needed_by) && !changed.includes("needed_by")) changed.push("needed_by");
  let issue = findIssue(changed);

  const aiOff = aiCheck && /off.?topic|unrelated|not related|does(?:n.?t| not) (?:answer|relate)|irrelevant|nothing to do/i.test(aiCheck.issue||"");
  if(!issue && aiOff && FACTS[aiCheck.fact] && !S.offChecked[aiCheck.fact] && aiCheck.fact!==(pend&&pend.fact)) issue=offTopicIssue(aiCheck.fact);
  if(!issue && aiCheck && S.challengeCount<3 && changed.includes(aiCheck.fact) && !S.challenged[aiCheck.fact] && FACTS[aiCheck.fact])

function parseMoney(s){

function mergeExec(base, ai){

const NARR_MAX=1000;
function clampText(t, max=NARR_MAX){
  const seen=new Set(); t=String(t||"").replace(/\s+/g," ").trim().split(/(?<=[.!?])\s+/).filter(x=>{const k=x.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;}).join(" ");

}
function composeNarrative(d){

// the AI version, checked in code: anything captured elsewhere is removed; an empty section falls back to the answers
function mergeDesc(base, ai){

const nonEmpty = v => Array.isArray(v) ? v.filter(x=>x&&(typeof x!=="object"||Object.values(x).some(Boolean))).length>0 : !!(v&&String(v).trim());
function mergeBRD(base, ai){

function qualityHTML(){
  const q=S.quality; if(!q) return "";

  const seen=new Set(), list=items.filter(x=>{ const k=x.html.replace(/<[^>]+>/g,"").toLowerCase().slice(0,60); if(seen.has(k)) return false; seen.add(k); return true; });

    `Data, system, money and account access: ${a.any?(givenText(f.data_details)||"yes"):f.personal_data===false?"none":"to be determined"}${a.money?" (money or accounts)":""}`,`Location and cross-border: ${givenText(f.location)||"to be determined"}${(yes(f.offshore)||/offshore|other country/i.test(f.location||""))?" (cross-border)":""}`,
    `Estimated value: ${known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"to be determined"}`,`Subcontracting: ${known(f.subcontracting)?show("subcontracting",f.subcontracting):"to be determined"}`,
    `Known dependencies: ${L(X.our_deps).join("; ")||"none stated"}`,`Known assumptions: ${L(X.assumptions).join("; ")||"none stated"}`,`Open points: ${L(X.open_points).length}`].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <p>Materiality cannot be finally determined from this intake alone. The captured attributes should be used as input to the applicable materiality determination process.</p>`;
  const q=sectionQuality();
  const qtab=`<table><tr><th style="width:30%">Section</th><th style="width:110px">Status</th><th>Issue or gap</th><th>Recommended improvement</th></tr>${q.map(r=>`<tr><td>${esc(r.sec)}</td><td class="st-${r.status.replace(/\s/g,"")}">${esc(r.status)}</td><td>${esc(r.issue)}</td><td>${esc(r.fix)}</td></tr>`).join("")}</table>`;
  const facts=Object.entries(f).filter(([k,v])=>FACTS[k]&&known(v)&&!BUNDLES[k]&&k!=="ict_outsourcing").map(([k,v])=>`<tr><td>${esc(FACTS[k].label)}</td><td>${esc(show(k,v))}</td></tr>`).join("");
  const convo=S.msgs.filter(m=>!m.kind).map(m=>`<p><b>${m.role==="user"?"Requester":"Intake assistant"}:</b> ${esc(m.text)}</p>`).join("");
  return `<div class="brd">
  <div class="kicker">Service description for approval to source</div><h1>${esc(d.title)}</h1>
  ${kv([["Reference",S.submitted||"Draft, not yet submitted"],["Version and status",S.submitted?"1.0, submitted":"0.1, draft for review"],["Date",date],["Category (Level 4)",fin.code?`${fin.name} (${fin.code})`:"—"],["Buying route",`${ch.name}, typically ${ch.days} working days`],["Quality",S.quality?`${S.quality.rating}, ${S.quality.score}/100 (threshold ${CONFIG.thresholds.qualityMin})${S.quality.score<CONFIG.thresholds.qualityMin?(S.submitted?", submitted below the threshold":", below the threshold"):""}`:""],["Estimated value",known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"To be determined"]])}
  <h2>Part 1. Executive service description</h2><div class="lead">${descHTML(false)}</div>
  <h2>Part 2. Detailed service description</h2>${body}
  <h2>Part 3. Structured sourcing input attributes</h2>${attrs}
  <h2>Part 4. Materiality and governance input summary</h2>${mat}
  <h2>Part 5. Compact sourcing request description</h2><div class="lead"><p>${esc(d.compact)}</p></div>
  <h3>Optional very short description (500 characters or fewer)</h3><p>${esc(d.short500)}</p>
  <h2>Part 6. Service description quality check</h2><p><b>${esc(S.quality?S.quality.rating:"")}</b>${S.quality?`, ${S.quality.score}/100`:""}.</p>${qtab}
  <h2>Part 7. Level 4 classification, final validation</h2>${kv([["Final",fin.code?`${fin.name} (${fin.code})${fin.match?`, ${fin.match}% match`:""}`:"—"],["Reasoning",fin.reason],["Remaining uncertainty",fin.uncertainty||"None noted"]])}
  <p><b>${fin.changed?"The Level 4 classification has changed due to refined scope.":"The initial Level 4 classification is confirmed."}</b>${fin.changed?` Initial: ${esc(fin.from.name)} (${esc(fin.from.code)}). Final: ${esc(fin.name)} (${esc(fin.code)}). ${esc(fin.why)}`:""}</p>
  <h2>Appendix A. Details captured in the intake</h2><table class="kv">${facts}</table>
  <h2>Appendix B. Intake conversation</h2><div class="conv small">${convo}</div>
  </div>`;
}
function openBRD(){
  const html = S.brdEdited || brdHTML();
  $("#docRoot").innerHTML=`<div class="docwrap"><div class="doctools">
      <b>${S.sd.detail?"Service description":"Business requirements document"}</b><span class="muted hide-sm">Click any text to edit</span><span class="sp"></span>
      <button class="btn btn-g" data-doc="print">Print or save as PDF</button><button class="btn btn-g" data-doc="word">Download Word</button>
      <button class="btn btn-g hide-sm" data-doc="json">JSON</button><button class="btn btn-p" data-doc="close">Close</button></div>
    <div class="paper" id="paper" contenteditable="true" spellcheck="false">${html}</div></div>`;
  document.body.classList.add("doc-open");
  $("#paper").addEventListener("input",()=>S.brdEdited=$("#paper").innerHTML);
  document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.doc;
    if(a==="close"){ $("#docRoot").innerHTML=""; document.body.classList.remove("doc-open"); }
    if(a==="print") window.print();
    if(a==="json") download();
    if(a==="word") downloadWord();
  });
}
function downloadWord(){
  const body=($("#paper")||{}).innerHTML || brdHTML();
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(S.sd.title)}</title><style>${DOC_CSS}.brd .two{display:block}</style></head><body>${body}</body></html>`;
  const b=new Blob(["﻿",doc],{type:"application/msword"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`BRD - ${S.sd.title.replace(/[^\w\- ]+/g,"").slice(0,60)}.doc`; a.click();
}
function bind(){
  const o=$("#ovr"); if(o) o.onchange=e=>{S.override=e.target.value;render();};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="submit") submit(); if(a==="json") download(); if(a==="brd") openBRD();
    if(a==="more"){ S.showMore=!S.showMore; render(); }
    if(a==="copy") navigator.clipboard?.writeText(sdText()).then(()=>b.textContent="Copied");
    if(a==="copycompact") navigator.clipboard?.writeText(S.sd.compact||"").then(()=>b.textContent="Copied");
    if(a==="copyshort") navigator.clipboard?.writeText(S.sd.short500||"").then(()=>b.textContent="Copied");
  });
  document.querySelectorAll("[data-sd]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sd; S.sd[k]=el.textContent.trim(); S.brdEdited=null;}));
  document.querySelectorAll("[data-sec]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sec, d=S.sd.desc;
    d[k] = Array.isArray(d[k]) ? el.innerText.split(el.tagName==="TD"?/;|\n/:/\n/).map(x=>x.trim()).filter(Boolean) : k==="narrative" ? clampText(el.textContent) : k==="exec" ? [...el.querySelectorAll("p")].map(p=>p.textContent.trim()).filter(Boolean).join("\n\n")||el.innerText.trim() : el.textContent.trim();
    S.brdEdited=null;}));
}

function renderSide(){
  const f=S.f, D=S.det;
  if(!D){ $("#side").innerHTML=`<div class="panel"><div class="eyebrow">Your request</div><p class="muted" style="margin:8px 0 0">Start by describing what you need. The route and what's needed for it appear here.</p></div>${sideNote()}`; return; }
  const req=S.req||[], done=req.filter(k=>known(f[k])).length, pct=req.length?Math.round(done/req.length*100):100;
  const groups=S.stageIds.filter(id=>id!=="review").map(id=>{
    const ks=stageFacts(id); const all=ks.every(k=>known(f[k]));
    return `<div class="grp"><span>${esc(stageById(id).name)}</span>${all?"<em>✓ done</em>":""}</div>`+
      ks.map(k=>{const ok=known(f[k]), nx=!ok&&S.missing[0]===k; return `<div class="fact ${ok?"ok":""} ${nx?"next":""}"><span class="ic">${ok?"✓":""}</span><span class="k">${FACTS[k].label}</span><span class="v">${ok?esc(show(k,f[k])):nx?"asking now":"—"}</span></div>`;}).join("");
  }).join("");
  $("#side").innerHTML=`<div class="panel">
      <div class="eyebrow">Route ${S.missing.length?"so far":""}</div>
      <div class="route">${CHANNELS[S.override||D.route].name}</div>
      <div class="prov">${S.missing.length?"May change as you answer":"Ready"} · ${esc(catById(f.category).name)}</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="muted">${done} of ${req.length} details for this route</div>
      ${groups}
    </div>${sideNote()}`;
}
const sideNote=()=>`<div class="panel muted">The route and the details it needs come from fixed rules (editable under Rules). The AI only runs the conversation and writes the description.</div>`;

/* =========================================================
   10. SETTINGS
   ========================================================= */
function openSettings(){
  const T=CONFIG.thresholds, hosted=!!SERVER;
  const aiOn=CONFIG.provider!=="offline";
  const names={gemini:"Gemini",groq:"Groq",mistral:"Mistral"};
  const chain=hosted?[SERVER.providers.gemini&&"Gemini",SERVER.providers.groq&&"Groq",SERVER.providers.mistral&&"Mistral"].filter(Boolean):[];
  $("#drawerRoot").innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer">
    <header><h3>Rules</h3><button class="btn btn-g" id="close">Close</button></header>
    <div class="body">
      <section><div class="eyebrow">Route rules</div>
        <p class="muted" style="margin:6px 0 0">Owned by the business. Changes apply to the current request straight away.</p>
        <label>Business-led sourcing up to (${CONFIG.currency}); above it procurement runs an RFP</label><input class="inp" type="number" id="t2" value="${T.quickQuoteMax}">
        <label>Material spend review from (${CONFIG.currency})</label><input class="inp" type="number" id="t3" value="${T.materialityMin}">
        <label>Quality needed before submitting (0–100); below it the chat offers an improvement round</label><input class="inp" type="number" id="t4" value="${T.qualityMin}">
        <label>Answer score that triggers a tip (1–10)</label><input class="inp" type="number" id="t5" value="${T.answerTip}"></section>
      <section><div class="eyebrow">AI</div>
        ${hosted?`
          <label class="tgl"><input type="checkbox" id="aiToggle" ${aiOn?"checked":""}><span>Use AI for the conversation and the documents</span></label>
          <p class="muted" style="margin:8px 0 0">${aiOn?`Connected through the server: ${chain.join(", then ")}${chain.length>1?" as backup":""}. Keys are stored on Vercel, never in this page.${SERVER.last?` Last answer from ${names[SERVER.last]||SERVER.last}.`:""}`:"Off: standard questions and documents built from the rules. Nothing leaves the browser."}</p>
          ${SERVER.accessRequired&&aiOn?`<label>Access code</label><input class="inp" type="password" id="ac" value="${esc(CONFIG.accessCode)}">`:""}`
        :`<div class="seg" id="prov">${["gemini","groq","offline"].map(p=>`<button data-p="${p}" class="${CONFIG.provider===p?"on":""}">${({gemini:"Gemini key",groq:"Groq key",offline:"Offline"})[p]}</button>`).join("")}</div>
          <p class="muted" style="margin:8px 0 0">No server found, so this page is running from a file. A key entered here stays in this tab only.</p>
          <div id="pf"></div><div id="test"></div>`}
      </section>
    </div></div>`;
  if(hosted){
    $("#aiToggle").onchange=e=>{ CONFIG.provider=e.target.checked?"server":"offline"; render(); openSettings(); };
    const ac=$("#ac"); if(ac) ac.oninput=e=>{ CONFIG.accessCode=e.target.value.trim(); try{sessionStorage.setItem("ac",CONFIG.accessCode);}catch(x){} };
  } else {
    const pf=()=>{const p=CONFIG.provider;
      if(p==="offline"||p==="auto"){ $("#pf").innerHTML=`<div class="alert info">Standard questions with examples. Nothing leaves the browser.</div>`; return; }
      $("#pf").innerHTML=`<label>${names[p]} API key</label><input class="inp" type="password" id="key" value="${esc(CONFIG.keys[p])}"><label>Model</label><input class="inp" id="model" value="${esc(CONFIG.models[p])}"><button class="btn btn-g" id="tbtn" style="margin-top:12px">Test connection</button>`;
      $("#key").oninput=e=>{CONFIG.keys[p]=e.target.value.trim();render();}; $("#model").oninput=e=>CONFIG.models[p]=e.target.value.trim();
      $("#tbtn").onclick=async()=>{$("#test").innerHTML=`<div class="alert info">Testing…</div>`;try{await callLLM('Return JSON {"ok":true}',[{role:"user",content:"ping, reply in json"}]);$("#test").innerHTML=`<div class="alert info">Connected.</div>`;}catch(e){$("#test").innerHTML=`<div class="alert err">${esc(e.message)}</div>`;}};
    };
    pf();
    document.querySelectorAll("#prov button").forEach(b=>b.onclick=()=>{CONFIG.provider=b.dataset.p;document.querySelectorAll("#prov button").forEach(x=>x.classList.toggle("on",x===b));pf();render();});
  }
  [["#t2","quickQuoteMax"],["#t3","materialityMin"],["#t4","qualityMin"],["#t5","answerTip"]].forEach(([id,k])=>$(id).oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v))CONFIG.thresholds[k]=v;});
  const close=()=>{$("#drawerRoot").innerHTML=""; if(S.det){refresh(); if(!S.missing.length && S.sd) showRecommendation();} render();};
  $("#close").onclick=close; $("#scrim").onclick=close;
}

/* =========================================================
   11. WIRING
   ========================================================= */
function reset(){ Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,fresh()); render(); $("#inp").focus(); }
const inp=$("#inp");
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#comp").requestSubmit();}});
$("#comp").onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value="";inp.style.height="auto";handleUser(t);};
$("#doccss").textContent=DOC_CSS;
$("#cfgBtn").onclick=openSettings; $("#newBtn").onclick=reset; $("#sumBtn").onclick=()=>$("#side").classList.toggle("open");
(async()=>{
  render(); await detectServer(); resolveProvider();
  if(CONFIG.provider==="server" && SERVER.accessRequired && !CONFIG.accessCode){
    try{CONFIG.accessCode=sessionStorage.getItem("ac")||"";}catch(e){}
    if(!CONFIG.accessCode){ const c=prompt("Enter the access code for this demo:"); if(c){CONFIG.accessCode=c.trim(); try{sessionStorage.setItem("ac",CONFIG.accessCode);}catch(e){}} }
  }
  render();
})();
</script>
</body>
</html>
