<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Intake Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Guided Intake Chat (prototype)
   - Rules decide the buying route AND what must be known for that route.
   - The AI only talks: it phrases one question at a time and reads the answers.
   ========================================================= */
#gate{position:fixed;inset:0;z-index:1000;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden],#gate form[hidden]{display:none}
#gate form{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#gate h2{margin:0 0 6px;font-size:20px;color:var(--ink)} #gate p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
#gate input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px}
#gate button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#gate button:disabled{opacity:.6} #gate .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
:root{
  --navy:#0f2147; --navy-2:#1b3266; --navy-3:#2c4a8a;
  --amber:#f2a900; --amber-soft:#fff4d6; --amber-ink:#8a5d00;
  --bg:#f5f6fa; --card:#fff; --line:#e4e7ef; --line-2:#eef0f5;
  --ink:#141b2d; --ink-2:#4a5470; --ink-3:#7c859e;
  --ok:#11845b; --ok-soft:#e5f5ee; --warn:#b4570b; --warn-soft:#fdf0e3;
  --bad:#b42318; --bad-soft:#fdecea; --info:#2c4a8a; --info-soft:#eaf0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;flex:none}
.top-in{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#ffcf5c);display:grid;place-items:center;color:var(--navy);font-weight:800;flex:none}
.brand b{display:block;font-family:"Inter Tight";font-size:16px}
.brand span{font-size:12px;color:#aab6d3}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#dfe6f7;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7c859e}
.dot.on{background:#3ad29f;box-shadow:0 0 0 3px rgba(58,210,159,.2)}
.tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.tb:hover{background:rgba(255,255,255,.18)}
.only-m{display:none}
@media(max-width:900px){.only-m{display:inline-flex}.brand span,.pill{display:none}}
.howlink{background:none;border:0;padding:0;margin-left:8px;font:inherit;font-size:12px;color:#ffd36b;text-decoration:underline;cursor:pointer}
.howlink:hover,.howlink:focus-visible{color:#fff}
@media(max-width:900px){.howlink{display:block;margin:2px 0 0}}
@media(max-width:600px){.top-in{gap:8px;padding:10px 12px}.brand b{white-space:nowrap;font-size:15px}.howlink{white-space:nowrap}.tb{padding:7px 10px}}
.spec details{border:1px solid var(--line);border-radius:8px;background:#fafbfd;margin:8px 0}
.spec summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--navy-3)}
.spec pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;margin:0;border-top:1px solid var(--line)}
.spec .tw{overflow-x:auto}.spec td{overflow-wrap:anywhere}.spec code{font:12px ui-monospace,Menlo,monospace;background:#f1f3f8;padding:1px 4px;border-radius:4px}

/* layout */
.app{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:900px){.chat{border-radius:0;border:0}}
.msgs{flex:1;overflow-y:auto;padding:26px 24px 12px}
@media(max-width:600px){.msgs{padding:16px 12px 8px}}

/* welcome */
.welcome{max-width:780px;margin:6px auto 4px}
.welcome h1{font-size:21px}
.welcome p{color:var(--ink-2);margin:4px 0 8px;font-size:13.5px}
.tries{border-top:1px solid var(--line-2)}
.tryh{margin:12px 0 3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)} .tryh:first-of-type{margin-top:4px}
.tries button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;padding:5px 4px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:13.5px;line-height:1.4}
.tries button:hover{color:var(--navy);background:#fafbfd}
.tries small{flex:none;width:118px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
@media(max-width:600px){.welcome h1{font-size:19px}.tries button{font-size:13px;padding:5px 2px}.tries small{width:78px;font-size:10px}}

/* messages */
.m{display:flex;gap:10px;margin:0 0 16px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.bub{max-width:min(600px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.classcard{max-width:min(600px,85%);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;font-size:13.5px}
.classcard .ch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}.classcard .cr{margin:4px 0}
.classcard .cc{color:var(--ink-3);font-size:12px}.classcard .cm{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:var(--line-2);font-size:12px;font-weight:600}
.classcard .cx{color:var(--ink-2);font-size:12.5px;margin-top:2px}.classcard .cf{color:var(--ink-3);font-size:12px;margin-top:6px}
.ucol{display:flex;flex-direction:column;align-items:flex-end;max-width:min(600px,85%)}.ucol .bub{max-width:100%}
.m.a .bub{background:#f3f5fa;border-bottom-left-radius:5px}
.m.a .bub b{color:var(--navy)}
.m .wide{flex:1;min-width:0;max-width:680px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sys{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-4px 0 14px}

/* answer shortcuts: small, quiet, only for closed questions */
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.qr button{border:1px solid var(--line);color:var(--ink-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.qr button:hover{border-color:var(--navy-3);color:var(--navy)}

/* composer */
.comp{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;max-height:160px;min-height:48px;outline:none;line-height:1.45}
.comp textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(44,74,138,.12)}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;cursor:not-allowed}

/* recommendation + description cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#2c4a8a 0%,var(--navy) 60%);color:#fff}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink)}
.rec-h .eyebrow{color:#ffd36b}
.rec-h h2{font-size:23px;margin:3px 0 2px}
.rec-h .meta{font-size:13px;color:#c9d3ea}
.sec{padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.chk{display:flex;gap:8px;padding:3px 0}
.chk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--info-soft);color:var(--info)}
.chk i.w{background:var(--warn-soft);color:var(--warn)} .chk i.b{background:var(--bad-soft);color:var(--bad)}
.chk span{color:var(--ink-3);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);background:#fafbfd}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--amber);color:var(--navy)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.lnk{background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.more{padding:12px 20px;border-top:1px solid var(--line-2);font-size:13.5px;background:#fafbfd}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.ovr{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:#6b3a06;margin-top:8px}
.old{opacity:.6;font-size:13px;padding:10px 14px}
.sec.lead{background:#fbfaf5;border-left:3px solid var(--amber);font-size:14.5px;line-height:1.6}
.stepbar{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;overflow-x:auto;scrollbar-width:none}
.stepbar:empty{display:none}
.stepbar .st{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;font-size:13px;color:var(--ink-3);white-space:nowrap;flex:none}
.stepbar .st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.stepbar .st.done{color:var(--ink-2)} .stepbar .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepbar .st.cur{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow)} .stepbar .st.cur i{background:var(--navy);border-color:var(--navy);color:#fff}
.stepbar .st small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.stepbar .sep{flex:none;width:14px;height:1.5px;background:var(--line);align-self:center}
.stepbar.compact{overflow:hidden}
.stepbar.compact .sep{flex:1 1 auto;width:auto;min-width:6px}
.stepbar.compact .st:not(.cur){padding:6px 0}
.stepbar.compact .st.cur{flex:0 1 auto;min-width:0}
.stepbar.compact .st.cur .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:600px){.stepbar.compact{gap:2px;padding:10px 10px}.stepbar.compact .st i{width:20px;height:20px;font-size:10.5px}.stepbar.compact .sep{min-width:3px}.stepbar.compact .st.cur{padding:5px 8px;gap:5px}.stepbar.compact .st.cur small{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stagemark{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-3);font-size:12px}
.stagemark:before,.stagemark:after{content:"";flex:1;height:1px;background:var(--line)}
.stagemark b{color:var(--navy);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stagemark span{display:block;text-align:center;line-height:1.4}
.recap{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:min(560px,85%);overflow:hidden;box-shadow:var(--shadow)}
.recap .rh{padding:10px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px}
.recap .rb{padding:8px 14px 10px}
.recap .rr{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
.recap .rr span:first-child{color:var(--ink-3);width:120px;flex:none}
.recap .rf{font-size:12.5px;color:var(--ink-3);padding:0 14px 10px}
.recap.mini{box-shadow:none;background:#f8faf9;border-color:#e3efe9}
.recap.mini .rh{background:transparent;font-weight:500;padding:7px 12px}
.m.a .bub.qchk{background:var(--amber-soft);border:1px solid #f3dfa6}
.m.a .bub.qchk:before{content:"Quick check · ";font-weight:600;color:var(--amber-ink)}
.sec.qual .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.qbadge{font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.q-strong,.q-good{background:var(--ok-soft);color:var(--ok)} .q-fair{background:var(--warn-soft);color:var(--warn)} .q-needs{background:var(--bad-soft);color:var(--bad)}
.qlist{list-style:none;margin:8px 0 0;padding:0}
.qlist li{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.qlist li:before{flex:none;width:18px;text-align:center;font-weight:700}
.qlist li.warn:before{content:"!";color:var(--warn)} .qlist li.opt:before{content:"+";color:var(--info)} .qlist li .lnk{margin-left:auto;flex:none;align-self:flex-start;color:var(--navy-3);font-weight:600;text-decoration:none} .qlist li.info:before{content:"i";color:var(--info)} .qlist li.ok:before{content:"✓";color:var(--ok)}
.side .grp{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 0;padding:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line-2);cursor:pointer;text-align:left}
.side .grp span{display:flex;align-items:center;gap:6px}
.side .grp span:before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
.side .grp.open span:before{transform:rotate(45deg)}
.side .grp:hover,.side .grp:focus-visible{color:var(--navy-3)}
.side .grp em,.side .grp i{font-style:normal;color:var(--ok);letter-spacing:0;text-transform:none;font-weight:500}
.side .grp i{color:var(--ink-3)}
.fact.long{flex-wrap:wrap}
.fact.long .k{flex:1;width:auto}
.fact.long .v{order:3;flex-basis:calc(100% - 28px);margin-left:28px;text-align:left;font-weight:400;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.fact.long.full .v{display:block}
.sec.desc{background:#fbfaf5;border-left:3px solid var(--amber)}
.ds{margin:0 0 10px}.ds:last-child{margin:0}.ds h5{margin:0 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.ds p{margin:0;font-size:14.5px;line-height:1.55}
.ds.narr{margin-top:14px;padding-top:12px;border-top:1px dashed #e6d9b0}
.qual h5.qh{margin:10px 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sec.srq .cmp{margin:4px 0 8px;font-size:14px;line-height:1.55}.sec.srq .shortv{background:var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px}.sec.srq .shortv p{margin:3px 0 0}
.sec.srq .cpy{display:flex;gap:14px;margin-top:6px}.qcounts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.qc{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.qc.ok{background:#e6f4ec;color:#1d6b43}.qc.pa{background:#fdf3dc;color:#8a5d00}.qc.tb{background:#eef1f8;color:#3c4a6b}.qc.rk{background:#fdecea;color:#b42318}.qc.na{background:#f3f4f6;color:#6b7280}
.ds .hl{font-size:15px;margin-bottom:4px}.ds .exec p{margin:0 0 8px}.ds .exec p:last-child{margin:0}
.sumt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;background:#fff}.sumt td{border:1px solid #ece3c6;padding:6px 9px;vertical-align:top;line-height:1.45}
.sumt td:first-child{width:32%;color:var(--ink-3);font-weight:600;background:#fdfaf0}.ds ul{margin:2px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.sec.record h4 .muted{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.kvg{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;font-size:13px}.kvg span:nth-child(odd){color:var(--ink-3)}
.sec.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec.chips span{background:var(--line-2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.sec.brdlink{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f6f8fd}
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);overflow:auto;padding:0 12px 40px}
.doctools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:10px 12px;color:#fff;background:var(--navy);border-radius:0 0 10px 10px}   /* solid, so text never scrolls visibly under the buttons */
.doctools .muted{color:#c9d3ea}.doctools .sp{flex:1}
.paper{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;padding:48px 56px;box-shadow:0 20px 50px rgba(0,0,0,.3);outline:none}
@media(max-width:700px){.paper{padding:24px 18px}.hide-sm{display:none}.brd .two{grid-template-columns:1fr}}
body.doc-open{overflow:hidden}
@media print{
  body{display:block;height:auto;background:#fff}
  body.doc-open>*:not(#docRoot){display:none!important}
  .docwrap{position:static;background:none;padding:0;overflow:visible}.doctools{display:none}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .brd h2{break-after:avoid}.brd tr{break-inside:avoid}
}
.sd-h{background:var(--navy);color:#fff;padding:14px 20px}
.sd-h small{font-size:11.5px;color:#aab6d3;letter-spacing:.06em;text-transform:uppercase}
.sd-h .t{font-family:"Inter Tight";font-size:17px;font-weight:700;outline:none;margin-top:2px}
.sd [contenteditable]{outline:none;border-radius:6px}
.sd [contenteditable]:focus{background:#f6f8fd;box-shadow:0 0 0 2px rgba(44,74,138,.15)}

/* side panel */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.side{position:fixed;inset:0 0 0 auto;width:min(360px,92%);background:var(--bg);z-index:30;padding:16px;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 40px rgba(0,0,0,.15)}.side.open{transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.route{font-family:"Inter Tight";font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
.prov{font-size:12px;color:var(--ink-3)}
.prog{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c544);transition:width .4s}
.fact{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px;align-items:flex-start}
.fact:first-of-type{border-top:0}
.fact .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.fact.ok .ic{background:var(--ok);border-color:var(--ok)}
.fact.next .ic{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fact .k{color:var(--ink-3);flex:none;width:112px}
.fact .v{flex:1;text-align:right;font-weight:500;word-break:break-word}
.ed{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:13px;line-height:1;opacity:.55}
.ed:hover,.ed:focus-visible{opacity:1;color:var(--navy-3)}
.fact.editing{flex-wrap:wrap}
.fedit{display:flex;gap:6px;width:100%;margin-top:6px}
.fedit input,.fedit select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
.fedit button{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;background:var(--navy);color:#fff}
.fedit button.x{background:var(--line-2);color:var(--ink-2)}
.fact:not(.ok) .v{color:var(--ink-3);font-weight:400}
.muted{color:var(--ink-3);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer section+section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.drawer label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.tgl{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.tgl input{width:18px;height:18px;accent-color:var(--navy)}
.alert{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.err{background:var(--bad-soft);color:var(--bad)}

const GOODSLIKE = f => f.demand_type==="goods" || f.demand_type==="software";
// relevance rules: an extra question is only asked when it matters
const TECH_CATS=["software","cloud","it-services","market-data","telecom"];

const PROJECT_CATS=["consulting","legal","marketing","training","it-services","audit-tax"];
const RUNNING_RE=/\b(ongoing|recurring|retainer|managed service|run(?:s|ning)? (?:our|the) (?:service|operations?|process(?:es)?|platform|system|desk|function|back office)|operate|support desk|service desk|maintain(?:s|ing)?|maintenance|application support)\b/;
const REL = {
  pd:       f => yes(f.personal_data) || yes(f.system_access),
  // for projects a monthly report or fee does not make the work itself ongoing
  ongoingSvc: f => PROJECT_CATS.includes(f.category) ? RUNNING_RE.test(userText()) : ["cloud","telecom","software","market-data","facilities"].includes(f.category) || (known(f.duration) && monthsOf(f.duration)>=6) || /\b(ongoing|monthly|subscription|managed service|run(?:s|ning)? (?:our|the) (?:service|operations?|process(?:es)?|platform|system|desk|function|back office)|operate|support desk|service desk|maintain(?:s|ing)?|maintenance)\b/.test(userText()),   // "run the invitations" for an event is not a running service
  outsrc:   f => yes(f.tech_service) && REL.ongoingSvc(f),
  techy:    f => yes(f.ict_outsourcing) || ["cloud","it-services","software","market-data","telecom"].includes(f.category),
  ongoing:  f => yes(f.ict_outsourcing) || ["facilities","cloud","telecom","software","market-data"].includes(f.category),
  creates:  f => ["it-services","consulting","marketing"].includes(f.category) || (f.category==="software" && /build|develop|custom/.test(userText())),
  volume:   f => ["training","facilities","telecom","marketing","bpo"].includes(f.category),
  subcon:   f => yes(f.personal_data) || yes(f.ict_outsourcing),

// Only what the requester must answer for each route. Anything procurement or the supplier can supply

function requiredFor(route, f){
  const g=GOODSLIKE(f), sw=f.demand_type==="software", cont=f.demand_type==="contingent_labour", pureGoods=f.demand_type==="goods", on=(c,k)=>c?[].concat(k):[];
  const role = () => cont ? ["role","headcount","skills"] : [];
  const ong = isOngoing(f), ictOng = yes(f.tech_service) && ong, proj = kindOf(f)==="project";
  const steer = ong || (proj && givenText(f.duration) && monthsOf(f.duration)>=6);   // a project of 6 months or more gets project steering
  // data and classification: access is always asked (with details in the same answer); entity, technology and "done in-house" only when the rules can't tell
  const access = () => pureGoods ? [] : ["personal_data", ...on(yes(f.personal_data)&&!known(f.data_details),"data_details"), ...on(cont,"system_access")];
  const classif = () => pureGoods ? [] : ["tech_service","entity", ...on(ong && !excludedType(f),"in_house")];
  const impact = () => on(!S.asked.background,"impact_delay");
  switch(route){
    case "catalogue":  return ["item","quantity","needed_by","location"];
    case "contract":   return cont ? [...role(),"deliverables",...on(!contractAgreed(f),"contract_ok"),"needed_by","duration","location","day_rate","system_access",...on(REL.pd(f),"data_details")]
                       : g ? ["item","quantity",...on(!contractAgreed(f),"contract_ok"),"value","needed_by"]
                           : ["deliverables",...on(!contractAgreed(f),"contract_ok"),"needed_by","duration","value","personal_data",...on(yes(f.personal_data)&&!known(f.data_details),"data_details")];
    // business-led: the same structure, lighter (profile points bundled into one suggestion)
    case "quote":      return g
      ? ["item",...on(!sw,"quantity"),"value",...on(sw,"must_haves"),"background",...on(sw,"quantity"),"profile",...on(sw,"scope_out"),"acceptance_pack","needed_by",...on(!sw,"location"),"supplier",...access(),...classif(),"confirm_derived"]
      : [...role(),"value",...on(f.category!=="marketing","duration"),"background","profile","scope_in","scope_out","acceptance_pack",...on(REL.volume(f),"volume"),"needed_by","location",...on(cont,"day_rate"),"supplier",...access(),...classif(),"confirm_derived"];
    // procurement-led: full depth
    case "sourcing":   return g
      ? ["item",...on(!sw,"quantity"),"value","background",...impact(),"audience_fn",...on(sw,"current_solution"),"value_props","must_haves",...on(sw,"scope_out"),"acceptance_pack",...on(sw,"kpis_pack"),...on(ictOng,"service_model"),
         "needed_by",...on(!sw,"location"),"budget_approved","supplier",...on(hasSupplier(f),["supplier_reason","supplier_terms"]),...access(),...classif(),...on(sw,"deps_pack"),"other_risks","confirm_derived"]
      : [...role(),"value",...on(f.category!=="marketing","duration"),"background",...impact(),"audience_fn","current_solution","value_props","scope_in","scope_out","acceptance_pack",...on(!cont&&f.category!=="marketing","qualifications"),...on(REL.volume(f),"volume"),
         "kpis_pack",...on(ictOng,"service_model"),...on(steer,"governance"),"needed_by","location",...on(cont,"day_rate"),"budget_approved","supplier",...on(hasSupplier(f),["supplier_reason","supplier_terms"]),
         ...access(),...classif(),"deps_pack","other_risks","confirm_derived"];
  }
  return [];
}

  const ent=entityById(f.entity), rs=RULESETS.current, ex=excludedType(f), ong=isOngoing(f), ih=known(f.in_house)&&!isTBD(f.in_house)&&f.in_house!=="unsure"?yes(f.in_house):null;
  const reasons=[], steps=[]; let result, code;
  steps.push(["Excluded under paragraph 28", ex?`Yes: ${ex}`:"No"]);
  if(ex){ result="Not outsourcing"; code="no"; reasons.push(`It is ${ex}.`); }
  else {
    steps.push(["Performed on a recurrent or ongoing basis (paragraph 26)", ong?"Yes":"No, a one-off delivery"]);
    if(!ong){ result="Not outsourcing (likely)"; code="no"; reasons.push("It is a one-off delivery, not performed on a recurrent or ongoing basis."); }
    else {
      steps.push(["Would or could realistically be performed by the bank itself (paragraph 26)", ih===true?"Yes":ih===false?"No":"Not clear yet"]);
      if(ih===true){ result="Outsourcing (likely)"; code="yes"; reasons.push("It is performed on an ongoing basis.", "It is work the bank would or could realistically perform itself."); }
      else if(ih===false){ result="Not outsourcing (likely)"; code="no"; reasons.push("It is performed on an ongoing basis, but it is not work the bank would or could realistically perform itself."); }
      else { result="To be determined"; code="tbd"; reasons.push("It is performed on an ongoing basis; whether the bank would or could realistically perform it itself is not clear yet."); }
    }
  }
  steps.push(["Critical or important function (paragraphs 29 to 31)", isImportant(f)?"May apply (flag)":"No indication"]);
  return {result, code, reasons, steps, entity:ent, rs, fw:rs, important:isImportant(f), ex, ong, inHouse:ih, future:futureRule(f)};
}
// preview under the future rule set; shown separately, never decides the result
function futureRule(f){

  let result, why;
  if(f.demand_type==="goods" || ["office","it-hardware"].includes(f.category)){ result="Out of scope (likely)"; why="A purchase of goods, not a service arrangement."; }
  else if(ict){ result="Out of scope: ICT service under DORA"; why="ICT services within the scope of DORA stay under DORA; mixed services need a check against both."; }
  else if(/\bstatutory audit\b/.test(t)){ result="Out of scope"; why="A legally required service such as the statutory audit."; }
  else if(f.category==="market-data"){ result="Out of scope"; why="A market information service."; }
  else if(/\b(visa|mastercard|card scheme|swift)\b/.test(t) && !/operations|investigat|processing/.test(t)){ result="Out of scope"; why="A global payment network infrastructure."; }
  else { result="Non-ICT third-party arrangement, in scope"; why=isImportant(f)?"A non-ICT service from a third party that may support a critical or important function, so the full requirements (including exit planning) would apply.":"A non-ICT service from a third party; proportionate requirements apply unless it is immaterial."; }

function classify(f){

    : f.tech_service==="unsure" ? {flag:"To confirm",text:"Not clear yet whether this is an ICT service. The ICT review confirms."}
    : f.tech_service===false ? {flag:"No",text:"Not an ICT service, based on the answers."} : null;
  const o=outsourcing(f);
  const out={flag:o.code==="yes"?"Yes":o.code==="no"?"No":"To confirm", text:`${o.result} under ${o.rs.short} (group standard). ${o.reasons.join(" ")} Flag for the outsourcing review; not a final determination.`};

// software, new demand: a rough user count given with the audience ("about 400 buyers") fills the count
function usersFromAudience(f){
  if(f.demand_type!=="software"||!S.det||!NEW_DEMAND(S.det.route)) return null;
  const t=[f.users,typeof f.audience_fn==="string"&&f.audience_fn!=="Confirmed"?f.audience_fn:""].filter(Boolean).join(" ").replace(/(\d),(\d{3})/g,"$1$2");

function deriveFacts(f){
  const d=S.derived;
  const derive=(k,fn)=>{ if(k in d && f[k]!==d[k]) delete d[k];   // the user or the AI set it: keep theirs
    if(!known(f[k]) || k in d){ const v=fn(f); if(v===null||v===undefined){ if(k in d){ f[k]=null; delete d[k]; } } else { f[k]=v; d[k]=v; } } };

}

// "next week" or "ASAP" means nothing to the buyer a week later, so it is kept as the date it stood for: "19 Oct 2026 (next week)"
function datedWhen(v){
  // only a purely relative answer: anything with a number or a month ("start of March, we're hiring now") stays as given
  if(typeof v!=="string" || /\d|\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b|\bq[1-4]\b/i.test(v)
     || !/^(?:(?:by|from|starting|start|in|within|ideally|latest)\s+)?(?:asap|as soon as possible|immediately|urgent(?:ly)?|right away|now|next (?:week|month|quarter|year))\b/i.test(v.trim())) return v;
  const d=parseWhen(v); return d ? `${fmtDate(d)} (${v.trim().replace(/[.!]$/,"")})` : v;
}

// the date in a reply such as "ok then 1 April 2027" or "let's say end of March"
function whenOnly(s){
  let x=String(s).trim(), prev;
  do{ prev=x; x=x.replace(/^(?:ok(?:ay)?|fine|alright|right|then|so|well|sure|let'?s (?:say|make it|go (?:for|with))|make it|change it to|move it to|rather|instead|actually)\b[,.!]?\s*/i,""); }while(x!==prev);
  return x.replace(/[.!]+$/,"") || String(s).trim();
}

function refresh(){
  const f=S.f;
  if(!known(f.category)){ S.det=null; S.missing=["need"]; return; }
  f.needed_by=datedWhen(f.needed_by);
  deriveFacts(f);
  // catalogue items: fill item and an estimated value automatically
  S.det = determine();
  if(S.det.route==="catalogue"){
    if(!known(f.item)) f.item = S.det.catalogue.map(i=>i.name).join(", ");
    if(known(f.quantity) && !known(f.value)){ f.value = S.det.catalogue[0].price*(parseInt(f.quantity)||1); f.value_is_estimate=true; }
  }
  if(f.demand_type==="contingent_labour" && !known(f.value) && known(f.day_rate)){ const v=parseMoney(f.day_rate); if(v) f.value = rateIsTotal(f.day_rate) ? v : v*20*monthsOf(f.duration) * (parseInt(f.headcount)||1); if(v) f.value_is_estimate=!rateIsTotal(f.day_rate); }
  S.det = determine();
  // the route's questions, plus optional points the requester chose to add from the quality check
  const base = requiredFor(S.det.route, f), req = [...base, ...(S.extraAsk||[]).filter(k=>FACTS[k] && !base.includes(k))];
  S.req = req;
  S.stageIds = STAGES.filter(st=>st.id==="review"||req.some(k=>factsOf(st).includes(k))).map(st=>st.id);
  const order = [...req].sort((a,b)=>(stageOf(a)-stageOf(b))||(posIn(a)-posIn(b)));
  S.missing = order.filter(k=>!known(f[k]));
}

const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(str){
  const t=String(str||"").toLowerCase().trim(), now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!t) return null;
  if(/\b(asap|as soon as possible|immediately|urgent(ly)?|right away|now)\b/.test(t)) return d0;
  if(/next week/.test(t)) return new Date(+d0+7*864e5);
  if(/next month/.test(t)) return new Date(now.getFullYear(),now.getMonth()+1,1);
  if(/next quarter/.test(t)) return new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3+3,1);
  if(/next year/.test(t)) return new Date(now.getFullYear()+1,0,1);
  let m=t.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/\b(\d{1,2})[./](\d{1,2})[./](\d{2,4})\b/); if(m) return new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
  m=t.match(/\bq([1-4])(?:\s*(\d{4}))?/); if(m){ let y=m[2]?+m[2]:now.getFullYear(); let d=new Date(y,(+m[1]-1)*3,1); if(!m[2]&&d<d0) d=new Date(y+1,(+m[1]-1)*3,1); return d; }
  m=t.match(/\b(?:(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?)?(?:(end|mid|early|beginning)\s+(?:of\s+)?)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:\s+(\d{1,2})(?:st|nd|rd|th)?)?(?:\s+(\d{4}))?/);
  if(m){ const mi=MONTHS.indexOf(m[3]); let day=+(m[1]||m[4]||1); if(m[2]==="end") day=28; if(m[2]==="mid") day=15;
    let y=m[5]?+m[5]:now.getFullYear(); let d=new Date(y,mi,day); if(!m[5] && d < new Date(+d0-20*864e5)) d=new Date(y+1,mi,day); return d; }
  return null;
}

// returns {fact, issue, message, choices} for the first real problem in what changed this turn, or null (described in How it works)

// overall assessment of the intake: completeness, clarity, consistency (described in How it works)

const QUALITY={warn:15, info:5, incomplete:0.5, partialSection:3, riskSection:8, sectionCap:30, floor:35, bands:[[90,"Strong"],[75,"Good"],[55,"Fair"],[0,"Needs work"]]};
function computeQuality(aiRemarks){
  const f=S.f, route=S.det.route, req=S.req||[], pts=[];
  const label=k=>FACTS[k]?FACTS[k].label:k;

    else if(fl.status==="flexible") pts.push({lvl:"info",text:`Start date is flexible (${fl.issue}).`});
    else if(fl.status==="corrected") pts.push({lvl:"ok",text:`${label(fl.fact)} clarified during the intake.`});
    else if(fl.status==="unanswered") pts.push({lvl:"warn",text:`${label(fl.fact)}: no usable answer given.`});

  if(givenText(f.data_details) && !saysWhere(f.data_details)) pts.push({lvl:"warn",text:"Data involved: where the data is stored is not given."});
  if(f.value_is_estimate && !["catalogue"].includes(route)) pts.push({lvl:"info",text:`The budget of ${money(Number(f.value))} is an estimate.`});
  if(route==="sourcing" && f.budget_approved && f.budget_approved!=="yes") pts.push({lvl:"warn",text:"Budget not yet approved. Sourcing can only start once it is."});
  if(known(f.needed_by) && !S.flags.some(x=>x.fact==="needed_by")){ const d=parseWhen(f.needed_by); if(d){ const days=(d-new Date())/864e5; if(days<(LEAD_DAYS[route]||0)) pts.push({lvl:"info",text:`Tight timeline: ${CHANNELS[route].name} usually takes ${CHANNELS[route].days} working days.`}); } }
  (aiRemarks||[]).filter(x=>typeof x==="string"&&x.trim()&&!/^(none|n\/a|no (issues|concerns|remarks)|nothing)\b/i.test(x.trim())).slice(0,2).forEach(x=>pts.push({lvl:"info",text:x.trim().replace(/\.?$/,".")}));
  const answered=req.filter(k=>known(f[k])&&f[k]!=="Not given"&&f[k]!=="unsure").length, complete=req.length?Math.round(answered/req.length*100):100;
  const warn=pts.filter(p=>p.lvl==="warn").length, info=pts.filter(p=>p.lvl==="info").length;
  let secPen=0;
  // a missing section only costs points when this route asks for it, so the requester can always lift the score in the chat; a risk always counts
  const askable=sec=>{ const m=SEC2KEY[sec], k=typeof m==="function"?m(f):m; return !!k && (req.includes(k) || (k==="data_details"&&yes(f.personal_data))); };
  if(S.sd&&S.sd.detail){ const R=sectionQuality().filter(r=>r.status==="Risk"||askable(r.sec)); secPen=Math.min(QUALITY.sectionCap, QUALITY.partialSection*R.filter(r=>r.status==="Partial"||r.status==="To be determined").length + QUALITY.riskSection*R.filter(r=>r.status==="Risk").length); }
  const score=Math.max(QUALITY.floor,Math.min(100,100-QUALITY.warn*warn-QUALITY.info*info-Math.round((100-complete)*QUALITY.incomplete)-secPen));
  const rating=QUALITY.bands.find(([min])=>score>=min)[1];
  return {score,rating,complete,points:pts};
}

async function callLLM(system, history, retried){
  const p=CONFIG.provider, key=CONFIG.keys[p], model=CONFIG.models[p];
  if(p==="server"){
    const t0=Date.now();
    const r=await fetch("/api/llm",{method:"POST",signal:AbortSignal.timeout(LLM_CLIENT.timeoutMs),headers:{"Content-Type":"application/json","x-access-code":CONFIG.accessCode||"",...(CONFIG.forceProvider?{"x-force-provider":CONFIG.forceProvider}:{})},body:JSON.stringify({system,history})});

    if(!r.ok){ const e=new Error(d.error||`Server error ${r.status}`); e.quota=r.status===429||!!d.quota; throw e; }

    const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Gemini error ${r.status}`);
    return parseJSON((d.candidates?.[0]?.content?.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join(""));
  }
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},

  const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Groq error ${r.status}`);

  let str=String(s).toLowerCase(); while(/(\d),(\d{3})\b/.test(str)) str=str.replace(/(\d),(\d{3})\b/g,"$1$2");
  const re=/(€|eur\b|£|\$)?\s*(\d+(?:\.\d+)?)\s*(k|m|thousand|million|eur\b|euros?)?\b(\s+[a-z]+)?/g;
  let best=null, bestScore=0, m;
  while((m=re.exec(str))){
    const unit=(m[3]||"").trim(), after=(m[4]||"").trim(), before=str.slice(Math.max(0,m.index-14),m.index);
    if(!m[1] && !unit && /^(people|persons?|users?|months?|weeks?|days?|years?|hours?|guests?|licen[cs]es?|seats?|laptops?|pcs|units?|x)$/.test(after)) continue;
    let score=(m[1]?3:0)+(unit?3:0)+(m[2].length>=4?1:0)+(/(around|about|approx|budget|cost|roughly|up to|max)\s*$/.test(before)?2:0);
    if(score>bestScore){ bestScore=score; best=m; }
  }
  if(!best) return null;
  let v=parseFloat(best[2]); const u=(best[3]||"").trim();
  if(/^(k|thousand)$/.test(u)) v*=1e3; if(/^(m|million)$/.test(u)) v*=1e6; return v;
}

const NARR_MAX=1000;
function clampText(t, max=NARR_MAX){

function composeNarrative(d){

  ["New demand","Software, RFP","A new HR system to replace our payroll tool."],
  ["New demand","Outsourcing","KYC periodic reviews for our corporate clients by an external provider for 2 years, around 600k."],
  ["New demand","Offshore","An offshore team in Poland to run accounts payable invoice processing for 3 years, about 900k."],
  ["New demand","Over €1 million","Replace our core treasury management system, budget 2.5 million over 5 years."],
  ["New demand","Market data","An ESG ratings data feed for our research team, around 120k a year."],
  ["New demand","Under €50k","An agency for a client dinner for 40 people, around 30k."],
  ["Other routes","Catalogue","We need 15 laptops for new joiners in Frankfurt."],
  ["Other routes","Call-off","More support from Lakeshore Advisory for our operations team."],
  ["Other routes","External workers","Two Java developers as contractors for 9 months."]

/* ---------- replies type out like someone writing: fast, and line by line for long ones ----------
   One reply at a time; anything after it in the same turn (cards, notes, answer chips) waits until it is done.
   A click on the reply, typing or sending finishes it at once. With "reduce motion" switched on, text appears at once. */
const TYPE={seen:new WeakSet(), queue:[], cur:null, shown:0, timer:null};
const typable = m => m.role==="assistant" && !m.kind && typeof m.text==="string" && m.text.length>0;
const typingActive = () => !!TYPE.cur;
function typeTrack(){
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.msgs.forEach(m=>{ if(TYPE.seen.has(m)) return; TYPE.seen.add(m); if(typable(m) && !reduce) TYPE.queue.push(m); });
  if(!TYPE.cur && TYPE.queue.length) typeNext();
}
function typeNext(){
  TYPE.cur=TYPE.queue.shift()||null; TYPE.shown=0; if(!TYPE.cur) return;
  const t=TYPE.cur.text, lines=t.split("\n").length, long=t.length>280||lines>=4;
  // short replies take up to 1.2 s; long ones come line by line with a short pause, about 2 s in all
  const ms = long ? Math.min(2200, 300+lines*180) : Math.min(1200, Math.max(250, t.length*10)), per=Math.max(1, Math.ceil(t.length/(ms/16)));
  const tick=()=>{
    if(!TYPE.cur) return;
    const t=TYPE.cur.text; let n=Math.min(t.length, TYPE.shown+per);
    const nl=t.indexOf("\n", TYPE.shown); if(long && nl>=0 && nl<n) n=nl+1;   // stop at the end of a line, then pause
    TYPE.shown=n;
    if(n>=t.length){ typeDone(); return; }
    typePaint(); TYPE.timer=setTimeout(tick, long && t[n-1]==="\n" ? 90 : 16);
  };
  TYPE.timer=setTimeout(tick, 16);
}
function typePaint(){
  const el=document.querySelector("#msgs [data-typing]"); if(!el||!TYPE.cur) return;
  let part=TYPE.cur.text.slice(0, TYPE.shown); if(((part.match(/\*\*/g)||[]).length)%2) part+="**";   // no stray "**" mid-way
  el.innerHTML=md(part);
  const box=$("#msgs"); if(!S.holdScroll) box.scrollTop=box.scrollHeight;
}
function typeDone(){ clearTimeout(TYPE.timer); TYPE.cur=null; if(TYPE.queue.length) typeNext(); render(); }
function typeFlush(){ clearTimeout(TYPE.timer); const was=TYPE.cur||TYPE.queue.length; TYPE.cur=null; TYPE.queue=[]; if(was) render(); }

function render(){
  typeTrack();
  $("#aiDot").className="dot"+(aiReady()?" on":"");
  const pl=providerLabel();
  $("#aiLabel").textContent=aiReady()?(pl?`AI on · ${pl}`:"AI on"):"Offline rules";
  $("#aiLabel").parentElement.title=aiReady()&&SERVER?`Fallback order: ${providerChain()}.${pl?` Last answer from ${pl}.`:" The first answer shows which one is used."}`:"";
  const box=$("#msgs");
  if(!S.msgs.length){
    box.innerHTML=`<div class="welcome"><h1>What do you need to buy?</h1>
      <p>Tell me in your own words. I'll ask only what's needed, one thing at a time, and then show you the quickest way to get it.</p>
      ${[...new Set(TRIES.map(x=>x[0]))].map(g=>`<h5 class="tryh">${esc(g)}</h5><div class="tries">${TRIES.map(([gg,h,t],i)=>gg!==g?"":`<button data-try="${i}"><small>${esc(h)}</small><span>${esc(t)}</span></button>`).join("")}</div>`).join("")}</div>`;
    box.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>handleUser(TRIES[b.dataset.try][2]));
  } else {
    const lastRec=S.msgs.map((m,i)=>m.kind==="rec"?i:-1).filter(i=>i>=0).pop();
    const lastSd=S.msgs.map((m,i)=>m.kind==="sd"?i:-1).filter(i=>i>=0).pop();
    // nothing after the reply being typed is shown yet
    const upto=TYPE.cur?S.msgs.indexOf(TYPE.cur):S.msgs.length-1;
    box.innerHTML=S.msgs.map((m,i)=>i>upto?"":msgHTML(m,i,lastRec,lastSd)).join("")+(S.busy&&!TYPE.cur?`<div class="m a"><div class="av">G</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`:"");
    bind();
    if(TYPE.cur){ typePaint(); const el=box.querySelector("[data-typing]"); if(el) el.onclick=typeFlush; }
  }
  $("#qr").innerHTML=S.busy||TYPE.cur?"":S.choices.map(q=>`<button>${esc(q)}</button>`).join("");
  $("#qr").querySelectorAll("button").forEach(b=>b.onclick=()=>handleUser(b.textContent));
  $("#send").disabled=S.busy;
  renderStepbar();
  renderSide();
  // a newly shown service description stays in view from its top; the next user message resumes normal scrolling
  const sdIdx=S.msgs.map((m,i)=>m.kind==="sd"?i:-1).filter(i=>i>=0).pop();
  if(sdIdx!=null && sdIdx>S.sdShown){ S.sdShown=sdIdx; S.holdScroll=true; }
  requestAnimationFrame(()=>{ const card=S.holdScroll&&box.querySelector("#sdcard");
    if(card) box.scrollTop=card.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop-8;
    else box.scrollTop=box.scrollHeight; });
}
function renderStepbar(){
  const el=$("#stepbar");
  if(!S.det || !S.stageIds.length){ el.innerHTML=""; return; }
  // up to four steps show their names; with more, the others fold to numbered circles (name on hover, still read out) so the bar never scrolls
  const cur=S.completed?"review":currentStage(), compact=S.stageIds.length>4;
  el.className="stepbar"+(compact?" compact":"");
  el.innerHTML=S.stageIds.map((id,i)=>{
    const st=stageById(id), done=id==="review"?!!S.submitted:(stageDone(id)&&id!==cur), isCur=id===cur;
    const left=isCur&&id!=="review"?stageFacts(id).filter(k=>!known(S.f[k])).length:0;
    return `${i?'<span class="sep"></span>':""}<span class="st ${done?"done":""} ${isCur?"cur":""}" title="${esc(`Step ${i+1}: ${st.name}`)}"><i>${done?"✓":i+1}</i><span class="nm${compact&&!isCur?" sr":""}">${esc(st.name)}</span>${left?` <small>${left} left</small>`:""}</span>`;
  }).join("");
  const c=el.querySelector(".cur"); if(c && !compact) el.scrollLeft=Math.max(0,c.offsetLeft-40);
}
function recapHTML(m, expanded){
  const names=m.stages.map(id=>stageById(id).name);
  if(!expanded) return `<div class="recap mini"><div class="rh">✓ ${esc(names.join(" · "))}</div></div>`;
  const rows=m.stages.flatMap(id=>m.req.filter(k=>factsOf(stageById(id)).includes(k)&&known(m.facts[k])).map(k=>`<div class="rr"><span>${esc(FACTS[k].label)}</span><span>${esc(show(k,m.facts[k]))}</span></div>`));
  return `<div class="recap"><div class="rh">✓ ${esc(names.join(" and "))}: here's what I have</div><div class="rb">${rows.join("")}</div><div class="rf">Anything wrong? Just tell me, for example "the budget is 60k".</div></div>`;
}
function msgHTML(m,i,lastRec,lastSd){
  if(m.role==="user") return `<div class="m u"><div class="ucol"><div class="bub">${esc(m.text)}</div></div></div>`;
  if(m.kind==="sys") return `<div class="sys">${esc(m.text)}</div>`;
  if(m.kind==="class"){ const r=S.l4Initial||[]; return `<div class="m a"><div class="av">G</div><div class="classcard"><div class="ch">Category (Level 4), initial</div>${r.map(x=>`<div class="cr"><b>${esc(x.name)}</b> <span class="cc">${esc(x.code)}</span> <span class="cm">${x.match}% match</span><div class="cx">${esc(x.reason)}${x.uncertainty?` <i>${esc(x.uncertainty)}</i>`:""}</div></div>`).join("")}<div class="cf">Based on your first message. I'll check it again at the end; if it's wrong, just tell me.</div></div></div>`; }
  if(m.kind==="stage"){ const st=stageById(m.stage); return `<div class="stagemark"><span><b>Step ${m.idx} of ${m.total} · ${esc(st.name)}</b><br>${esc(st.intro)}</span></div>`; }
  if(m.kind==="recap"){ const lastRecap=S.msgs.map((x,j)=>x.kind==="recap"?j:-1).filter(j=>j>=0).pop(); return `<div class="m a"><div class="av">G</div>${recapHTML(m, i===lastRecap)}</div>`; }
  if(m.kind==="rec") return `<div class="m a"><div class="av">G</div><div class="wide">${i===lastRec?recHTML(m.rec):`<div class="card old">Earlier recommendation: ${esc(CHANNELS[m.rec.route].name)}. Updated below.</div>`}</div></div>`;
  if(m.kind==="sd")  return i===lastSd?`<div class="m a" id="sdcard"><div class="av">G</div><div class="wide">${sdHTML()}</div></div>`:"";
  if(m===TYPE.cur) return `<div class="m a"><div class="av">G</div><div class="bub${m.check?" qchk":""}" data-typing title="Click to show it all"></div></div>`;
  return `<div class="m a"><div class="av">G</div><div class="bub${m.check?" qchk":""}">${md(m.text)}</div></div>`;
}

  const faster={catalogue:0,contract:1,quote:2,sourcing:3};
  return `<div class="card">
    <div class="rec-h"><div class="eyebrow">Recommended route</div><h2>${c.name}</h2>
      <div class="meta">Typically ${c.days} working days${known(f.value)?` · ${money(Number(f.value))}${f.value_is_estimate?" estimated":""}`:""}</div></div>
    <div class="sec"><h4>Why</h4>${esc(R.why)}</div>
    <div class="acts">
      <span class="muted">The service description is above.</span>
      <button class="lnk" data-act="more">${S.showMore?"Fewer options":"More options"}</button>
    </div>
    ${S.showMore?`<div class="more">
      <label class="muted">Use a different route</label>
      <select class="inp" id="ovr" style="margin-top:6px"><option value="">Keep ${esc(c.name)}</option>${Object.entries(CHANNELS).filter(([k])=>k!==R.route).map(([k,v])=>`<option value="${k}" ${S.override===k?"selected":""}>${v.name}</option>`).join("")}</select>
      ${ovr?`<div class="ovr">${faster[S.override]<faster[R.route]?"This skips the standard route. It adds an exception approval and a procurement review, about 7 to 12 extra working days.":"A stricter route than needed. Allowed, but slower."}<textarea class="inp" id="just" rows="2" style="margin-top:8px" placeholder="Why does the standard route not work?"></textarea></div>`:""}
      <div style="margin-top:10px"><button class="lnk" data-act="json">Download the request as JSON</button></div>
    </div>`:""}
  </div>`;
}
function descHTML(editable){
  const d=S.sd.desc||{}, ed=k=>editable?` contenteditable data-sec="${k}"`:"";
  if(d.exec!==undefined){
    const val=k=>k==="name"?S.sd.title:Array.isArray(d[k])?d[k].join("; "):d[k];
    const paras=String(d.exec||"").split(/\n{2,}/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");
    return `<div class="ds"><h5>1. Service description headline</h5><p class="hl"><b>${esc(S.sd.title)}</b>${d.tagline?` | <span${ed("tagline")}>${esc(d.tagline)}</span>`:""}</p><p${ed("headline")}>${esc(d.headline)}</p></div>
      <div class="ds"><h5>2. Executive service description</h5><div class="exec"${ed("exec")}>${paras}</div></div>
      <div class="ds"><h5>3. Service summary</h5><table class="sumt kv">${EXEC_ROWS.filter(([k])=>val(k)).map(([k,l])=>`<tr><td>${esc(l)}</td><td${k==="name"?(editable?' contenteditable data-sd="title"':""):ed(k)}>${esc(val(k))}</td></tr>`).join("")}</table></div>`;
  }
  return DESC_SECTIONS.filter(([k])=>Array.isArray(d[k])?d[k].length:d[k]).map(([k,label])=>
    `<div class="ds"><h5>${esc(label)}</h5>${Array.isArray(d[k])?`<ul${ed(k)}>${d[k].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p${ed(k)}>${esc(d[k])}</p>`}</div>`).join("")
    + (d.narrative && d.narrative!==d.summary ? `<div class="ds narr"><h5>Summary</h5><p${ed("narrative")}>${esc(d.narrative)}</p></div>` : "");
}
function sdHTML(){
  const d=S.sd, n=(d.brd.requirements||[]).length, rec=intakeRecord();
  return `<div class="card sd"><div class="sd-h"><small>Service description · click the text to edit</small><div class="t" contenteditable data-sd="title">${esc(d.title||"Untitled")}</div></div>
    <div class="sec desc">${descHTML(true)}</div>
    <div class="sec record"><h4>Captured for procurement <span class="muted">not part of the description</span></h4><div class="kvg">${rec.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div></div>
    ${d.detail?`<div class="sec srq"><h4>Sourcing request text</h4><p class="cmp">${esc(d.compact)}</p>
      <div class="cpy"><button class="lnk" data-act="copycompact">Copy sourcing text</button></div></div>`:""}
    ${qualityHTML()}
    <div class="sec brdlink"><div><b>${d.detail?"Detailed service description":"Business requirements document"}</b><br><span class="muted">${d.detail?`25 sections, ${n} obligations, outsourcing and ICT determination, sourcing attributes, quality check by section`:`${n} requirements, risk and compliance, commercial terms, evaluation, approvals`}${S.sd._ai?"":" · built from your answers"}</span></div>
      <button class="btn btn-a" data-act="brd">Open document</button></div>
    <div class="acts">${S.submitted?`<span class="muted">Submitted as <b>${esc(S.submitted)}</b></span>`:`<button class="btn btn-p" data-act="submit">Looks right, submit</button>`}
      <button class="lnk" data-act="copy">Copy description</button><span class="muted">Something to change? Just tell me.</span></div></div>`;
}
function sectionSummaryHTML(){
  const R=sectionQuality(), c=st=>R.filter(r=>r.status===st).length, bad=R.filter(r=>["Partial","To be determined","Risk"].includes(r.status));
  return `<div class="sec qsec"><h4>Quality check by section</h4><div class="qcounts"><span class="qc ok">${c("Complete")} complete</span><span class="qc pa">${c("Partial")} partial</span><span class="qc tb">${c("To be determined")} to be determined</span><span class="qc rk">${c("Risk")} risk</span><span class="qc na">${c("Not applicable")} not applicable</span></div>
    ${bad.length?`<ul class="qlist">${bad.slice(0,6).map(r=>`<li class="${r.status==="Risk"?"warn":"info"}"><b>${esc(r.sec)}</b>: ${esc(r.issue||r.status)}${r.fix?`. ${esc(r.fix)}`:""}</li>`).join("")}</ul>`:""}</div>`;
}
// why a section this route did not ask still matters for this request; null leaves it out of the quality check
function optionalWhy(sec, row){
  const f=S.f, ong=isOngoing(f), v=known(f.value)?Number(f.value):0, mo=givenText(f.duration)?monthsOf(f.duration):0, has=k=>!!givenText(f[k]);
  const crit=isImportant(f), outL=outsourcing(f).code==="yes", tech=yes(f.tech_service), sw=f.demand_type==="software";
  const size = crit ? "it may support a critical or important function" : outL ? "it is likely outsourcing" : mo>=12 ? `it runs for ${f.duration}` : v>=250000 ? `it is a ${money(v)} service` : "";
  const WHY={
    "Governance": ong && size ? size : null,
    "Reporting": ong && (has("service_levels")||has("kpis")) ? "it tracks the service levels and KPIs you set" : ong && outL ? "outsourcing needs regular reporting" : null,
    "Change management": ong && (sw||tech) ? "software and technology services change during the contract" : null,
    "Escalation": ong && (crit||outL) ? size : ong && tech ? "incidents need a clear route to decision makers" : null,
    "Service level failure consequences": ong && has("service_levels") ? "you set service levels, so agree what happens when they are missed" : null,
    "Critical or important function relevance": crit ? "your answers point to a critical or important function" : outL ? "it is likely outsourcing" : null,
    "Tools": tech && ong ? "the provider runs technology for us" : null,
    "Acceptance testing": "suppliers need to know how their work is accepted",
    "Dependencies": "suppliers price what we must provide into their offer",
    "Assumptions": "suppliers price what we must provide into their offer",
    "Responsibility allocation": "suppliers price what we must provide into their offer",
    "Active obligations": ong && !sw ? "the provider's duties become the service obligations in the contract" : null,
    "Definitions": row && /abbreviations used:/i.test(row.issue||"") ? `the description uses ${String(row.issue).replace(/^abbreviations used:\s*/i,"")}, which readers outside your team may not know` : null,
  };
  return WHY[sec] || null;   // nothing specific to this demand: left out
}
// gaps the route asked for are "to improve"; the rest is optional, chosen for this demand, and can be added in the chat
function qualityGaps(){
  const f=S.f, req=S.req||[], keyOf=sec=>{ const m=SEC2KEY[sec]; return typeof m==="function"?m(f):m; };
  const rows=S.sd&&S.sd.detail ? sectionQuality().filter(r=>["Partial","To be determined","Risk"].includes(r.status)&&r.sec!=="Open points") : [];
  const asked=k=>!!k && (req.includes(k) || (k==="data_details"&&yes(f.personal_data)));
  const improve=rows.filter(r=>r.status==="Risk"||asked(keyOf(r.sec)));
  const groups={};
  rows.filter(r=>!improve.includes(r)).forEach(r=>{ const why=optionalWhy(r.sec, r); if(!why) return; const k=keyOf(r.sec), g=k&&FACTS[k]?k:"_"+r.sec;
    (groups[g]=groups[g]||{key:k&&FACTS[k]?k:null, secs:[], why, fix:r.fix}).secs.push(r.sec); });
  return {improve, optional:Object.values(groups)};
}
function qualityHTML(){
  const q=S.quality; if(!q) return "";
  const cls={Strong:"q-strong",Good:"q-good",Fair:"q-fair","Needs work":"q-needs"}[q.rating];
  const oks=q.points.filter(p=>p.lvl==="ok").length, items=[], gaps=qualityGaps();
  q.points.filter(p=>p.lvl!=="ok").forEach(p=>items.push({lvl:p.lvl,html:esc(p.text)}));
  gaps.improve.forEach(r=>items.push({lvl:r.status==="Risk"?"warn":"info", html:`<span><b>${esc(r.sec)}</b>: ${esc(r.issue||r.status.toLowerCase())}${r.fix?`. ${esc(r.fix)}`:""}</span>`}));
  const names=s=>{ const x=s.map((n,i)=>i?n.toLowerCase():n); return x.length>1?x.slice(0,-1).join(", ")+" and "+x[x.length-1]:x[0]; };
  const openTxt=(S.sd&&S.sd.detail&&S.sd.detail.open_points||[]).map(x=>String(x).toLowerCase());
  const optional=gaps.optional.filter(g=>!g.secs.some(sec=>openTxt.some(x=>x.startsWith(sec.toLowerCase())))).map(g=>`<li class="opt"><span><b>${esc(names(g.secs))}</b>: ${g.key?`worth adding because ${esc(g.why)}.`:`${esc(cap1(g.why))}. ${esc(g.fix)}.`}</span>${g.key&&!S.submitted?`<button class="lnk" data-act="addopt" data-key="${g.key}">Add</button>`:""}</li>`);
  const seen=new Set(), list=items.filter(x=>{ const k=x.html.replace(/<[^>]+>/g,"").toLowerCase().slice(0,60); if(seen.has(k)) return false; seen.add(k); return true; });
  const secs=new Set(items.map(x=>(x.html.match(/^<span><b>([^<]+)<\/b>/)||[])[1]).filter(Boolean).map(x=>x.toLowerCase()));
  const open=(S.sd&&S.sd.detail&&S.sd.detail.open_points||[]).filter(x=>!seen.has(String(x).toLowerCase().slice(0,60)) && !secs.has(String(x).split(":")[0].trim().toLowerCase()));
  return `<div class="sec qual"><div class="qhead"><span class="qbadge ${cls}">${q.rating}</span><span>Quality check · ${q.score}/100 · ${q.complete}% of the needed details given${oks?` · ${oks} answer${oks>1?"s":""} clarified`:""}</span></div>
    ${list.length?`<h5 class="qh">To improve</h5><ul class="qlist">${list.map(p=>`<li class="${p.lvl}">${/^<span>/.test(p.html)?p.html:`<span>${p.html}</span>`}</li>`).join("")}</ul>`:""}
    ${open.length?`<h5 class="qh">Still open (${open.length})</h5><ul class="qlist">${open.map(x=>`<li class="info"><span>${esc(x)}</span></li>`).join("")}</ul>`:""}
    ${optional.length?`<h5 class="qh">Optional for this request</h5><ul class="qlist">${optional.join("")}</ul>`:""}
    ${!list.length&&!open.length&&!optional.length?`<ul class="qlist"><li class="ok">No gaps or inconsistencies found.</li></ul>`:""}</div>`;
}
function sdText(){ const d=S.sd.desc||{};
  if(d.exec!==undefined) return [`${S.sd.title}${d.tagline?` | ${d.tagline}`:""}`, d.headline, "Executive service description\n"+d.exec,
    "Service summary\n"+EXEC_ROWS.map(([k,l])=>[l,k==="name"?S.sd.title:Array.isArray(d[k])?d[k].join("; "):d[k]]).filter(r=>r[1]).map(([l,v])=>`${l}: ${v}`).join("\n")].filter(Boolean).join("\n\n");
  return [S.sd.title,...DESC_SECTIONS.filter(([k])=>Array.isArray(d[k])?d[k].length:d[k]).map(([k,l])=>`${l}\n${Array.isArray(d[k])?d[k].map(x=>"- "+x).join("\n"):d[k]}`),...(d.narrative&&d.narrative!==d.summary?[`Summary\n${d.narrative}`]:[])].join("\n\n"); }
