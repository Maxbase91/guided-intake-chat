<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Intake Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Guided Intake Chat (prototype)
   - Rules decide the buying route AND what must be known for that route.
   - The AI only talks: it phrases one question at a time and reads the answers.
   ========================================================= */
:root{
  --navy:#0f2147; --navy-2:#1b3266; --navy-3:#2c4a8a;
  --amber:#f2a900; --amber-soft:#fff4d6; --amber-ink:#8a5d00;
  --bg:#f5f6fa; --card:#fff; --line:#e4e7ef; --line-2:#eef0f5;
  --ink:#141b2d; --ink-2:#4a5470; --ink-3:#7c859e;
  --ok:#11845b; --ok-soft:#e5f5ee; --warn:#b4570b; --warn-soft:#fdf0e3;
  --bad:#b42318; --bad-soft:#fdecea; --info:#2c4a8a; --info-soft:#eaf0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;flex:none}
.top-in{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#ffcf5c);display:grid;place-items:center;color:var(--navy);font-weight:800;flex:none}
.brand b{display:block;font-family:"Inter Tight";font-size:16px}
.brand span{font-size:12px;color:#aab6d3}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#dfe6f7;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7c859e}
.dot.on{background:#3ad29f;box-shadow:0 0 0 3px rgba(58,210,159,.2)}
.tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.tb:hover{background:rgba(255,255,255,.18)}
.only-m{display:none}
@media(max-width:900px){.only-m{display:inline-flex}.brand span,.pill{display:none}}

/* layout */
.app{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:900px){.chat{border-radius:0;border:0}}
.msgs{flex:1;overflow-y:auto;padding:26px 24px 12px}
@media(max-width:600px){.msgs{padding:16px 12px 8px}}

/* welcome */
.welcome{max-width:600px;margin:24px auto 10px}
.welcome h1{font-size:26px}
.welcome p{color:var(--ink-2);margin:8px 0 18px}
.tries{border-top:1px solid var(--line-2)}
.tries button{display:flex;gap:12px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 4px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.tries button:hover{color:var(--navy);background:#fafbfd}
.tries small{flex:none;width:118px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
@media(max-width:600px){.tries small{width:90px}}

/* messages */
.m{display:flex;gap:10px;margin:0 0 16px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.bub{max-width:min(600px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.ucol{display:flex;flex-direction:column;align-items:flex-end;max-width:min(600px,85%)}.ucol .bub{max-width:100%}
.ascore{font-size:11px;margin-top:4px;padding:1px 8px;border-radius:99px;font-weight:600}
.ascore.shi{color:#1d6b43;background:#e6f4ec}.ascore.smid{color:#8a5d00;background:#fdf3dc}.ascore.slo{color:#b42318;background:#fdecea}
.m.a .bub{background:#f3f5fa;border-bottom-left-radius:5px}
.m.a .bub b{color:var(--navy)}
.m .wide{flex:1;min-width:0;max-width:680px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sys{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-4px 0 14px}

/* answer shortcuts: small, quiet, only for closed questions */
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.qr button{border:1px solid var(--line);color:var(--ink-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.qr button:hover{border-color:var(--navy-3);color:var(--navy)}

/* composer */
.comp{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;max-height:160px;min-height:48px;outline:none;line-height:1.45}
.comp textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(44,74,138,.12)}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;cursor:not-allowed}

/* recommendation + description cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#2c4a8a 0%,var(--navy) 60%);color:#fff}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink)}
.rec-h .eyebrow{color:#ffd36b}
.rec-h h2{font-size:23px;margin:3px 0 2px}
.rec-h .meta{font-size:13px;color:#c9d3ea}
.sec{padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.chk{display:flex;gap:8px;padding:3px 0}
.chk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--info-soft);color:var(--info)}
.chk i.w{background:var(--warn-soft);color:var(--warn)} .chk i.b{background:var(--bad-soft);color:var(--bad)}
.chk span{color:var(--ink-3);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);background:#fafbfd}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--amber);color:var(--navy)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.lnk{background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.more{padding:12px 20px;border-top:1px solid var(--line-2);font-size:13.5px;background:#fafbfd}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.ovr{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:#6b3a06;margin-top:8px}
.old{opacity:.6;font-size:13px;padding:10px 14px}
.sec.lead{background:#fbfaf5;border-left:3px solid var(--amber);font-size:14.5px;line-height:1.6}
.stepbar{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;overflow-x:auto;scrollbar-width:none}
.stepbar:empty{display:none}
.stepbar .st{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;font-size:13px;color:var(--ink-3);white-space:nowrap;flex:none}
.stepbar .st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.stepbar .st.done{color:var(--ink-2)} .stepbar .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepbar .st.cur{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow)} .stepbar .st.cur i{background:var(--navy);border-color:var(--navy);color:#fff}
.stepbar .st small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.stepbar .sep{flex:none;width:14px;height:1.5px;background:var(--line);align-self:center}
.stagemark{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-3);font-size:12px}
.stagemark:before,.stagemark:after{content:"";flex:1;height:1px;background:var(--line)}
.stagemark b{color:var(--navy);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stagemark span{display:block;text-align:center;line-height:1.4}
.recap{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:min(560px,85%);overflow:hidden;box-shadow:var(--shadow)}
.recap .rh{padding:10px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px}
.recap .rb{padding:8px 14px 10px}
.recap .rr{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
.recap .rr span:first-child{color:var(--ink-3);width:120px;flex:none}
.recap .rf{font-size:12.5px;color:var(--ink-3);padding:0 14px 10px}
.recap.mini{box-shadow:none;background:#f8faf9;border-color:#e3efe9}
.recap.mini .rh{background:transparent;font-weight:500;padding:7px 12px}
.m.a .bub.qchk{background:var(--amber-soft);border:1px solid #f3dfa6}
.m.a .bub.qchk:before{content:"Quick check · ";font-weight:600;color:var(--amber-ink)}
.sec.qual .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.qbadge{font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.q-strong,.q-good{background:var(--ok-soft);color:var(--ok)} .q-fair{background:var(--warn-soft);color:var(--warn)} .q-needs{background:var(--bad-soft);color:var(--bad)}
.qlist{list-style:none;margin:8px 0 0;padding:0}
.qlist li{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.qlist li:before{flex:none;width:18px;text-align:center;font-weight:700}
.qlist li.warn:before{content:"!";color:var(--warn)} .qlist li.info:before{content:"i";color:var(--info)} .qlist li.ok:before{content:"✓";color:var(--ok)}
.side .grp{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 2px;display:flex;justify-content:space-between}
.side .grp em{font-style:normal;color:var(--ok);letter-spacing:0;text-transform:none}
.sec.desc{background:#fbfaf5;border-left:3px solid var(--amber)}
.ds{margin:0 0 10px}.ds:last-child{margin:0}.ds h5{margin:0 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.ds p{margin:0;font-size:14.5px;line-height:1.55}
.ds.narr{margin-top:14px;padding-top:12px;border-top:1px dashed #e6d9b0}
.ds .hl{font-size:15px;margin-bottom:4px}.ds .exec p{margin:0 0 8px}.ds .exec p:last-child{margin:0}
.sumt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;background:#fff}.sumt td{border:1px solid #ece3c6;padding:6px 9px;vertical-align:top;line-height:1.45}
.sumt td:first-child{width:32%;color:var(--ink-3);font-weight:600;background:#fdfaf0}.ds ul{margin:2px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.sec.record h4 .muted{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.kvg{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;font-size:13px}.kvg span:nth-child(odd){color:var(--ink-3)}
.sec.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec.chips span{background:var(--line-2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.sec.brdlink{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f6f8fd}
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);overflow:auto;padding:0 12px 40px}
.doctools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:12px 4px;color:#fff}
.doctools .muted{color:#c9d3ea}.doctools .sp{flex:1}
.paper{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;padding:48px 56px;box-shadow:0 20px 50px rgba(0,0,0,.3);outline:none}
@media(max-width:700px){.paper{padding:24px 18px}.hide-sm{display:none}.brd .two{grid-template-columns:1fr}}
body.doc-open{overflow:hidden}
@media print{
  body{display:block;height:auto;background:#fff}
  body.doc-open>*:not(#docRoot){display:none!important}
  .docwrap{position:static;background:none;padding:0;overflow:visible}.doctools{display:none}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .brd h2{break-after:avoid}.brd tr{break-inside:avoid}
}
.sd-h{background:var(--navy);color:#fff;padding:14px 20px}
.sd-h small{font-size:11.5px;color:#aab6d3;letter-spacing:.06em;text-transform:uppercase}
.sd-h .t{font-family:"Inter Tight";font-size:17px;font-weight:700;outline:none;margin-top:2px}
.sd [contenteditable]{outline:none;border-radius:6px}
.sd [contenteditable]:focus{background:#f6f8fd;box-shadow:0 0 0 2px rgba(44,74,138,.15)}

/* side panel */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.side{position:fixed;inset:0 0 0 auto;width:min(360px,92%);background:var(--bg);z-index:30;padding:16px;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 40px rgba(0,0,0,.15)}.side.open{transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.route{font-family:"Inter Tight";font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
.prov{font-size:12px;color:var(--ink-3)}
.prog{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c544);transition:width .4s}
.fact{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px;align-items:flex-start}
.fact:first-of-type{border-top:0}
.fact .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.fact.ok .ic{background:var(--ok);border-color:var(--ok)}
.fact.next .ic{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fact .k{color:var(--ink-3);flex:none;width:112px}
.fact .v{flex:1;text-align:right;font-weight:500;word-break:break-word}
.fact:not(.ok) .v{color:var(--ink-3);font-weight:400}
.muted{color:var(--ink-3);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer section+section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.drawer label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.tgl{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.tgl input{width:18px;height:18px;accent-color:var(--navy)}
.alert{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.err{background:var(--bad-soft);color:var(--bad)}
</style>

<body>

<header class="top">
  <div class="top-in">
    <div class="logo">G</div>
    <div class="brand"><b>Guided Intake</b><span>Tell us what you need. We find the right way to buy it.</span></div>
    <div class="sp"></div>
    <span class="pill"><span class="dot" id="aiDot"></span><span id="aiLabel">Offline</span></span>
    <button class="tb only-m" id="sumBtn">Summary</button>
    <button class="tb" id="newBtn">New</button>
    <button class="tb" id="cfgBtn">Rules</button>
  </div>
</header>

<div class="app">
  <section class="chat">
    <div class="stepbar" id="stepbar"></div>
    <div class="msgs" id="msgs"></div>
    <div class="qr" id="qr"></div>
    <form class="comp" id="comp">
      <textarea id="inp" rows="1" placeholder="Describe what you need…"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
  <aside class="side" id="side"></aside>
</div>
<div id="drawerRoot"></div>
<div id="docRoot"></div>

<script>
/* =========================================================
   1. CONFIGURATION
   Hosted on Vercel: the key lives in Vercel environment variables
   (GEMINI_API_KEY or GROQ_API_KEY) and never reaches the browser.
   Opened as a local file: paste a key into keys below instead.
   ========================================================= */
const CONFIG = {
  provider: "auto",                       // "auto" | "server" | "gemini" | "groq" | "offline"
  keys: { gemini: "", groq: "" },
  models: { gemini: "gemini-2.5-flash", groq: "llama-3.3-70b-versatile" },
  accessCode: "",                         // only if ACCESS_CODE is set on Vercel
  forceProvider: new URLSearchParams(location.search).get("ai") || "",   // testing: ?ai=mistral uses only that provider
  currency: "EUR",
  thresholds: { quickQuoteMax: 50000, materialityMin: 1000000 }
};

/* =========================================================
   2. REFERENCE DATA (mock — replace with your own)
   ========================================================= */
const CATEGORIES = [
  {id:"it-hardware", name:"IT hardware",                   type:"goods",    kw:["laptop","notebook","monitor","headset","keyboard","printer","hardware","docking","screen","smartphone"]},
  {id:"software",    name:"Software and SaaS",             type:"software", kw:["licence","license","software","saas","subscription","seats","system","platform","tool","orchestrat","workflow","portal","automation","agentic","entry point"]},
  {id:"it-services", name:"IT services and development",   type:"services", kw:["develop","implementation","integration","migration","testing","build an app"]},
  {id:"cloud",       name:"Cloud and hosting",             type:"services", kw:["cloud","hosting","aws","azure","data centre"]},
  {id:"consulting",  name:"Management consulting",         type:"services", kw:["consult","advisory","strategy","redesign","transformation","assessment","operating model"]},
  {id:"legal",       name:"Legal services",                type:"services", kw:["legal","lawyer","counsel","litigation","law firm"]},
  {id:"marketing",   name:"Marketing and events",          type:"services", kw:["event","marketing","campaign","conference","agency","offsite","dinner","sponsorship","ticket"]},

const GOODSLIKE = f => f.demand_type==="goods" || f.demand_type==="software";

const REL = {
  pd:       f => yes(f.personal_data) || yes(f.system_access),
  ongoingSvc: f => ["cloud","telecom","software","market-data","facilities"].includes(f.category) || (known(f.duration) && monthsOf(f.duration)>=6) || /\b(ongoing|monthly|subscription|managed service|run(?:s|ning)? (?:our|the)|operate|support desk|service desk)\b/.test(userText()),
  outsrc:   f => yes(f.tech_service) && REL.ongoingSvc(f),
  techy:    f => yes(f.ict_outsourcing) || ["cloud","it-services","software","market-data","telecom"].includes(f.category),
  ongoing:  f => yes(f.ict_outsourcing) || ["facilities","cloud","telecom","software","market-data"].includes(f.category),
  creates:  f => ["it-services","consulting","marketing"].includes(f.category) || (f.category==="software" && /build|develop|custom/.test(userText())),
  volume:   f => ["training","facilities","telecom","marketing"].includes(f.category),

// Only what the requester must answer for each route. Anything procurement or the supplier can supply
// (payment model, subcontractors, certifications, evaluation weights, cost centre) is not asked.
// It is still picked up and used if the requester mentions it.
function requiredFor(route, f){
  const g=GOODSLIKE(f), sw=f.demand_type==="software", cont=f.demand_type==="contingent_labour", on=(c,k)=>c?[].concat(k):[];
  const data = () => ["personal_data", ...on(REL.pd(f),"data_details")];
  // ICT and outsourcing: the technology question is only asked when the rules can't tell; the outsourcing question only for an ongoing technology service
  const ict = () => ["tech_service", ...on(REL.outsrc(f),"ict_outsourcing")];
  const role = () => cont ? ["role","headcount","skills"] : [];
  // the service profile: suggested answers the requester confirms in one tap (bundled into one question below the threshold)
  const profileFull = ["functions","benefits","usp","acceptance","reg_benefits"];
  switch(route){
    case "catalogue":  return ["item","quantity","needed_by","location"];
    case "contract":   return cont ? [...role(),"deliverables",...on(!contractAgreed(f),"contract_ok"),"needed_by","duration","location","day_rate","system_access",...on(REL.pd(f),"data_details")]
                       : g ? ["item","quantity",...on(!contractAgreed(f),"contract_ok"),"value","needed_by"]
                           : ["deliverables",...on(!contractAgreed(f),"contract_ok"),"needed_by","duration","value",...data()];
    case "quote":      return g ? ["item","quantity",...on(sw,"must_haves"),"background","needed_by",...on(!sw,"location"),"value","supplier",...on(sw,data()),"profile"]
                                : [...role(),"deliverables","background",...on(REL.volume(f),"volume"),"needed_by",...on(cont,["duration","day_rate"]),"value","supplier",...data(),"profile"];
    case "sourcing":   return g
      ? ["item","quantity","must_haves","background","users",...on(sw,"current_solution"),...on(!S.asked.background,"impact_delay"),"needed_by",...on(!sw,"location"),"value","supplier",...on(hasSupplier(f),"supplier_reason"),"budget_approved",
         ...on(sw,[...data(),...ict()]),...profileFull]
      : [...role(),"deliverables","background","users","current_solution",...on(!S.asked.background,"impact_delay"),...on(REL.volume(f),"volume"),"needed_by","duration",...on(cont,"day_rate"),"value","supplier",...on(hasSupplier(f),"supplier_reason"),"budget_approved",
         ...data(),...ict(),...profileFull];
  }
  return [];
}

  {id:"risk",    name:"Data and systems",     intro:"A few checks on data and systems. They decide which reviews are needed.", facts:["personal_data","data_details","system_access","tech_service","ict_outsourcing","criticality"]},

const stageOf = k => { const i=STAGES.findIndex(st=>st.facts.includes(k)); return i<0?0:i; };
const posIn = k => { const st=STAGES[stageOf(k)]; return st.facts.indexOf(k); };

const stageFacts = id => (S.req||[]).filter(k=>stageById(id).facts.includes(k));
const stageDone = id => id==="review" ? !!S.completed : stageFacts(id).every(k=>known(S.f[k]));

/* =========================================================
   5. RULES ENGINE (deterministic)
   ========================================================= */
const catById = id => CATEGORIES.find(c=>c.id===id) || {id, name:id||"–", type:"services"};
const known = v => v!==null && v!==undefined && v!=="";
const contractAgreed = f => f.contract_ok===true || (S.det && S.det.contract && hasSupplier(f) && String(f.supplier).toLowerCase().includes(S.det.contract.supplier.toLowerCase().split(" ")[0]));
const hasSupplier = f => known(f.supplier) && !/^(none|no|no preference|not sure|n\/a)$/i.test(String(f.supplier).trim());
const yes = v => v===true || /^y/i.test(String(v));
const userText = () => " "+S.msgs.filter(m=>m.role==="user").map(m=>m.text).join(" ").toLowerCase()+" ";
const catalogueMatches = () => { const t=userText(); return CATALOGUE.filter(i=>i.kw.some(k=>t.includes(k))); };
const daysTo = d => (new Date(d) - new Date())/864e5;

function contractFor(f){
  if(f.decline_contract) return null;
  const today=new Date(), list=CONTRACTS.filter(c=>c.category===f.category && new Date(c.expires)>today);
  if(!hasSupplier(f)) return list[0]||null;
  const s=String(f.supplier).toLowerCase();
  return list.find(c=>c.supplier.toLowerCase().includes(s)||s.includes(c.supplier.toLowerCase()))||null;
}

function determine(){
  const f=S.f, T=CONFIG.thresholds, v=known(f.value)?Number(f.value):null;
  const cat = catalogueMatches(), ctr = contractFor(f);
  let route, why;
  if(cat.length && GOODSLIKE(f)){ route="catalogue"; why=`${cat.map(i=>i.name).join(" and ")} ${cat.length>1?"are":"is"} in the catalogue, so you can order directly at the agreed price.`; }
  else if(ctr){ route="contract"; why = f.demand_type==="contingent_labour"
      ? `External workers come through the ${ctr.title} with ${ctr.supplier}, so this is a call-off with a role profile. No new competition is needed.`
      : `The ${ctr.title} with ${ctr.supplier} already covers this, with ${money(ctr.remaining)} left until ${fmtDate(ctr.expires)}. No new competition is needed.`; }
  else if(v!=null && v<=T.quickQuoteMax){ route="quote"; why=`This is new demand with no contract in place. At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is under the ${money(T.quickQuoteMax)} threshold, so the business leads the sourcing: you collect at least three quotes, with procurement's guidance.`; }

function controlsFor(route, ctr){

function nextSteps(route, cat, ctr){

/* ---------- ICT (DORA) and outsourcing: a decision tree run by rules, never a picker for the user ---------- */
const TECH_WORDS=/\b(software|systems?|platform|cloud|saas|paas|iaas|hosting|hosted|data feeds?|data cent(?:re|er)|digital|cyber\w*|network|infrastructure|applications?|apps?|technology|database|api|it support|help ?desk|service desk|developers?|engineers?|architects?|devops|testers?|erp|crm|sap)\b/;
function userRaw(){ return " "+S.msgs.filter(m=>m.role==="user").map(m=>m.text).join(" ")+" "; }
function techFromRules(f){
  const raw=userRaw(), t=raw.toLowerCase().replace(/personal data|client data|customer data|employee data/g,"");
  const it=/\b(IT|ICT)\b/.test(raw) || TECH_WORDS.test(t);
  if(TECH_CATS.includes(f.category)) return true;
  if(f.demand_type==="contingent_labour") return it || /\b(java|python|\.net|sql|cloud|security|data)\b/i.test([f.role,f.skills].join(" "));
  if(GOODSLIKE(f)) return /as a service|leasing|managed devices/.test(t);

}
function ictType(f){
  const t=userText()+" "+[f.item,f.deliverables,f.skills,f.role,f.summary].filter(Boolean).join(" ").toLowerCase(), has=re=>re.test(t);
  if((has(/\bsaas\b|software as a service|cloud[- ]based|subscription|\bhosted\b|host and run|hosts? (?:it|and run)/) || (f.category==="software" && yes(f.ict_outsourcing))) && (f.category==="software"||has(/software|tool|system|platform|application/))) return "Cloud services: SaaS";
  if(has(/\bpaas\b|platform as a service/)) return "Cloud services: PaaS";
  if(has(/\biaas\b|infrastructure as a service/)) return "Cloud services: IaaS";
  if(f.category==="cloud") return has(/data cent(?:re|er)|colocation|on[- ]prem/)?"ICT facilities and hosting (excluding cloud)":"Cloud services: IaaS";
  if(f.category==="market-data") return "Provision of data";
  if(f.category==="telecom") return has(/network|\bwan\b|\blan\b|connectivity/)?"Network infrastructure":"Telecom carrier services";
  if(has(/cyber|penetration test|security operations|it security|ict security/)) return "ICT security management";
  if(has(/ict risk|it risk|technology risk/)) return "ICT risk management";
  if(has(/data analy|analytics|screening/)) return "Data analysis";
  if(has(/data storage|archiv/)) return "Data storage (excluding cloud)";
  if(has(/help ?desk|service desk|first[- ]level support|user support/)) return "ICT help desk and first-level support";
  if(has(/managed service|it operations|run and maintain|operate (?:our|the)/)) return "ICT operation management";
  if(GOODSLIKE(f) && has(/as a service|leasing|managed devices/)) return "Hardware and physical devices";
  if(f.category==="software") return "Software licensing (excluding SaaS)";
  if(has(/project manag/)) return "ICT project management";
  if(f.category==="it-services"||has(/develop|build|implement|integrat|testing|engineer|devops|programm/)) return "ICT development";
  if(f.category==="consulting"||has(/architect|consult|analyst|advis/)) return "ICT consulting";

}
function classify(f){
  const ong=REL.ongoingSvc(f), type=ictType(f);
  const ict = f.tech_service===true ? (ong?{flag:"Yes",text:`Likely an ICT service under DORA (${type}). Flag for ICT review.`}:{flag:"Possible",text:`Possibly an ICT service (${type}), delivered once rather than ongoing. The ICT review confirms.`})
    : f.tech_service==="unsure" ? {flag:"To confirm",text:"Not clear yet whether this is an ICT service. The ICT review confirms."}
    : f.tech_service===false ? {flag:"No",text:"Not an ICT service, based on the answers."} : null;
  const out = yes(f.ict_outsourcing) ? {flag:"Yes",text:"Likely outsourcing: the supplier runs something for us on an ongoing basis that we would otherwise do ourselves. Flag for outsourcing review."}
    : f.ict_outsourcing==="unsure" ? {flag:"To confirm",text:"Not clear yet whether this is outsourcing. The outsourcing review confirms."}
    : f.ict_outsourcing===false ? {flag:"No",text:"Not outsourcing, based on the answers."}
    : known(f.tech_service) && !REL.outsrc(f) ? {flag:"No",text:"Not outsourcing: no ongoing service is run for us."} : null;
  return {ict, out, type};

function deriveFacts(f){
  const d=S.derived;
  if("tech_service" in d && f.tech_service!==d.tech_service) delete d.tech_service;   // the user or the AI set it: keep theirs
  if(!known(f.tech_service) || "tech_service" in d){
    const v=techFromRules(f);
    if(v===null){ if("tech_service" in d){ f.tech_service=null; delete d.tech_service; } }
    else { f.tech_service=v; d.tech_service=v; }
  }
}

function refresh(){
  const f=S.f;
  if(!known(f.category)){ S.det=null; S.missing=["need"]; return; }
  deriveFacts(f);
  // catalogue items: fill item and an estimated value automatically
  S.det = determine();
  if(S.det.route==="catalogue"){
    if(!known(f.item)) f.item = S.det.catalogue.map(i=>i.name).join(", ");
    if(known(f.quantity) && !known(f.value)){ f.value = S.det.catalogue[0].price*(parseInt(f.quantity)||1); f.value_is_estimate=true; }
  }
  if(f.demand_type==="contingent_labour" && !known(f.value) && known(f.day_rate)){ const v=parseMoney(f.day_rate); if(v) f.value = v<5000 ? v*20*monthsOf(f.duration) * (parseInt(f.headcount)||1) : v; if(v) f.value_is_estimate=v<5000; }
  S.det = determine();
  const req = requiredFor(S.det.route, f);
  S.req = req;
  S.stageIds = STAGES.filter(st=>st.id==="review"||req.some(k=>st.facts.includes(k))).map(st=>st.id);
  const order = [...req].sort((a,b)=>(stageOf(a)-stageOf(b))||(posIn(a)-posIn(b)));
  S.missing = order.filter(k=>!known(f[k]));
}
/* ---------- answer quality checks (rules; the AI adds its own view on top) ---------- */
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(str){
  const t=String(str||"").toLowerCase().trim(), now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(!t) return null;
  if(/\b(asap|as soon as possible|immediately|urgent(ly)?|right away|now)\b/.test(t)) return d0;
  if(/next week/.test(t)) return new Date(+d0+7*864e5);
  if(/next month/.test(t)) return new Date(now.getFullYear(),now.getMonth()+1,1);
  if(/next quarter/.test(t)) return new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3+3,1);
  if(/next year/.test(t)) return new Date(now.getFullYear()+1,0,1);
  let m=t.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/\b(\d{1,2})[./](\d{1,2})[./](\d{2,4})\b/); if(m) return new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
  m=t.match(/\bq([1-4])(?:\s*(\d{4}))?/); if(m){ let y=m[2]?+m[2]:now.getFullYear(); let d=new Date(y,(+m[1]-1)*3,1); if(!m[2]&&d<d0) d=new Date(y+1,(+m[1]-1)*3,1); return d; }
  m=t.match(/\b(?:(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?)?(?:(end|mid|early|beginning)\s+(?:of\s+)?)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:\s+(\d{1,2})(?:st|nd|rd|th)?)?(?:\s+(\d{4}))?/);
  if(m){ const mi=MONTHS.indexOf(m[3]); let day=+(m[1]||m[4]||1); if(m[2]==="end") day=28; if(m[2]==="mid") day=15;
    let y=m[5]?+m[5]:now.getFullYear(); let d=new Date(y,mi,day); if(!m[5] && d < new Date(+d0-20*864e5)) d=new Date(y+1,mi,day); return d; }
  return null;
}
const LEAD_DAYS={catalogue:3,contract:7,quote:14,sourcing:45};

const STOP=new Set("the and for with that this from have has had are was were will would should could can our your their they them you its it's into onto over under about after before then than when what which who whom why how there here also just only very more most some any all each other such been being not but nor yet out off per via upon within without because while where these those does did done doing make made get got let one two three four five six well much many lot lots like want need needs needed please thanks thank yes".split(" "));

function contentWords(t){ return (String(t||"").toLowerCase().match(/[a-zäöüß][a-zäöüß-]{2,}/g)||[]).filter(w=>!STOP.has(w)); }
function offTopic(k, v){

// returns {fact, issue, message, choices} for the first real problem in what changed this turn, or null
function findIssue(changed){

  for(const k of changed){
    if(S.challenged[k]) continue;
    const v=f[k];
    if(["deliverables","acceptance","background","users","current_solution","impact_delay","must_haves","data_details","skills","supplier_reason","renewal_change","item"].includes(k) && typeof v==="string"){
      const tooShort = ["deliverables","acceptance","background","users","current_solution","must_haves"].includes(k) ? words(v)<2 : k==="supplier_reason" ? words(v)<3 : false;
      if((VAGUE.test(v.trim()) && !((k==="renewal_change"||k==="impact_delay")&&/no/i.test(v))) || tooShort)

      }

      if(bigWork && val<5000) return {fact:k, issue:`looks low for ${catById(f.category).name.toLowerCase()} work`, message:`Just to check: ${money(val)} is low for ${catById(f.category).name.toLowerCase()} work like this. Is that the total budget, or should it be higher?`, choices:["Yes, that's the total"]};

    }

      const m=userRaw().match(/\b(IT|ICT|software|system|platform|cloud|SaaS|hosting|data feed|application|digital)\b/i);
      if(m) return {fact:k, issue:`"no technology service" although the request mentions ${m[1]}`, message:`You mentioned ${/^(it|ict|saas)$/i.test(m[1])?m[1].toUpperCase():m[1].toLowerCase()}. Will the supplier provide, run or advise on any technology or data for us?`, choices:["Yes","No, none at all"]};

// overall assessment of the intake: completeness, clarity, consistency
function computeQuality(aiRemarks){

  const label=k=>FACTS[k]?FACTS[k].label:k;
  for(const fl of S.flags){
    if(fl.status==="confirmed") pts.push({lvl:"warn",text:`${label(fl.fact)}: ${fl.issue}. Confirmed by you, so the buyer may ask again.`});
    else if(fl.status==="flexible") pts.push({lvl:"info",text:`Start date is flexible (${fl.issue}).`});
    else if(fl.status==="corrected") pts.push({lvl:"ok",text:`${label(fl.fact)} clarified during the intake.`});
    else if(fl.status==="unanswered") pts.push({lvl:"warn",text:`${label(fl.fact)}: no usable answer given.`});

  if(route==="sourcing" && f.budget_approved && f.budget_approved!=="yes") pts.push({lvl:"warn",text:"Budget not yet approved. Sourcing can only start once it is."});
  if(known(f.needed_by) && !S.flags.some(x=>x.fact==="needed_by")){ const d=parseWhen(f.needed_by); if(d){ const days=(d-new Date())/864e5; if(days<(LEAD_DAYS[route]||0)) pts.push({lvl:"info",text:`Tight timeline: ${CHANNELS[route].name} usually takes ${CHANNELS[route].days} working days.`}); } }
  (aiRemarks||[]).filter(x=>typeof x==="string"&&x.trim()&&!/^(none|n\/a|no (issues|concerns|remarks)|nothing)\b/i.test(x.trim())).slice(0,2).forEach(x=>pts.push({lvl:"info",text:x.trim().replace(/\.?$/,".")}));
  const answered=req.filter(k=>known(f[k])&&f[k]!=="Not given"&&f[k]!=="unsure").length, complete=req.length?Math.round(answered/req.length*100):100;
  const warn=pts.filter(p=>p.lvl==="warn").length, info=pts.filter(p=>p.lvl==="info").length;
  const score=Math.max(35,Math.min(100,100-15*warn-5*info-Math.round((100-complete)/2)));
  const rating=score>=90?"Strong":score>=75?"Good":score>=55?"Fair":"Needs work";
  return {score,rating,complete,points:pts};
}

async function callLLM(system, history, retried){
  const p=CONFIG.provider, key=CONFIG.keys[p], model=CONFIG.models[p];
  if(p==="server"){
    const r=await fetch("/api/llm",{method:"POST",signal:AbortSignal.timeout(58000),headers:{"Content-Type":"application/json","x-access-code":CONFIG.accessCode||"",...(CONFIG.forceProvider?{"x-force-provider":CONFIG.forceProvider}:{})},body:JSON.stringify({system,history})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401) throw new Error("Access code missing or wrong. Enter it under Rules.");

    if(r.status===429 && (retried||0)<2 && d.retryAfter && d.retryAfter<=20){ await new Promise(res=>setTimeout(res,(d.retryAfter+1)*1000)); return callLLM(system, history, (retried||0)+1); }
    if(!r.ok){ const e=new Error(d.error||`Server error ${r.status}`); e.quota=r.status===429||!!d.quota; throw e; }
    if(SERVER && d.provider) SERVER.last=d.provider;
    return parseJSON(d.text);
  }
  if(p==="gemini"){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json"},body:JSON.stringify({
      systemInstruction:{parts:[{text:system}]},
      contents:history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
      generationConfig:{temperature:0.4,responseMimeType:"application/json",...(/flash/i.test(model)?{thinkingConfig:{thinkingBudget:0}}:{})}})});
    const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Gemini error ${r.status}`);
    return parseJSON((d.candidates?.[0]?.content?.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join(""));
  }
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({model,temperature:0.4,response_format:{type:"json_object"},messages:[{role:"system",content:system},...history]})});
  const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Groq error ${r.status}`);
  return parseJSON(d.choices?.[0]?.message?.content);
}
function parseJSON(t){ t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(); try{return JSON.parse(t);}catch(e){const m=t.match(/\{[\s\S]*\}/); if(m){ try{return JSON.parse(m[0]);}catch(e2){} } return {_raw:true, reply:t}; } }

subcontracting (true | false | "unsure"), pricing_model, service_levels, ip_ownership, performance (how the current supplier performed).

${contextLines()}

Return JSON only: {"facts":{...only keys you are setting...},"reply":"","asking":"the key from still_needed your question is about","choices":[],"complete":false,"suggestion":"","assessment":{"fact":"","ok":true,"issue":"","follow_up":"","score":10}}
"asking" must be the key of the first unknown item in still_needed. Do not ask about anything else.`;

function chatHistory(){

const INTERNAL_KEYS=new RegExp(`\\b(?:${Object.keys(BLANK_FACTS).filter(k=>k.includes("_")).join("|")}|still_needed|known_facts|already_checked|pending_check|route_so_far|facts?\\s*(?:object|json)|json)\\b`,"i");

  if(!t || typeof t!=="string") return t;
  const sents=t.split(/(?<=[.!?])\s+/), kept=sents.filter(x=>!INTERNAL_KEYS.test(x) && !INTERNAL_VALS.test(x)).map(x=>x.replace(/\b[a-z]+(?:_[a-z]+)+\b/g,"").trim()).filter(Boolean);
  return kept.length===sents.length ? t : (kept.join(" ").trim() || null);
}

const NARR_MAX=1000;
function clampText(t, max=NARR_MAX){

}
function composeNarrative(d){

  const dependencies=[...(g("budget_approved")&&g("budget_approved")!=="yes"?["Budget approval before the order"]:[]),...(yes(f.personal_data)?["Data processing agreement signed before the start"]:[]),

    scope_out, requirements, deliverables: g("deliverables")?split(g("deliverables")):(goods&&g("item")?[itemLine]:[]), milestones,

const execSpec = () => { const L=execLimits(); return `1. "description": the EXECUTIVE SERVICE DESCRIPTION for business case approvers at a financial institution. It says WHAT is being bought and WHY.
   Executive, concise and engaging language; focus on business outcomes rather than technical implementation. Third person.
   Fields:
   name: the service name, at most 6 words (a clear label, not a sentence).
   tagline: a short distinguishing label after the name, at most 8 words (for example "One front door for procurement").
   headline: ${L.headMin} to ${L.head} words that summarise the service: what it is, who it is for and its main value.
   exec: ${L.execMin} to ${L.exec} words in 2 to 4 short paragraphs (separate them with a blank line): what the service is, who it is for, which functions it supports, how it works at business level, and why it is valuable.
   audience, functions, problem, usp, regulatory: one sentence or a short list each, for the summary table.
   capabilities, benefits, kpis: arrays of short items for the summary table.
   Base everything on the conversation and the confirmed facts (users = target audience, functions, benefits, usp = unique selling points, acceptance = KPIs, reg_benefits = regulatory benefits).
   regulatory: "" when reg_benefits says there is no specific benefit.
   STRICT: the description must NOT contain amounts or budgets, dates, timing or duration, delivery location, supplier names or preferences, budget approval, cost centres,
   the buying route, contracts or frameworks, or the risk answers about this purchase (personal data, system access, whether it is outsourcing, criticality, subcontracting). These are captured separately.
   Never copy the user's raw wording such as "I don't know" or typos. Never invent facts.`; };
const DOC_SYSTEM = () => `You write two things for a corporate procurement request, based on the conversation and the facts.
${S.det&&NEW_DEMAND(S.det.route)?execSpec():`1. "description": the SERVICE DESCRIPTION, for review by senior stakeholders. It says WHAT is being bought and WHY. Professional, concise, business-focused, third person.
   Fields (plain strings unless stated):
   name: short name of the service or product, at most 8 words.
   summary: what the service does or what is bought, 2 to 3 sentences.
   audience: who will use it or benefit from it.
   problem: the business problem it solves.
   functions: which functions or teams of the organisation it supports or enables.
   capabilities: array of 3 to 6 key capabilities or deliverables.
   benefits: array of 2 to 4 main benefits that follow from the problem and the capabilities.
   difference: what changes compared with today's solution or process, and why external support is needed.
   success: how success is measured.
   regulatory: regulatory, control, auditability, governance, resilience or compliance benefits. ONLY if the conversation supports it, otherwise "".
   narrative: the same description written as one flowing summary paragraph for a reader who reads nothing else, at most 1000 characters (shorter is fine). Same rules as above.
   STRICT: the description must NOT contain amounts or budgets, dates, timing or duration, delivery location, supplier names or preferences, budget approval, cost centres,
   the buying route, contracts or frameworks, or risk answers (personal data, system access, outsourcing, criticality, subcontracting). These are captured separately.
   Never copy the user's raw wording such as "I don't know" or typos. Use only what the conversation supports; leave a field "" (or []) when there is nothing to say. Never invent facts.
   For a simple catalogue order, fill only name, summary and, if given, problem.`}
2. "brd": the BUSINESS REQUIREMENTS DOCUMENT content, complete enough for the sourcing, risk and contract teams to work from without asking again. Here all captured details belong.

You may propose sensible out-of-scope items, milestones, assumptions and evaluation weights that follow from the facts; mark proposals with "(proposed)".

Security, Resilience, Compliance, Supplier, Commercial, Contract, Resourcing, Skills. Priority: Must, Should or Could. 8 to 20 requirements.
Plain language, short sentences, no marketing words, no jargon.
Return JSON only:
{"description":${S.det&&NEW_DEMAND(S.det.route)?`{"name":"","tagline":"","headline":"","exec":"","audience":"","functions":"","problem":"","capabilities":[""],"benefits":[""],"usp":"","kpis":[""],"regulatory":""}`:`{"name":"","summary":"","audience":"","problem":"","functions":"","capabilities":[""],"benefits":[""],"difference":"","success":"","regulatory":"","narrative":""}`},
 "brd":{"background":"","objectives":[""],"success_criteria":[""],"scope_in":[""],"scope_out":[""],
  "requirements":[{"type":"","text":"","priority":"Must"}],"deliverables":[""],"milestones":[{"milestone":"","timing":""}],
  "timeline":"","location":"","volumes":"","service_levels":[""],"supplier_requirements":[""],"risk_and_compliance":[""],
  "commercials":[""],"evaluation":[{"criterion":"","weight":"40%"}],"stakeholders":[{"role":"","who":""}],
  "assumptions":[""],"dependencies":[""],"open_points":[""]},

const nonEmpty = v => Array.isArray(v) ? v.filter(x=>x&&(typeof x!=="object"||Object.values(x).some(Boolean))).length>0 : !!(v&&String(v).trim());
function mergeBRD(base, ai){
  const out={...base};
  if(ai && typeof ai==="object") for(const [k,v] of Object.entries(ai)) if(nonEmpty(v) && k in base) out[k]=v;
  if(Array.isArray(out.requirements)) out.requirements=out.requirements.filter(r=>r&&r.text).map((r,i)=>({id:`BR-${String(i+1).padStart(2,"0")}`,type:r.type||"Requirement",text:r.text,priority:r.priority||"Must"}));
  // facts the rules depend on are never dropped by the AI version
  out.risk_and_compliance=[...new Set([...(out.risk_and_compliance||[]),...(base.risk_and_compliance||[]).filter(x=>!(out.risk_and_compliance||[]).length)])];
  return out;
}

function downloadWord(){

  const b=new Blob(["﻿",doc],{type:"application/msword"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`BRD - ${S.sd.title.replace(/[^\w\- ]+/g,"").slice(0,60)}.doc`; a.click();

function bind(){
  const o=$("#ovr"); if(o) o.onchange=e=>{S.override=e.target.value;render();};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="submit") submit(); if(a==="json") download(); if(a==="brd") openBRD();
    if(a==="more"){ S.showMore=!S.showMore; render(); }
    if(a==="copy") navigator.clipboard?.writeText(sdText()).then(()=>b.textContent="Copied");
  });
  document.querySelectorAll("[data-sd]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sd; S.sd[k]=el.textContent.trim(); S.brdEdited=null;}));

    d[k] = Array.isArray(d[k]) ? el.innerText.split(el.tagName==="TD"?/;|\n/:/\n/).map(x=>x.trim()).filter(Boolean) : k==="narrative" ? clampText(el.textContent) : k==="exec" ? [...el.querySelectorAll("p")].map(p=>p.textContent.trim()).filter(Boolean).join("\n\n")||el.innerText.trim() : el.textContent.trim();

function renderSide(){

  if(!D){ $("#side").innerHTML=`<div class="panel"><div class="eyebrow">Your request</div><p class="muted" style="margin:8px 0 0">Start by describing what you need. The route and what's needed for it appear here.</p></div>${sideNote()}`; return; }
  const req=S.req||[], done=req.filter(k=>known(f[k])).length, pct=req.length?Math.round(done/req.length*100):100;

  }).join("");
  $("#side").innerHTML=`<div class="panel">
      <div class="eyebrow">Route ${S.missing.length?"so far":""}</div>

}

      $("#pf").innerHTML=`<label>${names[p]} API key</label><input class="inp" type="password" id="key" value="${esc(CONFIG.keys[p])}"><label>Model</label><input class="inp" id="model" value="${esc(CONFIG.models[p])}"><button class="btn btn-g" id="tbtn" style="margin-top:12px">Test connection</button>`;
      $("#key").oninput=e=>{CONFIG.keys[p]=e.target.value.trim();render();}; $("#model").oninput=e=>CONFIG.models[p]=e.target.value.trim();
      $("#tbtn").onclick=async()=>{$("#test").innerHTML=`<div class="alert info">Testing…</div>`;try{await callLLM('Return JSON {"ok":true}',[{role:"user",content:"ping, reply in json"}]);$("#test").innerHTML=`<div class="alert info">Connected.</div>`;}catch(e){$("#test").innerHTML=`<div class="alert err">${esc(e.message)}</div>`;}};
    };
    pf();
    document.querySelectorAll("#prov button").forEach(b=>b.onclick=()=>{CONFIG.provider=b.dataset.p;document.querySelectorAll("#prov button").forEach(x=>x.classList.toggle("on",x===b));pf();render();});
  }
  [["#t2","quickQuoteMax"],["#t3","materialityMin"]].forEach(([id,k])=>$(id).oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v))CONFIG.thresholds[k]=v;});
  const close=()=>{$("#drawerRoot").innerHTML=""; if(S.det){refresh(); if(!S.missing.length) showRecommendation();} render();};
  $("#close").onclick=close; $("#scrim").onclick=close;
}

/* =========================================================
   11. WIRING
   ========================================================= */
function reset(){ Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,fresh()); render(); $("#inp").focus(); }
const inp=$("#inp");
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#comp").requestSubmit();}});
$("#comp").onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value="";inp.style.height="auto";handleUser(t);};
$("#doccss").textContent=DOC_CSS;
$("#cfgBtn").onclick=openSettings; $("#newBtn").onclick=reset; $("#sumBtn").onclick=()=>$("#side").classList.toggle("open");
(async()=>{
  render(); await detectServer(); resolveProvider();
  if(CONFIG.provider==="server" && SERVER.accessRequired && !CONFIG.accessCode){
    try{CONFIG.accessCode=sessionStorage.getItem("ac")||"";}catch(e){}
    if(!CONFIG.accessCode){ const c=prompt("Enter the access code for this demo:"); if(c){CONFIG.accessCode=c.trim(); try{sessionStorage.setItem("ac",CONFIG.accessCode);}catch(e){}} }
  }
  render();
})();
</script>
