  } finally { Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, saved); CONV_SEQ=seq; }
}
const specTry = (fn, fallback="(could not be generated)") => { try{ return fn(); }catch(e){ return `${fallback}: ${e.message}`; } };
const specOrder = keys => [...keys].sort((a,b)=>(stageOf(a)-stageOf(b))||(posIn(a)-posIn(b)));
const specLabel = k => k==="confirm_derived" ? "Check step" : FACTS[k] ? FACTS[k].label : k;
const specExample = label => (TRIES.find(x=>x[1]===label)||TRIES[0])[2];

function specModel(withCurrent){
  const {h,p,ul,ol,table,prompt}=SB, T=CONFIG.thresholds, eur=v=>money(v), R=RULESETS, B=[];
  const main=specExample("Software, RFP"), cat=specExample("Catalogue"), quote=specExample("Under €50k");
  // the user's own conversation, read only (panel only, never in the download)
  const current = withCurrent && S.det ? {
    system: specTry(()=>chatSystem()),
    user: specTry(()=>chatUser(S.msgs.filter(m=>!m.kind).slice(-8).map(m=>`${m.role==="user"?"User":"Assistant"}: ${m.text}`).join("\n"), "(your next message)", S.pending)),
    route: CHANNELS[S.det.route].name } : null;
  // everything that depends on a request, taken from the real code run on the welcome examples
  const ex = withExampleState(main, ()=>{
    const req=specOrder(S.req||[]), sug=req.find(k=>bundleOf(k)&&isSug(k))||req.find(k=>isSug(k));
    return { route:CHANNELS[S.det.route].name, limits:execLimits(),
      rows:req.map(k=>{ const F=FACTS[k]||{}, ch=typeof F.choices==="function"?F.choices(S.f):F.choices;
        return k==="confirm_derived" ? ["Check step","The list of what the rules worked out (see below)","","",'"Yes, that\'s right", "Something\'s wrong"',""]
          : [F.label, specTry(()=>F.q(S.f)), specTry(()=>F.ex?F.ex(S.f):""), isSug(k)?"Yes":"", (ch||[]).join(", "), known(S.f[k])?"✓ not asked":""]; }),
      chatSys:specTry(()=>chatSystem()), chatMsg:specTry(()=>chatUser("", main, null)),
      sugKey:sug, sugSys:sug?specTry(()=>suggestSystem(sug)):"", sugMsg:sug?specTry(()=>suggestUser(sug)):"",
      docSys:specTry(()=>DOC_SYSTEM()), docMsg:specTry(()=>docUser()),
      payloadKeys:specTry(()=>Object.keys(payload()).join(", "), "created, facts, conversation, decision, quality, …") };
  });
  const exCat = withExampleState(cat, ()=>({ route:CHANNELS[S.det.route].name, docSys:specTry(()=>DOC_SYSTEM()) }));
  const exQuote = withExampleState(quote, ()=>({ limits:execLimits() }));
  const flows = TRIES.map(([g,lab,text])=>withExampleState(text, ()=>[`${lab} (${g.toLowerCase()})`, `“${text}”`, S.det?CHANNELS[S.det.route].name:"–", specOrder(S.req||[]).map(k=>(known(S.f[k])?"✓ ":"")+specLabel(k)).join(" → ")]));
  const frameworks = CONTRACTS.filter(c=>new Date(c.expires)>new Date());

  B.push(h(1,"How Guided Intake works"),
    p(`Generated ${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})} from the code of this page. Outsourcing group standard: **${R.current.id}**. Thresholds as set in the code. Prompts are shown exactly as the app sends them, for a welcome-screen example. For business readers, the **Decision tree** (in the header) tells the same rules as decisions.`));
  if(current) B.push(h(2,"Your current request"),
    p(`So far: **${current.route}**. This is the prompt the AI gets with your next message. It is shown here only and is not part of the download.`),
    prompt("Chat prompt for your request", current.system), prompt("Message sent with your next answer", current.user));

  B.push(h(2,"1. What it is"),
    p("Guided Intake turns a request in plain words into a procurement-ready request: the buying route, the details that route needs, a service description and the documents."),
    ul(["**Fixed rules decide:** the category, the route, which questions are asked and in which order, what is worked out from the answers (technology, outsourcing, entity, offshoring), the check step, the reviews and the quality score.",
      "**The AI (when available) does:** read facts from free text, phrase the next question with an example, suggest answers, judge answers and write the documents.",
      "**The AI never decides:** the route, which questions are asked, the outsourcing or ICT classification, or the quality score.",
      "**Without AI** the same rules ask standard questions with examples and build the documents from the answers."]));

  B.push(h(2,"2. How it is built"),
    ul(["**One page** (`index.html`): the screen, the rules, the prompts and the fallback without AI, in numbered script sections (configuration, reference data, …, how it works, wiring).",
      "**A small server function** (`api/llm.js`, on Vercel) holds the AI keys, tries the AI providers in order and returns the answer as text.",
      "**Two modes**, chosen at start: **server** (the function answers) and **offline** (no AI: the page was opened as a file, or no server was found). When a call fails or every provider is at its limit, that message is handled by the rules."]),
    table(["Order","Provider","Notes"],[["1","Gemini (main model)","gemini-2.5-flash by default"],["2","Gemini (fallback model)","gemini-2.5-flash-lite by default"],["3","Groq","rotates through up to 6 models"],["4","Mistral","rotates through its small models"],["5","OpenRouter","its free models, as a last backup (about 50 requests a day without credits)"]]),
    ul([`**Time limits:** 25 s per provider call; 55 s per request in total (no new provider is started after 30 s once something failed); the page waits up to ${LLM_CLIENT.timeoutMs/1000} s.`,
      `**Usage limits:** a provider at its limit is skipped for the time it asks for. When all are at their limit the server answers 429 with a retry time. The page retries at most ${LLM_CLIENT.retries} times, and only when the retry time is at most ${LLM_CLIENT.retryMaxS} s and the 429 came back within ${LLM_CLIENT.fastMs/1000} s; otherwise that message is handled by the rules.`,
      "**Access code:** with `ACCESS_CODE` set, the page asks for it (checked at `/api/llm?verify`) and sends it with every AI call as the header `x-access-code`. `GET /api/llm` reports which providers are configured.",
      ...(SERVER?[`**On this deployment:** ${Object.keys(PNAMES).filter(x=>SERVER.providers[x]).map(x=>PNAMES[x]).join(", ")||"no provider"} configured${SERVER.accessRequired?", access code required":""}.`]:[])]));

  B.push(h(2,"3. When an AI model is called"),
    table(["Call","When","What it gets","What it returns","If it fails"],[
      ["A. Chat turn","Every typed answer while the AI is on. Not for a button click, a plain “ok” to a suggestion or “skip” (the rules read those exactly and save tokens), corrections the rules already understood, questions back the rules answer, or a request to change the documents","The chat prompt (about 20 Level 4 candidates, not the whole list, only on the first message and at the check step); the last 6 messages, each cut to 400 characters; the latest message; the app's state: known facts, route so far, items already checked, a pending check, the next items still needed with their question and example","JSON: facts, reply, asking, choices, complete, suggestion, corrections, answers_question, assessment (fact, ok, issue, follow-up, score 1–10)","A short note in the chat; the rules read the answer and ask the standard question"],
      ["B. Suggestion","The next question is a suggestion item and the chat turn gave no usable suggestion; also when the chat resumes (after a correction, the improvement round or Add)","The suggestion prompt; the question; what is known; the rules' own draft","One plain string; for bundles one “Label: text” line per label","The rules' draft is shown"],
      ["C. Documents","Once every needed detail is there (rebuilt only when the facts change)","The documents prompt; the whole conversation; the facts; category; ICT and outsourcing result; route and. New demand also: critical-function flag, entity, check-step result, up to 5 Level 4 candidates. Not for a catalogue order or a low-value purchase (built from the answers)","JSON: the description (with hard word limits per field); new demand also l4_final; quality_remarks","One retry (none at a usage limit); the description is built from the answers"],
      ["D. Document change","“Make it shorter”, “rewrite the summary” … once a description exists","The documents prompt; the current description and requirements; the request","The same JSON; description and requirements are merged","A note; the text can be edited directly"]]));

  B.push(h(2,"4. One message, step by step"),
    ol(["A reply still typing out is shown in full, and the message is added to the chat.",
      "**Open offers come first:** an answer to “improve it?” or to a correction the chat asked about.",
      "**Corrections in words** (“sorry, the budget is 80k not 30k”, “it's not software, it's consulting”, “it's more consulting support”) are applied by the rules; the route is checked again and the chat returns to the open question. A category named in answer to an open question (“it's more of a software problem”) is asked about first. A category change the AI reads but files among the facts is applied when the requester's own words name that category; otherwise it is dropped and the AI's reply, which may claim it, is not shown.",
      "**A question back instead of an answer** is answered and nothing is recorded; the same question comes back with its answer buttons. “Why do you need that?” gets the reason; “what would you suggest?” or “you decide” gets a suggestion that can be accepted in one tap; pushback on the route (“can't we just book directly?”) gets the route's reason and the options. With AI, other questions (“are they any good?”) are answered by call A.",
      "**Side remarks and other purchases** (“btw our CFO loves jazz”, “also we need 10 laptops”) are kept out of the answer, and the chat says so; a budget change mentioned in passing is applied and shown as “Changed: …”.",
      "**“Use the example”** takes the example the question showed; a message that repeats an earlier question's wording corrects that question.",
      "**Requests to change the documents** go to call D once a description exists.",
      "**Reading the answer:** with AI, call A. Its facts are screened before they are merged: placeholders (“unknown”, “none”) count only for the question just asked; classification flags (critical function, done in-house, ongoing) only at the check step; free text only when at least half of its words were said by the requester or are in the suggestion they accepted; on the first message a clear keyword category wins over the AI's. Its corrections are applied. The rules then read the same answer as a backup (closed questions, dates, amounts, places) and fill only what is still unknown. Without AI, only the rules read it.",
      "**Suggestions:** “Use this suggestion” or “yes, but add …” stores the suggested lines; “skip” records “Not given”. An AI suggestion keeps a figure only when the requester gave it, with the same unit, or the app's own standard draft has it; otherwise the point goes. What the requester already said for a line comes first, and an empty line takes their words, else the draft's line. The AI's service description is checked the same way, sentence by sentence.",
      "**The check step and follow-up checks** are resolved: a date fixed or flexible, a thin answer extended, a data location added, an off-topic answer recorded as not given.",
      "**After two tries** a question is given up: a value becomes an estimate, a yes/no becomes “not sure”, the category keeps the first candidate, anything else “Not given”.",
      "**Recompute:** relative dates become dates (“next week” → “19 Oct 2026 (next week)”); facts are worked out (technology, users, entity, could the bank do it itself, offshoring, Level 4); then the route, the questions needed, the stages and what is still missing.",
      `**Category first:** after the first message the requester chooses the Level 4 from 2–3 candidates, before any other question and on every route. The card shows each with its Level 1 › 2 › 3 path, match and reason; every candidate at ${T.l4Match}% or more is offered (up to 3), at least 2 (the next best as a weaker match, or the area's “(other)” entry or its nearest neighbour), and the top 3 when none reaches ${T.l4Match}%. The question is always in the app's words. A button, “the second one”, a code or a name picks; “None of these” asks for a few words and suggests again without the rejected entries; ✎ in the summary also answers it; two answers that are no choice keep the first. Follow-up checks on the first message wait until the choice, and the route news comes with the question after it.`,
      "**Answer checks** (section 9) may ask one follow-up instead of the next question.",
      "**Next:** the next missing item is asked. The AI's wording is used only when it asks one of the next two items in the same stage; a new stage shows a recap card and a step marker. When nothing is missing: documents (call C) → route card → quality check, and below the threshold an improvement round."]));

  B.push(h(2,"5. Routes and reviews"),
    p("The rules check in this order; the first that fits wins:"),
    ol([`**Catalogue order**: a catalogue item of the request's category is named (whole word) and the value fits its price: at most twice price × quantity, or without a quantity at most ${eur(T.quickQuoteMax)}. Or a punch-out shop (a supplier's shop for a whole Level 4): its words are named, or the request's Level 4 is the shop's and the value is known; the value must stay within the shop's maximum order. A shop order asks only the value, the date and the delivery place.`,
      "**Contract call-off**: an active framework contract covers the request's Level 4, unless the requester declines it or the category is only a guess.",
      `**Low-value purchase**: value up to ${eur(T.lowValueMax)}, no catalogue entry or framework, not software or external workers, no technology service, no access to our data or systems, and not an ongoing service over 12 months. One quote or a corporate card; no splitting. It asks only what, how many (goods), the value, what it is for (unless the request says), when, where, the supplier and, for services, data access; a yes on data moves it to the standard path.`,
      `**New demand: business-led sourcing**: value up to ${eur(T.quickQuoteMax)}; the business collects three quotes.`,
      "**New demand: procurement-led sourcing**: everything else, including an unknown value; procurement runs an RFP."]),
    table(["Route","Typical working days","A start date counts as tight under"], Object.entries(CHANNELS).map(([k,c])=>[c.name, c.days, `${LEAD_DAYS[k]} days`])),
    table(["Category with a framework contract","Contract","Supplier","Level 4 entries covered","Ends"], frameworks.map(c=>[c.themes.map(x=>catById(x).name).join(", "), c.title, c.supplier, String(c.l4.length), fmtDate(c.expires)])),
    p(`**Reviews added to the result:** data protection review (personal or client data); ICT review under DORA (a technology service, for new demand or external workers); outsourcing assessment (outsourcing likely or to be determined); critical or important function check; access review (money or privileged access); offshoring check; subcontractor check; site access; material spend review (value from ${eur(T.materialityMin)}); non-preferred supplier; single-source justification (a named supplier with a reason, unless it is to be included in a competition); risk questionnaire.`),
    p("**Bank checks by category** (review flags, never extra questions): auditor independence (consulting, audit and tax); instructed through Legal, after a conflict check (legal); gifts and hospitality approval (client events, a warning when public officials may attend); data licence (market data); record keeping (trading voice and call recording); data transfer (client data may be stored outside the EU for an EU entity)."));

  const catNames=fn=>CATEGORIES.filter(fn).map(c=>c.name).join(", "), lineNames=b=>b.map(([L])=>L).join(" / ");
  B.push(h(2,"6. What is asked, and when"),
    p("Questions come in stages; only stages with open questions for the route appear. The order within a stage is fixed, and anything already said is never asked again."),
    table(["Step","Stage","What the chat says"], STAGES.map((st,i)=>[String(i+1), st.name, st.intro||""])),
    h(3,"Kinds of work"),
    p("The stages and the facts are the same for every request. The wording, the suggested lines and a few questions follow the kind of work (`kindOf`). A project with set deliverables is one-off whatever its length; words such as “ongoing”, “managed service”, “run our…”, “service desk” or “maintain” make it an ongoing service."),
    table(["Kind","Categories","Who it is for (lines)","Benefits (lines)","Success (lines)","Also"], [
      ["Product", catNames(c=>c.type==="software"), lineNames(BUNDLES.audience_fn), lineNames(BUNDLES.value_props), lineNames(BUNDLES.kpis_pack), "Users and how many; must-haves. Market data asks how the data is used: on screens, in applications or models, or passed on to clients."],
      ["Project", catNames(c=>PROJECT_CATS.includes(c.id))+"; any other service with no ongoing service described that runs under 6 months", lineNames(KIND_BUNDLES.project.audience_fn)+" (events: "+lineNames(AUD_LINES.marketing)+"; training: "+lineNames(AUD_LINES.training)+")", lineNames(KIND_BUNDLES.project.value_props), lineNames(KIND_BUNDLES.project.kpis_pack), "Why an external provider; project steering when it runs 6 months or more. No support desk, service levels or selling points; no staff qualifications for events."],
      ["Ongoing service", catNames(c=>c.type==="services"&&!PROJECT_CATS.includes(c.id))+" (cloud, telecom and facilities always; the others when described as ongoing or running 6 months or more)", lineNames(BUNDLES.audience_fn), lineNames(KIND_BUNDLES.service.value_props), lineNames(BUNDLES.kpis_pack), "Who does the work today; volumes; service governance; support model for technology."],
      ["External workers, goods", catNames(c=>["contingent_labour","goods"].includes(c.type)), "–", "–", "–", "Role profile, or item and quantity."]]),
    h(3,"Questions for each welcome example"),
    table(["Example","First message","Route","Details the route needs, in order (✓ already given or worked out from the first message, so not asked)"], flows),
    h(3,`The new-demand example in detail: “${main}”`),
    p(`Route: **${ex.route}**. Items marked as suggestion get a tailored proposal (call B, or the rules' draft) that can be accepted in one tap; bundles fill several lines at once.`),
    table(["Item","Question","Example given","Suggestion","Quick answers","From the first message"], ex.rows),
    p("**The check step (new demand):** a numbered list of what the rules worked out (working title, Level 4, entity, ongoing or one-off, could the bank do it itself, technology, critical function, access, offshoring) and what it means (outsourcing result, reviews needed). “Yes” confirms. Corrections in words or “point 9 is wrong” change it. A reply that changes nothing is asked again."));

  B.push(h(2,"7. The prompts"),
    h(3,"A. Chat turn"),
    ul(["**The app checks the reply:** sentences naming internal fields or values are removed; a reply without a question is dropped; the AI's question is used only for the next item. A suggestion inside the reply must have every line as “Label: text”, otherwise call B writes it.",
      "**The app screens the facts:** only what the requester said or accepted is kept (see section 4, reading the answer). A reply marked “answers_question: false” with no correction is a question back: it is shown, nothing is recorded, and the same question is asked again.",
      "**The rules keep control:** the route, the check-step text and the order of questions always come from the rules.",
      "**Guards on facts:** a place the AI takes from an answer about users or data is not used as the work location; an off-topic verdict only counts for the question just asked; a storage place counts only when the requester said it."]),
    prompt(`A. Chat turn: system prompt (example: “${main}”)`, ex.chatSys),
    prompt("A. Chat turn: message sent with the first answer", ex.chatMsg),
    h(3,"B. Suggestion"),
    ul(["**Cleaned:** no internal keys, no dates, at most 4 points per line.",
      "**Checked:** for bundles every line label must be there, otherwise the rules' draft is used. Accepted lines are stored by the app, never by the AI."]),
    ...(ex.sugKey?[prompt(`B. Suggestion: system prompt (for “${specLabel(ex.sugKey)}”)`, ex.sugSys), prompt("B. Suggestion: message sent", ex.sugMsg)]:[]),
    h(3,"C. Documents"),
    ul(["**Scrubbed:** the description loses amounts, dates, places, supplier names, the route and risk answers, and must meet its word limits.",
      "**Merged with the rules:** the requirements keep the rules' risk lines; the Level 4 confirmed at the check step stays (the AI's pick only adds a note); up to 2 AI remarks join the quality check."]),
    prompt("C. Documents: system prompt for new demand", ex.docSys),
    prompt("C. Documents: message sent (example, right after the first message)", ex.docMsg),
    prompt(`C. Documents: system prompt for other routes (example route: ${exCat.route})`, exCat.docSys),
    h(3,"D. Document change"),
    prompt("D. Document change: message sent (with the documents prompt above)", refineUser({description:{name:"(current service description)"},brd:"(current requirements)"}, "Make the summary shorter")));

  B.push(h(2,"8. Classification"),
    ul(["**Category:** keywords as whole words (plurals count; `*` marks a stem such as `consult*`). The category with most keywords wins; on a tie the one named last before “for”, “to”, “with”, “that” or a comma. A goods word after “to”, “trading”, “service”, “help” … does not count. With no keyword, the category of the best-scoring Level 4 when it is clear (one of its search terms in the request, or two or more shared words well ahead of the next entry; one shared word such as “roll” for a roll-up banner is not enough), else management consulting as a guess, never a framework call-off. With AI, the AI's category is used, and a Level 4 guess without a search term never overrules it.",
      "**Level 4:** the requester chooses it from 2–3 candidates (section 4, “Category first”): the entry the app works with (marked Suggested), the AI's alternatives and the closest entries across the whole list, so a wrong category can be put right. A rules alternative's match is damped by the square root of its score over the best score, so a far weaker entry never shows as a strong match. For the working entry, every entry's words are weighted by where they appear (search terms and name 3, Level 3 group 2, Level 2 group and description 1) and by how rare they are across the list; a description's “not X: see Y” part never counts. The rules pick within the category; with no clear signal, the category's “(other)” entry. The subject of the request counts double, what follows “including” a quarter; when a category keyword points elsewhere, the closest entry across the whole list wins if it scores clearly higher; a confident Level 4 stays put so the route does not change halfway. With AI, the first message (and the check step) gets about 20 candidates: the closest entries across the whole list plus the rules' picks; the AI also names up to 2 alternatives (l4_alt) and the item in a category list's words (“ERP implementation” for an S/4HANA rollout) and the app looks those up across the whole list: when none of the candidates fits, or when its pick shares no word with its own words and no search term with the request, that entry is used. The AI's pick sets the category too, unless a category is named at the start of the request. The value confirmed at the check step is final; it can be changed in the summary by searching the list.",
      "**ICT service (DORA):** whether technology is involved comes from the rules or the answer; for software the type follows Level 4 (SaaS or licensing), otherwise keywords.",
      `**Outsourcing, group standard ${R.current.id}** (the legal entity does not change the result): 1. excluded under paragraph 28 (goods, statutory audit, card schemes, clearing, SWIFT, correspondent banking, legal, facilities, market data, telecom, training, marketing, external workers) → not outsourcing; 2. not performed on a recurrent or ongoing basis (paragraph 26) → not outsourcing (likely); a project with set deliverables is one-off whatever its length (see Kinds of work); for software, who hosts and runs it decides (asked only when the request doesn't say): we install and run it → not outsourcing (likely), still an ICT service under DORA; the provider hosts and runs it (SaaS) → it is software the bank would otherwise run itself, whatever the business area; 3. work the bank does or could realistically do itself (paragraph 26) → outsourcing (likely); otherwise not outsourcing (likely), or to be determined when unclear. A critical or important function (paragraphs 29–31) is a flag for review, never a decision.`,
      `**Future rule set ${R.future.id}** (${R.future.status}): EBA/GL/2019/02 applies until it does; the app works out the result under it but does not show it.`,
      "**Critical or important function:** from the answer on impact (clients, payments, regulatory, trading, outage, audit) or a known bank domain (KYC, payments, payroll, contact centre, regulatory reporting, service desk); never for events, training, office or hardware.",
      "**Offshoring:** the provider works from a country other than the entity's. An explicit “no” wins; where users or data are does not count."]));

  B.push(h(2,"9. Quality"),
    h(3,"Checks on each answer"),
    ul(["**Off-topic:** nothing to do with the request; asked again once, then recorded as “Not given”.",
      "**Too vague:** “tbd”, “stuff”, one or two words for a free-text item.",
      "**Data without a storage place:** asked once (always).",
      "**Implausible amounts:** a day-rate mismatch over 50%, project work under €5,000, months of work under €3,000, over €20 million.",
      "**Contradictions:** “no personal data” or “no technology” against the request; “no impact” despite audit or regulatory context.",
      "**Dates:** in the past, or tighter than the route usually takes."]),
    p(`At most one follow-up per item and three per conversation (off-topic and data location are always asked). With AI, the AI's own judgement adds checks after the rules. A hidden 1–10 rating of each answer gives one tip for a thin new-demand answer when it is ${T.answerTip} or lower (at most three tips; 0 switches tips off).`),
    h(3,"The overall score"),
    p(`Score = 100 − ${QUALITY.warn} × warnings − ${QUALITY.info} × notes − ${QUALITY.incomplete} × (100 − % of needed details given) − a section penalty (at most ${QUALITY.sectionCap}: ${QUALITY.partialSection} per partial section the route asks for, ${QUALITY.riskSection} per risk), never below ${QUALITY.floor}.`),
    table(["Score","Rating"], QUALITY.bands.map(([min,name],i)=>[`${Math.max(min,QUALITY.floor)}–${i?QUALITY.bands[i-1][0]-1:100}`, name])),
    ul(["**Warnings:** an answer confirmed despite a check, no usable answer, a needed detail still open, data without a storage place, budget not approved for an RFP.",
      "**Notes:** a flexible start date, an estimated budget, a tight timeline, up to 2 remarks from the AI."]),
    p(`**Improvement round:** for new demand scoring below ${T.qualityMin}, the chat offers to go through up to 8 points that would lift it; “Submit anyway” stays possible and is recorded as submitted below the threshold.`),
    p("**Still to clarify** is one list: gaps in what the route asked, risks and open points, each once. A point the route did not ask joins it only when it would improve the description itself (who it is for, capabilities, benefits, success measures, or abbreviations to write in full), with an “Answer one more question” button where the chat has a question. Points for the contract (governance, change management, escalation) are left to the buyer."));

  B.push(h(2,"10. What comes out"),
    ul([`**Service description:** for new demand a headline (${ex.limits.headMin}–${ex.limits.head} words for an RFP, ${exQuote.limits.headMin}–${exQuote.limits.head} for three quotes), an executive description (${ex.limits.execMin}–${ex.limits.exec} words; ${exQuote.limits.execMin}–${exQuote.limits.exec}) and a summary table (${EXEC_ROWS.map(r=>r[1]).join(", ")}). Other routes get a short description. It never contains amounts, dates, places, suppliers, the route or risk answers.`,
      "**Captured for procurement:** the record table with the route, Level 4, budget, how many (items, users of software, or people; a service has none), timing, supplier, entity, data access, outsourcing, ICT, critical function. Reviews such as the material spend review (value of €1,000,000 or more) are listed on the route card, not repeated here.",
      "**Purchase request** (catalogue order, low-value purchase): a short summary and the record, built from the answers without an AI call.",
      `**Switched off for now, to save tokens:** the detailed service description (${DETAIL_SECTIONS.length} sections), the business requirements document and the sourcing request text. They are still built from the answers and sent with the request (JSON), but not shown, and the AI does not write them.`,
      `**JSON on submit:** ${ex.payloadKeys}.`]));

  B.push(h(2,"11. Settings and reference data"),
    table(["Setting (in the code, set by procurement)","Value","Effect"],[
      ["Low-value purchase up to", eur(T.lowValueMax), "Bought directly with one quote or a corporate card, with a short purchase request instead of a service description"],

  B.push(h(2,"2. How it is bought: the buying route"),
    p("The rules ask four questions in a fixed order, and the first “yes” decides the route. The requester never picks the route from a list: the route card states the reason in plain words."),
    tree([
      {q:"Is it in the catalogue, and does the value fit?", detail:`A catalogue item of this category is named, and the value is at most twice price × quantity (without a quantity, at most ${eur(T.quickQuoteMax)}). Or a supplier's shop covers this category (${shops.join(", ")} …) and the order stays within the shop's limit.`,
        yes:{title:CH.catalogue.name, sub:`${CH.catalogue.days} working days · purchase request`, items:["Ordered directly at the agreed prices.","A shop basket goes to the budget owner for approval; standard items go straight through."]}},
      {q:"Does an active framework contract cover it?", detail:`A framework that has not expired covers the chosen Level 4, or the named supplier's framework covers the category. External workers always go through the staffing framework. ${frameworks.length} frameworks are active today.`,
        yes:{kind:"choice", title:`The requester decides: “${q.contract_ok}”`, items:[`**Yes, use it** → **${CH.contract.name}**, ${CH.contract.days} working days, a short service description. The contract owner confirms the scope fits.`, "**No, look wider** → question 3."]}},
      {q:`Is it ${eur(T.lowValueMax)} or less, and simple?`, detail:"All of these must be true: not software, not external workers, no technology service, no access to our data or systems, and not an ongoing service over 12 months.",
        yes:{title:CH.lowvalue.name, sub:`${CH.lowvalue.days} working days · purchase request`, items:["One written quote or a published price, or the corporate card where the card policy allows.",`No splitting: one need must not be split into several orders to stay under ${eur(T.lowValueMax)}.`]}},
      {q:`Is it ${eur(T.quickQuoteMax)} or less?`, detail:"The value of the whole need over the full term: an annual or monthly amount counts for the whole term.",
        yes:{title:CH.quote.name, sub:`${CH.quote.days} working days · service description`, items:["The business collects at least three comparable quotes, with procurement's guidance.","Procurement checks the quotes and the supplier before the choice."]}, no:"No, or the value is not known yet"}],
      {label:"Then", title:CH.sourcing.name, sub:`${CH.sourcing.days} working days · service description`, items:["Procurement runs an RFP.","**Approval to source:** the budget owner confirms the need and the budget before the RFP starts.","A buyer gets in touch within 2 working days; risk, ICT and supplier checks run alongside the RFP."]}),
    h(3,"What can move a request to another route"),
    ul(["**A different value** (“it's 80k, not 30k”): the tree runs again and the chat names the new route.",
      `**A yes on technology, data or system access** takes a request off the ${lv} route.`,
      "**“No, look wider”** on an existing contract makes it new demand.",
      "**An unknown value** counts as procurement-led until a figure is given.",
      "**A different category**, at the check step or in the summary, can bring a framework or the catalogue into play.",
      "**More options on the route card:** the requester may choose another route, with a justification. A faster route than the standard one adds an exception approval and a procurement review (about 7 to 12 extra working days); a stricter one is allowed but slower."]));

  B.push(h(2,"3. What is asked"),
    p("Only the questions the route needs, one at a time, each with an example. Anything the first message already says is not asked again. The table shows what the welcome examples are asked after their first message."),
    table(["Route","Example","Asked after the first message, in order","Questions"], perRoute),
    p(`**New demand asks in stages:** ${stages.join(" → ")}. An RFP asks the most; three quotes is lighter, with the profile points offered as one suggestion to accept in one tap.`),
    p("**Never asked** unless the requester raises it: cost centre, payment model, subcontractors, certifications, evaluation weights, service levels for one-off work, and who owns the work. Procurement or the supplier provides these later."));

  B.push(h(2,"4. Which checks apply"),
    p("The rules work these out from the answers and show them back at the check step. They are **flags for the reviewers, never final determinations**."),
    h(3,"4a. ICT service under DORA (the EU rules for technology services to banks)"),
    tree([{q:"Is technology involved?", detail:`Always for ${catNames(c=>TECH_CATS.includes(c.id))}. Goods: only when bought as a service or leased. External workers: when the role or skills are technical. Otherwise it is read from the request, and when the rules can't tell, the chat asks: “${q.tech_service}”`,
      yes:{kind:"flag", title:"ICT service: flag for the ICT review (DORA)", items:["Ongoing: “likely an ICT service”; one-off: “possibly”, and the review confirms.","The type is proposed from the words: cloud software (SaaS), software licensing, cloud capacity, development, IT help desk, data feeds, network…","The ICT review is added for new demand and external workers.",`It also rules out the ${lv} route.`]}, no:"Otherwise"}],
      {label:"No", kind:"none", title:"No ICT flag", sub:"“Not sure” stays open, and the ICT review confirms."}),
    h(3,`4b. Outsourcing under the group standard ${R.current.id}`),
    p("Checked for new demand that is not goods. The legal entity is captured for the contract but does not change the result."),
    tree([
      {q:"Is it excluded under paragraph 28?", detail:"Goods; the statutory audit; card schemes, clearing and settlement, SWIFT and correspondent banking; legal advice; facility services; market data; telecom lines and utilities; training; events and marketing; travel and company cars; external workers under our direction.",
        yes:{kind:"none", title:"Not outsourcing"}},
      {q:"Software: does the bank install and run it itself?", detail:`Asked when the request doesn't say: “${q.hosting}”`,
        yes:{label:"Yes, we run it", kind:"none", title:"Not outsourcing (likely)", sub:"The provider licenses and supports it but does not perform a function for us. It is still an ICT service under DORA."}, no:"No: the provider hosts and runs it (SaaS), or it is not software"},
      {q:"Is it a one-off delivery? (paragraph 26)", detail:"A project with set deliverables is one-off, whatever its length. Ongoing: cloud, telecom, software, market data and facilities, and services described as ongoing (“managed service”, “run our…”, “maintain”) or running 6 months or more.",
        yes:{label:"Yes, one-off", kind:"none", title:"Not outsourcing (likely)"}, no:"No, it is ongoing"},
      {q:"Would or could the bank realistically do it itself? (paragraph 26)", detail:`Worked out from the words (“our team does this today”, “take over”, “managed service”; operations such as KYC or payments; software the provider runs for us). Otherwise the chat asks: “${q.in_house}” It counts even if the bank has never done it, as long as a bank realistically could.`,
        yes:{kind:"flag", title:"Outsourcing (likely)", sub:"Flag: outsourcing assessment"}, no:"Otherwise"}],
      [{label:"No", kind:"none", title:"Not outsourcing (likely)"}, {label:"Not clear", kind:"flag", title:"To be determined", sub:"Flag: outsourcing assessment"}]),
    p(`**The future rule set ${R.future.id}** (${lcFirst(R.future.status)}) is worked out in the background but not shown; ${R.current.id} applies until it does.`),
    h(3,"4c. Critical or important function (paragraphs 29 to 31)"),
    p(`A separate flag, never a decision. It is raised when the answer to “${q.background}” or “${q.impact_delay}” names clients, payments, regulators, trading, settlement, payroll, an outage or audit findings (and not “nothing serious”), or when the request is in an area that usually supports one: ${listJoin(DOMAINS.filter(d=>d.important).map(d=>lcFirst(d.name)))}. Never for events, training, office supplies or hardware. The requester confirms it at the check step.`),
    h(3,"4d. All review flags"),
    p("Each flag appears on the route card with its reason, so the buyer and the reviewers see why it was raised."),
    table(["Flag","Raised when","From the answer to","Routes"],[
      ["Data protection review","The provider will see personal, client or employee data",`“${q.personal_data}” (external workers: “${q.system_access}”)`,"Any"],
      ["Access review","Money or account access, or privileged or administrative access","The same answer","New demand"],
      ["Data transfer check","Data of the EU entity may be stored or processed outside the EU",`“${q.data_details}” and the entity`,"All but catalogue"],
      ["ICT review (DORA)","Technology is involved (4a)",`“${q.tech_service}”, or the category`,"New demand, external workers"],
      ["Outsourcing assessment","Outsourcing likely, or to be determined (4b)",`“${q.hosting}”, “${q.in_house}” and the duration`,"New demand"],
      ["Critical or important function check","See 4c",`“${q.impact_delay}”`,"New demand"],
      ["Offshoring check","The work is done outside the entity's country",`“${q.location}” and “${q.entity}”`,"Any"],
      ["Site access","Work on our premises",`“${q.location}”`,"Call-off, new demand"],
      ["Subcontractor check","The supplier may use subcontractors","Only when the requester says so","Any"],
      ["Material spend review",`A value of ${eur(T.materialityMin)} or more`,`“${q.value}”`,"Any"],
      ["Non-preferred supplier","A named supplier is not preferred for this category",`“${q.supplier}”`,"New demand"],
      ["Single-source justification","One named supplier with a reason, or “only them”, unless it is to join a competition",`“${q.supplier_reason}”`,"Procurement-led"],
      ["Auditor independence check","Management consulting or audit and tax: non-audit work for our statutory auditor needs Audit Committee approval first","The category","All but catalogue"],
      ["Instructed through Legal","Legal services: Legal engages the firm after a conflict check","The category","All but catalogue"],
      ["Gifts and hospitality approval","Client events and gifts; Compliance approves first when public officials may attend","The request and the category","Any"],
      ["Data licence check","Market data: the price and permitted use depend on who uses the data and how","The category","All but catalogue"],
      ["Record-keeping check","Trading voice and call recording must be complete and retrievable","The request","All but catalogue"],
      ["Risk questionnaire, pre-filled","Services, software and external workers beyond a small purchase","The answers so far","Call-off, new demand"]]));

  B.push(h(2,"5. What goes to procurement"),
    table(["Route","Document","What happens next"],[
      [CH.catalogue.name,"Purchase request: a short summary and the record","The basket is submitted; a shop basket goes to the budget owner"],
      [CH.lowvalue.name,"Purchase request","One quote, then a purchase order or the corporate card; receipt is confirmed so the invoice can be paid"],
      [CH.contract.name,"Short service description","A call-off against the framework; the contract owner confirms. External workers: the role profile goes to the framework supplier, who shortlists candidates"],
      [CH.quote.name,"Service description: a headline, an executive description and a summary table","The requester asks at least 3 suppliers for a quote; procurement checks the quotes and the supplier"],
      [CH.sourcing.name,"Service description, in the same form and longer","A sourcing project; a buyer gets in touch within 2 working days"]]),
    p("Every route also gets the **route card** (route, reason, reviews and next steps) and **Captured for procurement**, the record of every answer. The service description itself never contains amounts, dates, places, suppliers, the route or risk answers."),
    h(3,"Before submitting (new demand)"),
    ul([`**The check step:** “${q.confirm_derived}” The requester sees, in plain words, what the rules worked out (Level 4, entity, ongoing or one-off, could the bank do it itself, technology, critical function, access, offshoring) and what it means (the outsourcing result and the reviews). “Yes” confirms it; a correction in words changes it and runs the tree again.`,
      `**The quality gate:** a score out of 100 for completeness and consistency. Below ${T.qualityMin}, the chat offers to go through up to 8 points that would lift it. “Submit anyway” stays possible and is recorded as submitted below the threshold.`]));

  B.push(h(2,"6. Question → decision index"),
    p("Every question that changes a decision, in the chat's own words."),
    table(["Question","Answers that matter","Decisions it changes"],[
      ["The first message: “Describe what you need…”","What, how much, how long, where, which supplier","The category candidates; the catalogue and framework match; technology; the entity; who runs software. Anything it answers is not asked again"],
      [`“${q.l4_pick}”`,"One of 2–3 candidates, or “None of these”","Category and type; frameworks, catalogue and preferred suppliers; the kind of work; the outsourcing exclusions"],
      [`“${q.value}”`,`${eur(T.lowValueMax)} or less · ${eur(T.quickQuoteMax)} or less · more, or not known · ${eur(T.materialityMin)} or more`,"The route (questions 1, 3 and 4); the material spend review"],
      [`“${q.item}” / “${q.quantity}”`,"A catalogue item, and how many","Whether the catalogue price explains the value (question 1)"],
      [`“${q.contract_ok}”`,"Yes, use it · No, look wider","Contract call-off, or new demand"],
      [`“${q.duration}”`,"Under 3 months · 3–6 months · 6–12 months · over a year",`Ongoing or one-off (outsourcing); an ongoing service over 12 months is not a ${lv}; project steering from 6 months`],
      [`“${q.tech_service}”`,"Yes · No · Not sure",`The ICT review (DORA); rules out the ${lv} route`],
      [`“${q.personal_data}”`,"No access · which data, systems or money, with what access",`Data protection review; access review; rules out the ${lv} route`],
      [`“${q.data_details}”`,"Where the data is stored","Data transfer check"],
      [`“${q.system_access}” (external workers)`,"Yes · No · Not sure","Data protection review"],
      [`“${q.hosting}”`,"The provider · we install and run it · not sure","Cloud software (SaaS) or licensing; outsourcing question 2"],
      [`“${q.in_house}”`,"Yes, today · we could · no · not sure","Outsourcing likely, not likely, or to be determined"],
      [`“${q.background}” / “${q.impact_delay}”`,"Clients, payments, regulators, trading, an outage, audit findings · nothing serious","Critical or important function check"],
      [`“${q.entity}”`,"The entity that signs","The home country for the offshoring and data transfer checks; the contract"],
      [`“${q.location}”`,"Remote · on our premises · at the provider's site · offshore","Offshoring check; site access"],
      [`“${q.supplier}”`,"No preference · one named · several","A named supplier's framework; non-preferred supplier"],
      [`“${q.supplier_reason}”`,"A reason, or “only them”","Single-source justification"],
      [`“${q.budget_approved}”`,"Yes · Not yet · Partly","A warning in the quality check while it is not approved"],
      [`“${q.confirm_derived}”`,"Yes · a correction","Confirms or changes everything the rules worked out; the tree runs again"]]));

  B.push(h(2,"7. Worked examples"),
    p("The welcome examples, and one low-value purchase, run through the same rules after their first message. Later answers can add or remove flags."),
    table(["Request","Route","Why, as the route card says","Flags and controls so far"], examples));
  return B;
}

// a reference panel (How it works, Decision tree): built on click, read-only, printable, downloadable; Escape or Close returns to the chat
const saveFile = (text, type, name) => { const l=document.createElement("a"); l.href=URL.createObjectURL(new Blob([text],{type})); l.download=name; l.click(); };
function openPanel({title, model, md, file, svg}){
  const trigger=document.activeElement;
  $("#docRoot").innerHTML=`<div class="docwrap" role="dialog" aria-modal="true" aria-labelledby="specTitle"><div class="doctools">
      <b id="specTitle">${esc(title)}</b><span class="sp"></span>
      ${svg?`<button class="btn btn-g hide-sm" data-spec="svg">Download picture (.svg)</button>`:""}<button class="btn btn-g" data-spec="md">Download (.md)</button><button class="btn btn-g hide-sm" data-spec="print">Print</button><button class="btn btn-p" data-spec="close">Close</button></div>
    <div class="paper spec" id="specPaper" tabindex="-1"><div class="brd">${specHtml(model())}</div></div></div>`;
  document.body.classList.add("doc-open");
  document.querySelectorAll(".top,.app").forEach(x=>x.inert=true);
  S.specBack=trigger;
  // a picture fits the page; a click or Enter shows it full size (scrolling sideways inside its frame), and back
  document.querySelectorAll("#specPaper .dt-frame").forEach(fr=>{ const z=()=>fr.classList.toggle("zoom");
    fr.tabIndex=0; fr.setAttribute("role","button"); fr.setAttribute("aria-label","Decision tree picture: press to switch between fitted and full size");
    fr.onclick=z; fr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); z(); } }; });
  document.querySelectorAll("[data-spec]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.spec;
    if(a==="close") closeDoc();
    if(a==="md") saveFile(specMd(md()), "text/markdown", `${file}.md`);
    if(a==="svg") saveFile(`<?xml version="1.0" encoding="UTF-8"?>\n${svg()}`, "image/svg+xml", `${file}.svg`);
    if(a==="print"){ const shut=[...document.querySelectorAll("#specPaper details:not([open])")]; shut.forEach(d=>d.open=true);
      window.addEventListener("afterprint",()=>shut.forEach(d=>d.open=false),{once:true}); window.print(); }
  });
  $('[data-spec="close"]').focus();
}
const openSpec = () => openPanel({title:"How it works", model:()=>specModel(true), md:()=>specModel(false), file:"guided-intake-how-it-works"});
const openTree = () => openPanel({title:"Decision tree", model:treeModel, md:treeModel, file:"guided-intake-decision-tree", svg:()=>treeFigure().svg});
// closes the document or How-it-works overlay and gives the page back
function closeDoc(){
  $("#docRoot").innerHTML=""; document.body.classList.remove("doc-open");
  document.querySelectorAll(".top,.app").forEach(x=>x.inert=false);
  const back=S.specBack; S.specBack=null; if(back&&back.focus) back.focus();
}

/* =========================================================
   11. WIRING
   ========================================================= */
function reset(){ typeFlush(); Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,fresh()); render(); $("#inp").focus(); }
const inp=$("#inp");
inp.addEventListener("input",()=>{typeFlush();inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#comp").requestSubmit();}});
$("#comp").onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value="";inp.style.height="auto";handleUser(t);};
$("#doccss").textContent=DOC_CSS;
$("#howBtn").onclick=openSpec; $("#treeBtn").onclick=openTree;
// Escape closes How it works and the Decision tree
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#specPaper")) closeDoc(); });
$("#newBtn").onclick=reset; $("#sumBtn").onclick=()=>$("#side").classList.toggle("open");
// phone: the summary panel closes with its Close button, Escape or a tap outside it
document.addEventListener("click", e=>{ const side=$("#side"); if(!side.classList.contains("open")) return;
  if(e.target.closest('[data-act="closeside"]') || (!e.target.closest("#side") && !e.target.closest("#sumBtn"))) side.classList.remove("open"); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#side").classList.contains("open") && !$("#specPaper")) $("#side").classList.remove("open"); });
// access gate: the page stays locked until the server confirms the code
async function verifyCode(c){
  try{ const r=await fetch("/api/llm?verify=1",{headers:{"x-access-code":c}}); return r.ok; }catch(e){ return null; }
}
async function accessGate(){
  let saved=CONFIG.accessCode; if(!saved){ try{saved=sessionStorage.getItem("ac")||"";}catch(e){} }
  if(saved && await verifyCode(saved)===true){ CONFIG.accessCode=saved; $("#gate").hidden=true; return; }
  try{sessionStorage.removeItem("ac");}catch(e){}
  const g=$("#gate"), inpC=$("#gateCode"), btn=$("#gateBtn"), err=$("#gateErr");
  $("#gateForm").hidden=false; inpC.focus();
  await new Promise(done=>{
    $("#gateForm").onsubmit=async e=>{ e.preventDefault(); const c=inpC.value.trim(); if(!c){ err.textContent="Please enter the code."; return; }
      btn.disabled=true; err.textContent=""; const ok=await verifyCode(c); btn.disabled=false;
      if(ok===true){ CONFIG.accessCode=c; try{sessionStorage.setItem("ac",c);}catch(x){} g.hidden=true; done(); }
      else { err.textContent= ok===null ? "Can't reach the server. Please try again." : "That code isn't right."; inpC.value=""; inpC.focus(); } };
  });
}
// the server refused the code (changed or expired): ask for it again
function reopenGate(){
  if(!$("#gate").hidden) return;
  CONFIG.accessCode=""; try{sessionStorage.removeItem("ac");}catch(e){}
  $("#gateCode").value=""; $("#gateErr").textContent="The access code has changed or expired. Please enter it again."; $("#gate").hidden=false; accessGate();
}
(async()=>{
  render(); await detectServer(); resolveProvider();
  if(SERVER && SERVER.accessRequired) await accessGate(); else $("#gate").hidden=true;
  render(); $("#inp").focus();
})();
</script>
