<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Intake Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Guided Intake Chat (prototype)
   - Rules decide the buying route AND what must be known for that route.
   - The AI only talks: it phrases one question at a time and reads the answers.
   ========================================================= */
#gate{position:fixed;inset:0;z-index:1000;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden],#gate form[hidden]{display:none}
#gate form{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#gate h2{margin:0 0 6px;font-size:20px;color:var(--ink)} #gate p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
#gate input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px}
#gate button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#gate button:disabled{opacity:.6} #gate .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
:root{
  --navy:#0f2147; --navy-2:#1b3266; --navy-3:#2c4a8a;
  --amber:#f2a900; --amber-soft:#fff4d6; --amber-ink:#8a5d00;
  --bg:#f5f6fa; --card:#fff; --line:#e4e7ef; --line-2:#eef0f5;
  --ink:#141b2d; --ink-2:#4a5470; --ink-3:#7c859e;
  --ok:#11845b; --ok-soft:#e5f5ee; --warn:#b4570b; --warn-soft:#fdf0e3;
  --bad:#b42318; --bad-soft:#fdecea; --info:#2c4a8a; --info-soft:#eaf0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;flex:none}
.top-in{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#ffcf5c);display:grid;place-items:center;color:var(--navy);font-weight:800;flex:none}
.brand b{display:block;font-family:"Inter Tight";font-size:16px}
.brand span{font-size:12px;color:#aab6d3}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#dfe6f7;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7c859e}
.dot.on{background:#3ad29f;box-shadow:0 0 0 3px rgba(58,210,159,.2)}
.tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.tb:hover{background:rgba(255,255,255,.18)}
.only-m{display:none}
@media(max-width:900px){.only-m{display:inline-flex}.brand span:not(.links),.pill{display:none}}
.howlink{background:none;border:0;padding:0;margin-left:8px;font:inherit;font-size:12px;color:#ffd36b;text-decoration:underline;cursor:pointer;white-space:nowrap}
.howlink:hover,.howlink:focus-visible{color:#fff}
@media(max-width:900px){.brand{min-width:0}.brand .links{display:flex;flex-wrap:wrap;column-gap:12px;margin-top:2px}.howlink{margin:0}}   /* the two links wrap onto two lines only on the narrowest phones */
@media(max-width:600px){.top-in{gap:8px;padding:10px 12px}.brand b{white-space:nowrap;font-size:15px}.tb{padding:7px 10px}}
.spec details{border:1px solid var(--line);border-radius:8px;background:#fafbfd;margin:8px 0}
.spec summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--navy-3)}
.spec pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;margin:0;border-top:1px solid var(--line)}
.spec .tw{overflow-x:auto}.spec td{overflow-wrap:anywhere}.spec code{font:12px ui-monospace,Menlo,monospace;background:#f1f3f8;padding:1px 4px;border-radius:4px}

/* layout */
.app{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:900px){.chat{border-radius:0;border:0}}
.msgs{flex:1;overflow-y:auto;padding:26px 24px 12px}
@media(max-width:600px){.msgs{padding:16px 12px 8px}}

/* welcome */
.welcome{max-width:780px;margin:6px auto 4px}
.welcome h1{font-size:21px}
.welcome p{color:var(--ink-2);margin:4px 0 8px;font-size:13.5px}
.tries{border-top:1px solid var(--line-2)}
.tryh{margin:12px 0 3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)} .tryh:first-of-type{margin-top:4px}
.tries button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;padding:5px 4px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:13.5px;line-height:1.4}
.tries button:hover{color:var(--navy);background:#fafbfd}
.tries small{flex:none;width:118px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
@media(max-width:600px){.welcome h1{font-size:19px}.tries button{font-size:13px;padding:5px 2px}.tries small{width:78px;font-size:10px}}

/* messages */
.m{display:flex;gap:10px;margin:0 0 16px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.bub{max-width:min(600px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.classcard{max-width:min(600px,85%);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;font-size:13.5px}
.classcard .ch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}.classcard .cr{margin:4px 0}
.classcard .cc{color:var(--ink-3);font-size:12px}.classcard .cm{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:var(--line-2);font-size:12px;font-weight:600}
.classcard .cx{color:var(--ink-2);font-size:12.5px;margin-top:2px}.classcard .cf{color:var(--ink-3);font-size:12px;margin-top:6px}
.classcard .cl{margin:4px 0 0;padding-left:20px}.classcard .cl li{margin:8px 0}.classcard .cp{color:var(--ink-3);font-size:11.5px;overflow-wrap:anywhere}
.classcard .cm.weak{background:transparent;border:1px dashed var(--line);font-weight:500}.classcard .cs{display:inline-block;margin-left:4px;padding:0 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber-ink);font-size:11.5px;font-weight:600}
.classcard .cy{color:var(--ok);font-size:12px;font-weight:600;margin-left:4px}.classcard .cr.picked b{color:var(--ok)}
.classcard .cb{margin-top:5px;padding:3px 12px;border:1px solid var(--navy-3);border-radius:99px;background:#fff;color:var(--navy);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}.classcard .cb:hover{background:var(--navy);color:#fff}
@media (max-width:600px){.classcard{max-width:100%}.classcard .cx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}
.ucol{display:flex;flex-direction:column;align-items:flex-end;max-width:min(600px,85%)}.ucol .bub{max-width:100%}
.m.a .bub{background:#f3f5fa;border-bottom-left-radius:5px}
.m.a .bub b{color:var(--navy)}
.m .wide{flex:1;min-width:0;max-width:680px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sys{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-4px 0 14px}

/* answer shortcuts: small, quiet, only for closed questions */
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.qr button{border:1px solid var(--line);color:var(--ink-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.qr button:hover{border-color:var(--navy-3);color:var(--navy)}

/* composer */
.comp{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;max-height:160px;min-height:48px;outline:none;line-height:1.45}
.comp textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(44,74,138,.12)}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;cursor:not-allowed}

/* recommendation + description cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#2c4a8a 0%,var(--navy) 60%);color:#fff}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink)}
.rec-h .eyebrow{color:#ffd36b}
.rec-h h2{font-size:23px;margin:3px 0 2px}
.rec-h .meta{font-size:13px;color:#c9d3ea}
.sec{padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.chk{display:flex;gap:8px;padding:3px 0}
.chk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--info-soft);color:var(--info)}
.chk i.w{background:var(--warn-soft);color:var(--warn)} .chk i.b{background:var(--bad-soft);color:var(--bad)}
.chk span{color:var(--ink-3);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);background:#fafbfd}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--amber);color:var(--navy)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.lnk{background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.more{padding:12px 20px;border-top:1px solid var(--line-2);font-size:13.5px;background:#fafbfd}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.ovr{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:#6b3a06;margin-top:8px}
.old{opacity:.6;font-size:13px;padding:10px 14px}
.sec.lead{background:#fbfaf5;border-left:3px solid var(--amber);font-size:14.5px;line-height:1.6}
.stepbar{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;overflow-x:auto;scrollbar-width:none}
.stepbar:empty{display:none}
.stepbar .st{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;font-size:13px;color:var(--ink-3);white-space:nowrap;flex:none}
.stepbar .st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff}
.stepbar .st.done{color:var(--ink-2)} .stepbar .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.stepbar .st.cur{background:#fff;color:var(--navy);font-weight:600;box-shadow:var(--shadow)} .stepbar .st.cur i{background:var(--navy);border-color:var(--navy);color:#fff}
.stepbar .st small{font-weight:400;color:var(--ink-3);font-size:11.5px}
.stepbar .sep{flex:none;width:14px;height:1.5px;background:var(--line);align-self:center}
.stepbar.compact{overflow:hidden}
.stepbar.compact .sep{flex:1 1 auto;width:auto;min-width:6px}
.stepbar.compact .st:not(.cur){padding:6px 0}
.stepbar.compact .st.cur{flex:0 1 auto;min-width:0}
.stepbar.compact .st.cur .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:600px){.stepbar.compact{gap:2px;padding:10px 10px}.stepbar.compact .st i{width:20px;height:20px;font-size:10.5px}.stepbar.compact .sep{min-width:3px}.stepbar.compact .st.cur{padding:5px 8px;gap:5px}.stepbar.compact .st.cur small{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stagemark{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--ink-3);font-size:12px}
.stagemark:before,.stagemark:after{content:"";flex:1;height:1px;background:var(--line)}
.stagemark b{color:var(--navy);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stagemark span{display:block;text-align:center;line-height:1.4}
.recap{border:1px solid var(--line);border-radius:14px;background:#fff;max-width:min(560px,85%);overflow:hidden;box-shadow:var(--shadow)}
.recap .rh{padding:10px 14px;background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:13px}
.recap .rb{padding:8px 14px 10px}
.recap .rr{display:flex;gap:10px;font-size:13.5px;padding:3px 0}
.recap .rr span:first-child{color:var(--ink-3);width:120px;flex:none}
.recap .rf{font-size:12.5px;color:var(--ink-3);padding:0 14px 10px}
.recap.mini{box-shadow:none;background:#f8faf9;border-color:#e3efe9}
.recap.mini .rh{background:transparent;font-weight:500;padding:7px 12px}
.m.a .bub.qchk{background:var(--amber-soft);border:1px solid #f3dfa6}
.m.a .bub.qchk:before{content:"Quick check · ";font-weight:600;color:var(--amber-ink)}
.sec.qual .qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.qbadge{font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:99px}
.q-strong,.q-good{background:var(--ok-soft);color:var(--ok)} .q-fair{background:var(--warn-soft);color:var(--warn)} .q-needs{background:var(--bad-soft);color:var(--bad)}
.qlist{list-style:none;margin:8px 0 0;padding:0}
.qlist li{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.qlist li:before{flex:none;width:18px;text-align:center;font-weight:700}
.qlist li.warn:before{content:"!";color:var(--warn)} .qlist li.opt:before{content:"+";color:var(--info)} .qlist li .lnk{margin-left:auto;flex:none;align-self:flex-start;color:var(--navy-3);font-weight:600;text-decoration:none} .qlist li.info:before{content:"i";color:var(--info)} .qlist li.ok:before{content:"✓";color:var(--ok)}
.side .grp{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 0;padding:7px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line-2);cursor:pointer;text-align:left}
.side .grp span{display:flex;align-items:center;gap:6px}
.side .grp span:before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none}
.side .grp.open span:before{transform:rotate(45deg)}
.side .grp:hover,.side .grp:focus-visible{color:var(--navy-3)}
.side .grp em,.side .grp i{font-style:normal;color:var(--ok);letter-spacing:0;text-transform:none;font-weight:500}
.side .grp i{color:var(--ink-3)}
.fact.long{flex-wrap:wrap}
.fact.long .k{flex:1;width:auto}
.fact.long .v{order:3;flex-basis:calc(100% - 28px);margin-left:28px;text-align:left;font-weight:400;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.fact.long.full .v{display:block}
.sec.desc{background:#fbfaf5;border-left:3px solid var(--amber)}
.ds{margin:0 0 10px}.ds:last-child{margin:0}.ds h5{margin:0 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.ds p{margin:0;font-size:14.5px;line-height:1.55}
.ds.narr{margin-top:14px;padding-top:12px;border-top:1px dashed #e6d9b0}
.qual h5.qh{margin:10px 0 2px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sec.srq .cmp{margin:4px 0 8px;font-size:14px;line-height:1.55}.sec.srq .shortv{background:var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px}.sec.srq .shortv p{margin:3px 0 0}
.sec.srq .cpy{display:flex;gap:14px;margin-top:6px}.qcounts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.qc{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.qc.ok{background:#e6f4ec;color:#1d6b43}.qc.pa{background:#fdf3dc;color:#8a5d00}.qc.tb{background:#eef1f8;color:#3c4a6b}.qc.rk{background:#fdecea;color:#b42318}.qc.na{background:#f3f4f6;color:#6b7280}
.ds .hl{font-size:15px;margin-bottom:4px}.ds .exec p{margin:0 0 8px}.ds .exec p:last-child{margin:0}
.sumt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px;background:#fff}.sumt td{border:1px solid #ece3c6;padding:6px 9px;vertical-align:top;line-height:1.45}
.sumt td:first-child{width:32%;color:var(--ink-3);font-weight:600;background:#fdfaf0}.ds ul{margin:2px 0 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.sec.record h4 .muted{font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.kvg{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;font-size:13px}.kvg span:nth-child(odd){color:var(--ink-3)}
.sec.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec.chips span{background:var(--line-2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.sec.brdlink{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f6f8fd}
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);overflow:auto;padding:0 12px 40px}
.doctools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:10px 12px;color:#fff;background:var(--navy);border-radius:0 0 10px 10px}   /* solid, so text never scrolls visibly under the buttons */
.doctools .muted{color:#c9d3ea}.doctools .sp{flex:1}
.paper{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;padding:48px 56px;box-shadow:0 20px 50px rgba(0,0,0,.3);outline:none}
@media(max-width:700px){.paper{padding:24px 18px}.hide-sm{display:none}.brd .two{grid-template-columns:1fr}}
body.doc-open{overflow:hidden}
@media print{
  body{display:block;height:auto;background:#fff}
  body.doc-open>*:not(#docRoot){display:none!important}
  .docwrap{position:static;background:none;padding:0;overflow:visible}.doctools{display:none}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .brd h2{break-after:avoid}.brd tr{break-inside:avoid}
}
.sd-h{background:var(--navy);color:#fff;padding:14px 20px}
.sd-h small{font-size:11.5px;color:#aab6d3;letter-spacing:.06em;text-transform:uppercase}
.sd-h .t{font-family:"Inter Tight";font-size:17px;font-weight:700;outline:none;margin-top:2px}
.sd [contenteditable]{outline:none;border-radius:6px}
.sd [contenteditable]:focus{background:#f6f8fd;box-shadow:0 0 0 2px rgba(44,74,138,.15)}

/* side panel */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.side-close{display:none}
@media(max-width:900px){.side-close{display:block;margin:0 0 10px auto}.side{position:fixed;inset:0 0 0 auto;width:min(360px,92%);background:var(--bg);z-index:30;padding:76px 16px 16px;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 40px rgba(0,0,0,.15);overflow-y:auto}.side.open{transform:none}.top{position:relative;z-index:40}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.route{font-family:"Inter Tight";font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
.prov{font-size:12px;color:var(--ink-3)}
.prog{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c544);transition:width .4s}
.fact{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px;align-items:flex-start}
.fact:first-of-type{border-top:0}
.fact .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.fact.ok .ic{background:var(--ok);border-color:var(--ok)}
.fact.next .ic{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fact .k{color:var(--ink-3);flex:none;width:112px}
.fact .v{flex:1;text-align:right;font-weight:500;word-break:break-word}
.ed{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:13px;line-height:1;opacity:.55}
.ed:hover,.ed:focus-visible{opacity:1;color:var(--navy-3)}
.fact.editing{flex-wrap:wrap}
.fedit{display:flex;gap:6px;width:100%;margin-top:6px}
.fedit input,.fedit select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
.fedit button{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;background:var(--navy);color:#fff}
.fedit button.x{background:var(--line-2);color:var(--ink-2)}
.fact:not(.ok) .v{color:var(--ink-3);font-weight:400}
.muted{color:var(--ink-3);font-size:12.5px}

/* drawer */
.alert{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.err{background:var(--bad-soft);color:var(--bad)}

const catById = id => CATEGORIES.find(c=>c.id===id) || {id, name:id||"–", type:"services"};
const known = v => v!==null && v!==undefined && v!=="";

const hasSupplier = f => known(f.supplier) && !/^(none|no|no preference|not sure|n\/a|unknown|tbd|tbc|not known|any|open|to be decided)$/i.test(String(f.supplier).trim());

const kwRe = (k, flags) => new RegExp(k.endsWith("*") ? "\\b"+k.slice(0,-1) : "\\b"+k+"(?:e?s)?\\b", flags);
const kwHit = (t, k) => kwRe(k).test(t);
// the category with the most keywords in the text. A goods noun right after "to" is a verb ("a tool to monitor alerts"), and after "trading",
// "service" or "help" it names a team ("trading desk", "service desk"), so neither counts.
// A tie goes to the category named last in the head of the first message, the words before "for", "to", "with", "that" or a comma:
// the head noun ends that phrase ("software to manage our laptops" is software, "a transaction monitoring system" is a system).
function bestCategory(t, first=t){
  // "we need to transform …": the head is what comes after the request words; "including", "as well as" start the secondary scope
  const lead=(first.match(/^\s*(?:(?:hi|hello)[,!]?\s+)?(?:(?:we|i)(?:'d| would)?\s+(?:need|want|would like|are looking|am looking|have)\s+(?:to\s+|for\s+)?|please\s+)?/i)||[""])[0].length;
  const rest=first.slice(lead), sep=rest.search(/\s(?:for|to|with|that|which|as|including|incl\.?|plus|along with|together with|as well as)\s|[,.;:!?]/), head=lead+(sep<0?rest.length:sep);
  // a category named in the head wins over one with more keywords later on
  const inHead=CATEGORIES.filter(c=>c.kw.some(k=>[...t.matchAll(kwRe(k,"g"))].some(m=>m.index+m[0].length<=head && m.index>=lead-1)));
  bestCategory.inHead=inHead.length>0;   // read by offlineRead: only a category named in the head overrides the AI's Level 4
  let best=null, score=0, key=-1;
  for(const c of (inHead.length?inHead:CATEGORIES)){
    let s=0, k2=-1;
    for(const k of c.kw){
      const ends=[...t.matchAll(kwRe(k,"g"))].filter(m=>!(c.type==="goods" && /\b(?:to|trading|dealing|service|help|front|back|cash|sales|support|treasury) $/.test(t.slice(0,m.index)))).map(m=>m.index+m[0].length);
      if(ends.length){ s++; k2=Math.max(k2, ...ends.filter(e=>e<=head)); }
    }
    if(s>score || (s && s===score && k2>key)){ best=c; score=s; key=k2; }

}
// catalogue entries for the request, within its own category (no stationery for a SaaS tool): items by their search words;
// punch-out shops by their words, or by the request's Level 4 once the value is known (a big flower contract is no shop order)
// and the Level 4 is sure: set by the requester or the AI, or worked out with confidence (a magician is no client gift)
const catalogueMatches = f => { const t=userText(), v=known(f.value)?Number(f.value):null, sureL4=!!f.l4 && (S.derived.l4!==f.l4 || S.l4Settled===f.category);
  return CATALOGUE.filter(i=>{ const inCat=!known(f.category)||i.cat===f.category, hit=i.kw.some(k=>kwHit(t,k));
    return i.kind==="shop" ? inCat && (hit || (f.l4===i.l4 && v!=null && sureL4)) : inCat && hit && i.type===f.demand_type; }); };
// a stated budget the catalogue price cannot explain means something else is being bought: items at most twice price × quantity,
// and with no quantity yet, no more than the business-led sourcing threshold; a shop up to its maximum order value
const catalogueFits = (f, items) => {
  const v=known(f.value)?Number(f.value):NaN, q=parseInt(f.quantity);
  if(isNaN(v)) return true;
  if(items.every(i=>i.kind==="shop")) return v <= Math.max(...items.map(i=>i.max_order||0));
  return q>0 ? v <= 2*q*items.reduce((s,i)=>s+(i.price||0),0) : v <= CONFIG.thresholds.quickQuoteMax;
};
// below the low-value limit a purchase is bought directly, unless it needs the checks of the standard path (described in the Decision tree)
const lowValueFits = (f, v) => v!=null && v<=CONFIG.thresholds.lowValueMax && !["contingent_labour","software"].includes(f.demand_type)
  && !yes(f.tech_service) && !yes(f.personal_data) && !yes(f.system_access) && !(isOngoing(f) && known(f.duration) && monthsOf(f.duration)>12);
const daysTo = d => (new Date(d) - new Date())/864e5;

function contractFor(f){
  if(f.decline_contract || f.contract_ok===false) return null;   // "No, look wider"
  if(S.catGuess && S.catGuess===f.category) return null;   // "translation of our annual report" is not a call-off on the consulting framework
  // a named supplier may use its framework anywhere in the category; otherwise the framework must cover the Level 4
  const today=new Date(), active=CONTRACTS.filter(c=>new Date(c.expires)>today), list=active.filter(c=>contractCovers(c,f));
  if(!hasSupplier(f)) return list[0]||null;
  const s=String(f.supplier).toLowerCase();
  return active.filter(c=>c.themes.includes(f.category)).find(c=>s.includes(supplierKey(c.supplier))||c.supplier.toLowerCase().includes(s))||null;
}

// described in How it works (specModel) and the Decision tree (treeModel, treeFigure): update their prose when the route rules change
function determine(){
  const f=S.f, T=CONFIG.thresholds, v=known(f.value)?Number(f.value):null;
  const all = catalogueMatches(f), items = all.filter(i=>i.kind!=="shop"), shops = all.filter(i=>i.kind==="shop"), ctr = contractFor(f);
  // fixed-price items first; a shop when no item fits
  const cat = items.length && catalogueFits(f, items) ? items : shops.length && catalogueFits(f, shops) ? shops.slice(0,1) : [];
  let route, why;
  const declined=(f.decline_contract||f.contract_ok===false) && CONTRACTS.some(c=>contractCovers(c,f) && new Date(c.expires)>new Date());   // "No, look wider"
  const lead=`This is new demand${declined?" (you chose to look wider than the existing framework)":" with no contract in place"}.`;
  if(cat.length && cat[0].kind==="shop"){ route="catalogue"; why=`The ${cat[0].name.toLowerCase()} of ${cat[0].supplier} is in the catalogue for orders up to ${money(cat[0].max_order)}, so you order there directly at the agreed prices.`; }
  else if(cat.length){ route="catalogue"; why=`${cat.map(i=>i.name).join(" and ")} ${cat.length>1?"are":"is"} in the catalogue, so you can order directly at the agreed price.`; }
  else if(ctr){ route="contract"; why = f.demand_type==="contingent_labour"
      ? `External workers come through the ${ctr.title} with ${ctr.supplier}, so this is a call-off with a role profile. No new competition is needed.`
      : `The ${ctr.title} with ${ctr.supplier} already covers this, with ${money(ctr.remaining)} left until ${fmtDate(ctr.expires)}. No new competition is needed.`; }
  else if(lowValueFits(f, v)){ route="lowvalue"; why=`At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is under the ${money(T.lowValueMax)} low-value limit and no catalogue item or framework covers it, so you buy it directly: a purchase order with one quote, or your corporate card where the card policy allows.`; }
  else if(v!=null && v<=T.quickQuoteMax){ route="quote"; why=`${lead} At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is under the ${money(T.quickQuoteMax)} threshold, so the business leads the sourcing: you collect at least three quotes, with procurement's guidance.`; }
  else { route="sourcing"; why = v==null ? `${lead} The value is not known yet, so I assume procurement-led sourcing until it is.` : `${lead} At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is above the ${money(T.quickQuoteMax)} threshold, so procurement leads the sourcing with an RFP.`; }
  return {route, why, contract:ctr, catalogue:cat, controls:controlsFor(route,ctr,cat), steps:nextSteps(route,cat,ctr)};
}

// described in How it works (specModel) and the Decision tree (treeModel, treeFigure)
function controlsFor(route, ctr, cat=[]){

  if(route==="quote") out.push(["i","Three quotes","The business collects at least three comparable quotes; procurement reviews the choice."]);
  if(route==="contract") out.push(["i","Confirm contract use","Contract owner confirms the scope fits."]);
  if(route==="lowvalue") out.push(["i","One quote","One written quote or a published price is enough; keep it with the order."], ["i","No splitting",`One need must not be split into several orders to stay under ${money(T.lowValueMax)}.`]);
  if(accessFlags(f).personal) out.push(["w","Data protection review","The provider will see personal or client data."]);
  if(yes(f.tech_service) && (NEW_DEMAND(route)||f.demand_type==="contingent_labour")) out.push(["w","ICT review (DORA)", REL.ongoingSvc(f)?`Likely an ICT service: ${ictType(f)}.`:`Possibly an ICT service: ${ictType(f)}. The review confirms.`]);
  if(NEW_DEMAND(route) && f.demand_type!=="goods"){ const o=outsourcing(f);
    if(o.code==="yes") out.push(["w","Outsourcing assessment",`${o.result} under ${o.rs.short}.`]);

    const a=accessFlags(f); if(a.money||/Privileged|Administrative/.test(a.level)) out.push(["w","Access review",`${a.money?"Money or account access":""}${a.money&&/Priv|Admin/.test(a.level)?"; ":""}${/Priv|Admin/.test(a.level)?a.level+" access":""}.`]); }

    const pref=preferredFor(f).map(p=>p.toLowerCase()), other=supplierNames(f.supplier).filter(n=>!pref.some(p=>p.includes(n.toLowerCase())||n.toLowerCase().includes(p)));

}
// checks a large bank runs for some categories; review flags only, never extra questions (described in How it works and the Decision tree)
function bankChecks(f){

/* ---------- ICT (DORA) and outsourcing: a decision tree run by rules, never a picker for the user (described in How it works and the Decision tree) ---------- */
const TECH_WORDS=/\b(software|systems?|platform|cloud|saas|paas|iaas|hosting|hosted|data feeds?|data cent(?:re|er)|digital|cyber\w*|network|infrastructure|applications?|apps?|technology|database|api|it support|help ?desk|service desk|developers?|engineers?|architects?|devops|testers?|erp|crm|sap)\b/;
function userRaw(){ return " "+S.msgs.filter(m=>m.role==="user" && !m.l4).map(m=>m.text).join(" ")+" "; }
// a named supplier with a reason is a single-source request, unless the requester wants it in the competition ("include", "invite");
// "only", "directly" or "no tender" make it one even without a reason
const SOLE_RE=/\b(?:only|solely|exclusively|directly|sole[- ]source\w*|single[- ]source\w*|no (?:competition|tender|rfp|other (?:suppliers?|vendors?|providers?|offers?|quotes?))|without (?:a |any )?(?:competition|tender|rfp)|(?:nobody|no one|no-one) else|just (?:them|go with|use them|buy from|award))\b/i;
const INCLUDE_RE=/\b(?:include|including|invite|shortlist|as one of|alongside|among others|in the (?:competition|tender|rfp)|also (?:ask|invite|consider)|compare|comparison|benchmark|open to (?:others|alternatives)|other options|look at others)\b/i;
const supplierNames = s => String(s||"").split(/\s*(?:,|;|\/|&|\band\b|\bor\b|\bplus\b)\s*/i).map(x=>x.trim().replace(/^(?:maybe|perhaps|possibly)\s+/i,"")).filter(x=>x && !/^(?:others?|etc\.?|similar|(?:an?|another|some)\s+(?:\w+\s+)?(?:player|provider|vendor|supplier|firm|company|option)s?(?:\s+too)?)$/i.test(x));
// "Workday maybe" is Workday
const cleanSupplier = v => String(v).replace(/\s*\([^)]*\)/g,"").replace(/\s*\b(?:maybe|perhaps|probably|possibly|i guess|i think|i suppose|or similar|or so)\b[?.!]?\s*/gi," ").replace(/\s+/g," ").trim();
function soleSupplier(f){

function contentWords(t){ return (String(t||"").toLowerCase().match(/[a-zäöüß][a-zäöüß-]{2,}/g)||[]).filter(w=>!STOP.has(w)); }
function offTopic(k, v){
  if(!TEXT_FACTS.includes(k) || k==="supplier_reason" || typeof v!=="string") return false;
  const ws=contentWords(v); if(ws.length<4) return false;            // short answers are handled by the vague check
  if(BIZ.test(v) || /\b(?:IT|ICT|HR|ERP|CRM)\b/.test(v)) return false;
  const prior=S.msgs.filter(m=>m.role==="user").slice(0,-1).map(m=>m.text).join(" ")+" "+(FACTS[k]?FACTS[k].q(S.f):"")+" "+catById(S.f.category).name+" "+[S.f.item,S.f.deliverables,S.f.summary].filter(x=>typeof x==="string").join(" ");
  const ctx=new Set(contentWords(prior).map(w=>w.slice(0,5)));
  return !ws.some(w=>ctx.has(w.slice(0,5)));
}
// how the AI says an answer has nothing to do with the question
const AI_OFF_RE=/off.?topic|unrelated|not related|does(?:n.?t| not) (?:answer|relate)|irrelevant|nothing to do/i;
function offTopicIssue(k){
  const F=FACTS[k], ex=F.ex(S.f);
  return {fact:k, kind:"offtopic", issue:"answer doesn't relate to the request", message:`That doesn't seem to answer my question. ${F.q(S.f)}${ex?" "+ex:""}`};
}

// returns {fact, issue, message, choices} for the first real problem in what changed this turn, or null (described in How it works)
function findIssue(changed){
  const f=S.f, route=S.det&&S.det.route, ctx=userText();
  for(const k of changed) if(!S.offChecked[k] && offTopic(k, f[k])) return offTopicIssue(k);   // nonsense first, regardless of other checks
  for(const k of changed){
    if(S.challenged[k]) continue;
    const v=f[k];
    if(["deliverables","scope_in","acceptance","background","users","current_solution","impact_delay","must_haves","data_details","skills","supplier_reason","renewal_change","item"].includes(k) && typeof v==="string"){
      const tooShort = ["deliverables","scope_in","acceptance","background","users","current_solution","must_haves"].includes(k) ? words(v)<2 : k==="supplier_reason" ? words(v)<3 : false;
      if((VAGUE.test(v.trim()) && !((k==="renewal_change"||k==="impact_delay")&&/no/i.test(v))) || tooShort)
        return k==="current_solution" && !VAGUE.test(v.trim()) && kindOf(f)!=="people"
          ? {fact:k, issue:"too vague to act on", message:`Thanks, so today it's ${v.trim().replace(/[.!]$/,"")}. And why can't that, or our own team, do the job?`}
          : {fact:k, issue:"too vague to act on", message:`Could you say a little more? "${v}" is hard for ${k==="supplier_reason"?"procurement to accept as a reason":"a supplier to work with"}. ${FACTS[k].ex(f)||FACTS[k].q(f)}`.trim()};
    }
    // the data question has two parts; "bank data" alone leaves the data protection review without a location.
    // The place must come from the requester's own answer: the AI sometimes fills in the question's example ("stored in the EU").
    const lastU=(S.msgs.filter(m=>m.role==="user").pop()||{}).text||"";
    if(k==="data_details" && givenText(v) && !(saysWhere(v) && saysWhere(lastU)))
      return {fact:k, kind:"where", issue:"where the data is stored is missing", message:`Thanks. And where will that data (${dataOnly(v)||v}) be stored or processed? For example "in the EU", "in Germany" or "on our own systems".`, choices:["Not sure"]};
    if(k==="value" && known(v)){
      const val=Number(v), mo=monthsOf(f.duration);
      if(f.demand_type==="contingent_labour" && known(f.day_rate)){
        const rate=parseMoney(f.day_rate), exp=rate&&rate<5000 ? rate*20*mo*(parseInt(f.headcount)||1) : null;
        if(exp && Math.abs(val-exp)/exp>0.5) return {fact:k, issue:`doesn't match the day rate (about ${money(exp)} expected)`, message:`Just to check: at ${f.day_rate} for ${parseInt(f.headcount)||1} ${parseInt(f.headcount)>1?"people":"person"} over ${f.duration||"the assignment"}, I'd expect about ${money(exp)}. You said ${money(val)}. Which is right?`, choices:[`About ${money(exp)}`,`${money(val)} is right`]};
      }
      // (not for a category the rules only guessed: "something nice for a retiring colleague" is no consulting work)
      const bigWork = !S.catGuess && (["consulting","it-services","legal","cloud"].includes(f.category) || (f.category==="software" && /\b(system|platform|replace|implementation|erp|crm)\b/.test(ctx)));
      if(bigWork && val<5000) return {fact:k, issue:`looks low for ${catById(f.category).name.toLowerCase()} work`, message:`Just to check: ${money(val)} is low for ${catById(f.category).name.toLowerCase()} work like this. Is that the total budget, or should it be higher?`, choices:["Yes, that's the total"]};
      // people × months for advisory work: €80,000 for three consultants over 9 months is about €150 a consultant day
      const ppl=peopleCount(f), perDay=ppl && known(f.duration) ? val/(ppl*mo*20) : null;
      if(perDay!=null && perDay<400 && ["consulting","it-services","legal","audit-tax"].includes(f.category))
        return {fact:k, issue:`low for ${ppl} ${ppl>1?"people":"person"} over ${f.duration}`, message:`Just to check: ${money(val)} for ${ppl} ${ppl>1?"people":"person"} over ${f.duration} is about ${money(Math.round(perDay))} a day each. ${catById(f.category).name} usually costs €1,000 to €2,000 a day per person. Is ${money(val)} the total budget?`, choices:["Yes, that's the total"]};
      if(known(f.duration) && mo>=3 && val<3000 && !GOODSLIKE(f)) return {fact:k, issue:`looks low for ${f.duration} of work`, message:`Just to check: ${money(val)} for ${f.duration} of work looks low. Is that the total budget?`, choices:["Yes, that's the total"]};
      if(val>20000000) return {fact:k, issue:"very large amount", message:`Just to confirm: the total is ${money(val)}?`, choices:["Yes, that's right"]};
    }
    if(k==="personal_data" && f.personal_data===false){
      const m=ctx.match(/\b(hr system|hr platform|payroll|salar(?:y|ies)|employee (?:records|names|details)|customer (?:records|names|details|data)|client (?:records|names|details)|patients?|crm|recruit\w*|candidates?)\b/);
      const what=m ? m[1].replace(/\b(crm|hr)\b/g,x=>x.toUpperCase()) : "";
      const dm=!m&&bankDomain(f);
      if(dm&&dm.personal) return {fact:k, issue:`"no personal data" although ${dm.name.toLowerCase()} usually involves personal data`, message:`You said no access, but ${dm.name} at a bank usually involves ${dm.personal}. Will the supplier see any of that?`, choices:["Yes","No, none at all"], flip:true};
      if(m) return {fact:k, issue:`"no personal data" although the request mentions ${what}`, message:`You said no personal data, but ${/^(CRM|HR)/.test(what)?"a "+what:what} usually involves names, contact details or salaries. Will the supplier see any of that?`, choices:["Yes","No, none at all"], flip:true};
    }
    if(k==="tech_service" && f.tech_service===false && !("tech_service" in S.derived)){
      const m=userRaw().match(/\b(IT|ICT|software|system|platform|cloud|SaaS|hosting|data feed|application|digital)\b/i);
      if(m) return {fact:k, issue:`"no technology service" although the request mentions ${m[1]}`, message:`You mentioned ${/^(it|ict|saas)$/i.test(m[1])?m[1].toUpperCase():m[1].toLowerCase()}. Will the supplier provide, run or advise on any technology or data for us?`, choices:["Yes","No, none at all"]};
    }
    if(k==="impact_delay" && /^(no(ne|thing)?|not much|no (?:real |big )?impact|nothing (?:serious|much))\b/i.test(String(v).trim())){
      const m=ctx.match(/\b(regulat\w*|audit\w*|deadline|compliance|end of life|end-of-life|out of support|expir\w*)\b/);
      if(m) return {fact:k, issue:`no impact if delayed, although the need is driven by ${m[1]}`, message:`You mentioned ${m[1]} earlier, yet no impact if this is delayed. Is there really no deadline or consequence?`, choices:["No real impact"]};
    }
    if(k==="needed_by" && known(v) && route){
      const d=parseWhen(v); if(!d) continue;
      const days=Math.round((d-new Date())/864e5);
      if(days< -1) return {fact:k, issue:"date in the past", message:`${v} seems to be in the past. When should it start?`};
      if(days < (LEAD_DAYS[route]||0)) return {fact:k, issue:`tight: ${CHANNELS[route].name} usually takes ${CHANNELS[route].days} working days`, message:`That's ${days<=1?"very soon":`in about ${days} days`}. ${CHANNELS[route].name} usually takes ${CHANNELS[route].days} working days. Is ${/\((?:asap|as soon as possible|immediately|urgent(?:ly)?|right away|now)\)$/i.test(v)?"that":String(v).replace(/\s*\([^)]*\)$/,"")} a fixed deadline, or can it move a little?`, choices:["It's fixed","It can move"], kind:"date"};
    }
  }
  return null;
}

// overall assessment of the intake: completeness, clarity, consistency (described in How it works)
// score = 100 − warn·warnings − info·notes − incomplete·(100 − % of needed details) − section penalty (capped), never below floor
const QUALITY={warn:15, info:5, incomplete:0.5, partialSection:3, riskSection:8, sectionCap:30, floor:35, bands:[[90,"Strong"],[75,"Good"],[55,"Fair"],[0,"Needs work"]]};
function computeQuality(aiRemarks){
  const f=S.f, route=S.det.route, req=S.req||[], pts=[];
  const label=k=>FACTS[k]?FACTS[k].label:k;
  // the AI's own wording of an issue ("the user asked…, but the system…") is not for the buyer
  const iss=fl=>{ const x=String(fl.issue||"").replace(/[.\s]+$/,""); return !x || words(x)>12 || /\b(?:user|system|assistant|the ai|asking|asked)\b/i.test(x) ? "needed a second look" : x; };
  for(const fl of S.flags){
    if(fl.status==="confirmed") pts.push({lvl:"warn",text:`${label(fl.fact)}: ${iss(fl)}. Confirmed by you, so the buyer may ask again.`});
    else if(fl.status==="flexible") pts.push({lvl:"info",text:`Start date is flexible (${fl.issue}).`});
    else if(fl.status==="corrected") pts.push({lvl:"ok",text:`${label(fl.fact)} clarified during the intake.`});
    else if(fl.status==="unanswered") pts.push({lvl:"warn",text:`${label(fl.fact)}: no usable answer given.`});
  }
  const swCount=k=>k==="quantity"&&f.demand_type==="software"&&NEW_DEMAND(route);
  req.filter(k=>(f[k]==="Not given"||f[k]==="unsure") && k!=="budget_approved" && !S.flags.some(x=>x.fact===k&&x.status==="unanswered")).forEach(k=>pts.push(swCount(k)?{lvl:"info",text:"Number of users: to confirm with suppliers."}:{lvl:"warn",text:`${label(k)}: still to be clarified.`}));
  if(givenText(f.data_details) && !saysWhere(f.data_details)) pts.push({lvl:"warn",text:"Data involved: where the data is stored is not given."});
  if(f.value_is_estimate && !["catalogue"].includes(route)) pts.push({lvl:"info",text:`The budget of ${money(Number(f.value))} is an estimate.`});
  if(route==="sourcing" && f.budget_approved==="unsure") pts.push({lvl:"info",text:"Whether the budget is approved isn't known yet. Sourcing can only start once it is."});
  else if(route==="sourcing" && f.budget_approved && f.budget_approved!=="yes") pts.push({lvl:"warn",text:`Budget ${f.budget_approved==="partly"?"only partly":"not yet"} approved. Sourcing can only start once it is.`});
  if(known(f.needed_by) && !S.flags.some(x=>x.fact==="needed_by")){ const d=parseWhen(f.needed_by); if(d){ const days=(d-new Date())/864e5; if(days<(LEAD_DAYS[route]||0)) pts.push({lvl:"info",text:`Tight timeline: ${CHANNELS[route].name} usually takes ${CHANNELS[route].days} working days.`}); } }
  (aiRemarks||[]).filter(x=>typeof x==="string"&&x.trim()&&!/^(none|n\/a|no (issues|concerns|remarks)|nothing)\b/i.test(x.trim())).slice(0,2).forEach(x=>pts.push({lvl:"info",text:x.trim().replace(/\.?$/,".")}));
  const answered=req.filter(k=>known(f[k])&&f[k]!=="Not given"&&f[k]!=="unsure").length, complete=req.length?Math.round(answered/req.length*100):100;
  const warn=pts.filter(p=>p.lvl==="warn").length, info=pts.filter(p=>p.lvl==="info").length;
  let secPen=0;
  // a missing section only costs points when this route asks for it, so the requester can always lift the score in the chat; a risk always counts
  const askable=sec=>{ const m=SEC2KEY[sec], k=typeof m==="function"?m(f):m; return !!k && (req.includes(k) || (k==="data_details"&&yes(f.personal_data))); };
  if(S.sd&&S.sd.detail){ const R=sectionQuality().filter(r=>r.status==="Risk"||askable(r.sec)); secPen=Math.min(QUALITY.sectionCap, QUALITY.partialSection*R.filter(r=>r.status==="Partial"||r.status==="To be determined").length + QUALITY.riskSection*R.filter(r=>r.status==="Risk").length); }
  const score=Math.max(QUALITY.floor,Math.min(100,100-QUALITY.warn*warn-QUALITY.info*info-Math.round((100-complete)*QUALITY.incomplete)-secPen));
  const rating=QUALITY.bands.find(([min])=>score>=min)[1];
  return {score,rating,complete,points:pts};
}

// "Under 3 months" is less than 3 months, not 3; with no number, 6
const monthsOf = d => { const m=String(d||"").match(/(\d+)\s*(?:-|–|to)?\s*(\d+)?\s*(month|week|year)/i); if(!m) return 6; let n=Number(m[2]||m[1]); if(/\b(?:under|less than|below|up to)\s+\d/i.test(String(d)) && !m[2]) n=Math.max(n-1, n/2); return /week/i.test(m[3])?n/4.3:/year/i.test(m[3])?n*12:n; };

   6. AI CLIENT
   ========================================================= */
let SERVER=null;
const aiReady = () => CONFIG.provider==="server" && !!SERVER;
const PNAMES={gemini:"Gemini",groq:"Groq",mistral:"Mistral",openrouter:"OpenRouter"};
// only name a provider once it has actually answered; before that we don't know who will (limits are checked per call)
const providerLabel = () => SERVER&&SERVER.last ? PNAMES[SERVER.last]||SERVER.last : "";
const providerChain = () => SERVER ? Object.keys(PNAMES).filter(k=>SERVER.providers&&SERVER.providers[k]).map(k=>PNAMES[k]).join(" → ") : "";
async function detectServer(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{ const r=await fetch("/api/llm"); if(!r.ok) return; const d=await r.json(); if(d&&d.ok) SERVER=d; }catch(e){}
}
function resolveProvider(){
  if(CONFIG.provider!=="auto") return;
  CONFIG.provider = SERVER ? "server" : "offline";   // opened as a file: the rules only
}
// the browser's side of every AI call (also shown in How it works)
const LLM_CLIENT={timeoutMs:58000, retries:2, retryMaxS:20, fastMs:15000};
async function callLLM(system, history, retried){
  if(CONFIG.provider!=="server") throw new Error("No AI connection.");
  const t0=Date.now();
  const r=await fetch("/api/llm",{method:"POST",signal:AbortSignal.timeout(LLM_CLIENT.timeoutMs),headers:{"Content-Type":"application/json","x-access-code":CONFIG.accessCode||"",...(CONFIG.forceProvider?{"x-force-provider":CONFIG.forceProvider}:{})},body:JSON.stringify({system,history})});
  const d=await r.json().catch(()=>({}));
  // a wrong or expired code: the gate asks for it again; this turn runs on the rules
  if(r.status===401){ reopenGate(); const e=new Error("Access code missing or wrong."); e.auth=true; throw e; }
  // short per-minute limit: wait the few seconds the provider asks for, then try once more.
  // Not after a slow 429: the server has then already spent its time trying every provider.
  if(r.status===429 && (retried||0)<LLM_CLIENT.retries && d.retryAfter && d.retryAfter<=LLM_CLIENT.retryMaxS && Date.now()-t0<LLM_CLIENT.fastMs){ await new Promise(res=>setTimeout(res,(d.retryAfter+1)*1000)); return callLLM(system, history, (retried||0)+1); }
  if(!r.ok){ const e=new Error(d.error||`Server error ${r.status}`); e.quota=r.status===429||!!d.quota; throw e; }
  if(SERVER && d.provider) SERVER.last=d.provider;
  return parseJSON(d.text);
}
function parseJSON(t){ t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(); try{return JSON.parse(t);}catch(e){const m=t.match(/\{[\s\S]*\}/); if(m){ try{return JSON.parse(m[0]);}catch(e2){} } return {_raw:true, reply:t}; } }

/* ---------- conversation prompt ---------- */
function chatSystem(){
  return `You are the intake assistant of a corporate procurement team. You talk with business colleagues who want to buy something.
Today is ${fmtDate(new Date())}. A start or delivery date before today is in the past.
You only have a conversation. Fixed rules decide the buying route and which facts are needed. Each turn you get the current state, including the ordered list "still_needed".
${BANK_CONTEXT}
${S.f&&S.f.category?`Domain notes for this request (typical at a large bank; use them for suggestions, examples and sensible follow-ups):\n${domainNotes(S.f)}\n`:""}
Your job each turn:
1. Read the user's latest message and record EVERY fact it contains in "facts", for any key in the list below, not only the one you asked about.
   Business users often put many details into one message (budget, dates, place, data, supplier, success criteria). Capture all of them so they are never asked again. Use null for unknown. Never invent facts.
   If they say they don't know the value, estimate a realistic total in ${CONFIG.currency} (€, never £ or $), set value_is_estimate true, and tell them your estimate and its basis.
   Any answer counts, including "no", "not sure" or "none". Record it.
2. Write "reply":
   - Start with a short, natural reaction to what they said (vary it; do not start with "Got it" every time). Show you understood, using their words.
   - If their message covered several details at once, say briefly what you captured (a few words each), so they see nothing was lost.
   - Where it helps, add one useful remark in plain words: an existing contract or preferred supplier for this, a typical price, or why the next question matters.
   - Then ask about the FIRST item in still_needed that is still unknown after your update. One question at a time; you may combine it with the second item only when they naturally belong together (for example start date and duration).
   - If the user's answer already covers later items in still_needed, record those too so they are not asked again. Include a short, concrete example that fits their need, written into the sentence (for example "such as a current-state process map and a rollout plan").
   - 2 to 4 sentences. Warm, direct, plain English. No procurement jargon, no bullet lists, no headings.
   - The reply is read by a business colleague. NEVER mention field names or internal terms (such as ict_outsourcing, tech_service, personal_data, still_needed, facts, JSON), values like true, false or null,
     or what you "set" or "recorded" in which field. Say it in plain words instead, for example "Noted, the supplier will run it for you."
   - Never name or decide the buying route yourself. Never ask about something not in still_needed.
3. If nothing in still_needed is unknown after your update, set "complete" true and reply with one sentence saying you have what you need.
4. "choices": up to 4 very short answers only when your question is a closed one (yes/no, a duration band, a number of people). Otherwise [].
5. Quality check of the user's latest answer, in "assessment": {"fact":"key of the item they answered","ok":true,"issue":"","follow_up":"","score":1-10}.
   score rates how useful the answer is for the request: 9-10 clear and complete, 6-8 usable but thin, 3-5 vague, 1-2 off-topic. Accepting a suggestion counts as 9.
   Set ok to false when the answer has nothing to do with the question or the request (for example a recipe, a joke or random text): then use issue "off-topic", do NOT record it as a fact, and ask the question again.
   Also set ok to false when the answer is clearly too vague to act on ("stuff", "the usual"), contradicts earlier facts, or is implausible
   (for example a budget far too low for the work described, a start date that has passed, "no personal data" for an HR or payroll system).
   Reasonable answers are ok, even if short. Never challenge an item listed in already_checked.
   When ok is false, "reply" must be only a short, friendly follow-up that names the issue and asks to confirm or correct it. Do not ask the next item in that case.
7. Corrections: if the user changes something they said or confirmed earlier (for example a different category, budget, number of users, start date, duration, supplier, provisioning legal entity, location or title), put only the corrected items in "corrections" (same keys as facts; category as a category id, with l4_terms: 2–5 words for what is bought) and NOT in "facts". Set "answers_question" false when the message does not also answer your last question; then do not record anything for that question.
6. If pending_check is set, the user is answering your earlier check on that item: update the fact if they corrected it, keep it if they confirmed it.
8. If the user asks you a question instead of answering (for example "are they any good?" or "what does that mean?"), answer it briefly and honestly in "reply" (say so if you don't know), record no facts, set "answers_question" false, and do not ask the next item.
9. Record only what the user said or accepted. Never fill a fact with "unknown", "none", "not specified" or a guess; leave it out. Never record a question the user asked as a fact.
Keep the conversation light: ask only what is in still_needed, and never ask about cost centres, payment models, subcontractors, certifications, service levels, ownership of work or evaluation weights unless the user raises them.

Fact keys:
summary (one plain sentence describing the need), category (one of: ${CATEGORIES.map(c=>`${c.id} = ${c.name}`).join("; ")}), demand_type (goods | services | software | contingent_labour),
Category rules: "cloud" is hosting and infrastructure only (servers, storage, data centre). A business application used as a service (HR, payroll, CRM, finance, procurement tools), even if cloud-based or SaaS, is "software" with demand_type software.
item, quantity (number), value (total ${CONFIG.currency}, number), value_is_estimate (bool), deliverables (one string), duration, needed_by (as they said it),
location (where the provider does the work or delivers; never where users, employees, clients or data are), supplier (name, or "None"), supplier_reason, personal_data (true | false | "unsure"),

const nonEmpty = v => Array.isArray(v) ? v.filter(x=>x&&(typeof x!=="object"||Object.values(x).some(Boolean))).length>0 : !!(v&&String(v).trim());
function mergeBRD(base, ai){
  const out={...base};
  if(ai && typeof ai==="object") for(const [k,v] of Object.entries(ai)) if(nonEmpty(v) && k in base) out[k]=v;
  if(Array.isArray(out.requirements)) out.requirements=out.requirements.filter(r=>r&&r.text).map((r,i)=>({id:`BR-${String(i+1).padStart(2,"0")}`,type:r.type||"Requirement",text:r.text,priority:r.priority||"Must"}));
  // facts the rules depend on are never dropped by the AI version
  out.risk_and_compliance=[...new Set([...(out.risk_and_compliance||[]),...(base.risk_and_compliance||[]).filter(x=>!(out.risk_and_compliance||[]).length)])];
  return out;
}

async function buildDoc(cid=S.cid){
  const key=JSON.stringify(S.f)+S.det.route;
  if(S.sd && S.docKey===key){ S.msgs.push({role:"assistant",kind:"sd"}); return; }
  const base=offlineSummary(), desc0=offlineDescription(), cl=classify(S.f);
  let ai=null;
  if(aiReady() && !LIGHT(S.det.route)){   // a purchase request is short: built from the answers, no AI call
    try{
      const docMsg=[{role:"user",content:docUser()}];
      for(let attempt=0; attempt<2; attempt++){
        try{ ai=await callLLM(DOC_SYSTEM(),docMsg); } catch(e){ if(attempt || e.quota) throw e; ai=null; }   // every provider at its limit: build from the answers now
        guard(cid);
        if(ai && ai.description && typeof ai.description==="object") break;
        ai=null;
      }
      if(!ai) throw new Error("empty");
    }catch(e){ if(e instanceof Stale) throw e; guard(cid); ai=null; S.msgs.push({role:"assistant",kind:"sys",text:"The AI couldn't write the documents just now, so they are built from your answers. You can let the AI try again later with \"Write it with AI again\"."}); }
  }
  const name=ai&&ai.description&&scrubText(String(ai.description.name||"")).replace(/\.$/,"");
  S.sd = {title:(name&&words(name)<=8?name:"")||(NEW_DEMAND(S.det.route)?workingTitle():"")||base.title, desc:mergeDesc(desc0, ai&&ai.description), brd:mergeBRD(offlineBRD(base.risk), null), _ai:!!ai, _date:new Date()};
  if(NEW_DEMAND(S.det.route)){
    S.sd.detail = mergeDetail(offlineDetail(S.sd.brd), null);
    S.sd.compact = offlineCompact();   // in the JSON payload only
    S.sd.l4Final = finalL4(ai&&ai.l4_final);
  }
  S.quality = computeQuality(ai&&Array.isArray(ai.quality_remarks)?ai.quality_remarks:[]);
  S.docKey=key; S.brdEdited=null;
  S.msgs.push({role:"assistant",kind:"sd"});
}

/* ---------- replies type out like someone writing: fast, and line by line for long ones ----------
   One reply at a time; anything after it in the same turn (cards, notes, answer chips) waits until it is done.
   A click on the reply, typing or sending finishes it at once. With "reduce motion" switched on, text appears at once. */
const TYPE={seen:new WeakSet(), queue:[], cur:null, shown:0, timer:null};
const typable = m => m.role==="assistant" && !m.kind && typeof m.text==="string" && m.text.length>0;
const typingActive = () => !!TYPE.cur;
function typeTrack(){
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.msgs.forEach(m=>{ if(TYPE.seen.has(m)) return; TYPE.seen.add(m); if(typable(m) && !reduce) TYPE.queue.push(m); });
  if(!TYPE.cur && TYPE.queue.length) typeNext();
}
function typeNext(){
  TYPE.cur=TYPE.queue.shift()||null; TYPE.shown=0; if(!TYPE.cur) return;
  const t=TYPE.cur.text, lines=t.split("\n").length, long=t.length>280||lines>=4;
  // short replies take up to 1.2 s; long ones come line by line with a short pause, about 2 s in all
  const ms = long ? Math.min(2200, 300+lines*180) : Math.min(1200, Math.max(250, t.length*10)), per=Math.max(1, Math.ceil(t.length/(ms/16)));
  const tick=()=>{
    if(!TYPE.cur) return;
    const t=TYPE.cur.text; let n=Math.min(t.length, TYPE.shown+per);
    const nl=t.indexOf("\n", TYPE.shown); if(long && nl>=0 && nl<n) n=nl+1;   // stop at the end of a line, then pause
    TYPE.shown=n;
    if(n>=t.length){ typeDone(); return; }
    typePaint(); TYPE.timer=setTimeout(tick, long && t[n-1]==="\n" ? 90 : 16);
  };
  TYPE.timer=setTimeout(tick, 16);
}
function typePaint(){
  const el=document.querySelector("#msgs [data-typing]"); if(!el||!TYPE.cur) return;
  let part=TYPE.cur.text.slice(0, TYPE.shown); if(((part.match(/\*\*/g)||[]).length)%2) part+="**";   // no stray "**" mid-way
  el.innerHTML=md(part);
  const box=$("#msgs"); if(!S.holdScroll) box.scrollTop=box.scrollHeight;
}
function typeDone(){ clearTimeout(TYPE.timer); TYPE.cur=null; if(TYPE.queue.length) typeNext(); render(); }
function typeFlush(){ clearTimeout(TYPE.timer); const was=TYPE.cur||TYPE.queue.length; TYPE.cur=null; TYPE.queue=[]; if(was) render(); }

function render(){
  typeTrack();

  $("#aiLabel").parentElement.title=aiReady()&&SERVER?`Fallback order: ${providerChain()}.${pl?` Last answer from ${pl}.`:" The first answer shows which one is used."}`:"";
  const box=$("#msgs");
  if(!S.msgs.length){
    box.innerHTML=`<div class="welcome"><h1>What do you need to buy?</h1>
      <p>Tell me in your own words. I'll ask only what's needed, one thing at a time, and then show you the quickest way to get it.</p>
      ${[...new Set(TRIES.map(x=>x[0]))].map(g=>`<h5 class="tryh">${esc(g)}</h5><div class="tries">${TRIES.map(([gg,h,t],i)=>gg!==g?"":`<button data-try="${i}"><small>${esc(h)}</small><span>${esc(t)}</span></button>`).join("")}</div>`).join("")}</div>`;
    box.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>handleUser(TRIES[b.dataset.try][2]));
  } else {
    const lastRec=S.msgs.map((m,i)=>m.kind==="rec"?i:-1).filter(i=>i>=0).pop();
    const lastSd=S.msgs.map((m,i)=>m.kind==="sd"?i:-1).filter(i=>i>=0).pop();
    // nothing after the reply being typed is shown yet
    const upto=TYPE.cur?S.msgs.indexOf(TYPE.cur):S.msgs.length-1;
    box.innerHTML=S.msgs.map((m,i)=>i>upto?"":msgHTML(m,i,lastRec,lastSd)).join("")+(S.busy&&!TYPE.cur?`<div class="m a"><div class="av">G</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`:"");
    bind();
    if(TYPE.cur){ typePaint(); const el=box.querySelector("[data-typing]"); if(el) el.onclick=typeFlush; }
  }
  $("#qr").innerHTML=S.busy||TYPE.cur?"":S.choices.map(q=>`<button>${esc(q)}</button>`).join("");
  $("#qr").querySelectorAll("button").forEach(b=>b.onclick=()=>handleUser(b.textContent));

  const sdIdx=S.msgs.map((m,i)=>m.kind==="sd"?i:-1).filter(i=>i>=0).pop();

  requestAnimationFrame(()=>{ const card=S.holdScroll&&box.querySelector("#sdcard");
    if(card) box.scrollTop=card.getBoundingClientRect().top-box.getBoundingClientRect().top+box.scrollTop-8;

function optionalWhy(sec, row){

  const WHY={
    "Governance": ong && size ? size : null,
    "Reporting": ong && (has("service_levels")||has("kpis")) ? "it tracks the service levels and KPIs you set" : ong && outL ? "outsourcing needs regular reporting" : null,
    "Change management": ong && (sw||tech) ? "software and technology services change during the contract" : null,
    "Escalation": ong && (crit||outL) ? size : ong && tech ? "incidents need a clear route to decision makers" : null,
    "Service level failure consequences": ong && has("service_levels") ? "you set service levels, so agree what happens when they are missed" : null,
    "Critical or important function relevance": crit ? "your answers point to a critical or important function" : outL ? "it is likely outsourcing" : null,
    "Tools": tech && ong ? "the provider runs technology for us" : null,
    "Acceptance testing": "suppliers need to know how their work is accepted",
    "Dependencies": "suppliers price what we must provide into their offer",
    "Assumptions": "suppliers price what we must provide into their offer",
    "Responsibility allocation": "suppliers price what we must provide into their offer",
    "Active obligations": ong && !sw ? "the provider's duties become the service obligations in the contract" : null,
    "Definitions": row && /abbreviations used:/i.test(row.issue||"") ? `the description uses ${String(row.issue).replace(/^abbreviations used:\s*/i,"")}, which readers outside your team may not know` : null,
  };
  return WHY[sec] || null;   // nothing specific to this demand: left out
}
// gaps the route asked for are "to improve"; the rest is optional, chosen for this demand, and can be added in the chat
function qualityGaps(){
  const f=S.f, req=S.req||[], keyOf=sec=>{ const m=SEC2KEY[sec]; return typeof m==="function"?m(f):m; };
  const rows=S.sd&&S.sd.detail ? sectionQuality().filter(r=>["Partial","To be determined","Risk"].includes(r.status)&&r.sec!=="Open points") : [];
  const asked=k=>!!k && (req.includes(k) || (k==="data_details"&&yes(f.personal_data)));
  const improve=rows.filter(r=>r.status==="Risk"||asked(keyOf(r.sec)));
  const groups={};
  rows.filter(r=>!improve.includes(r)).forEach(r=>{ const why=optionalWhy(r.sec, r); if(!why) return; const k=keyOf(r.sec), g=k&&FACTS[k]?k:"_"+r.sec;
    (groups[g]=groups[g]||{key:k&&FACTS[k]?k:null, secs:[], why, fix:r.fix}).secs.push(r.sec); });
  return {improve, optional:Object.values(groups)};
}
function qualityHTML(){
  const q=S.quality; if(!q) return "";
  const cls={Strong:"q-strong",Good:"q-good",Fair:"q-fair","Needs work":"q-needs"}[q.rating];
  const oks=q.points.filter(p=>p.lvl==="ok").length, items=[], gaps=qualityGaps();
  q.points.filter(p=>p.lvl!=="ok").forEach(p=>items.push({lvl:p.lvl,html:esc(p.text)}));
  gaps.improve.forEach(r=>items.push({lvl:r.status==="Risk"?"warn":"info", html:`<span><b>${esc(r.sec)}</b>: ${esc(r.issue||r.status.toLowerCase())}${r.fix?`. ${esc(r.fix)}`:""}</span>`}));
  // one list: what is weak or still open, each point once ("Must-haves: still to be clarified" and "Must-haves: to be determined" are one);
  // a point the route did not ask joins only when it improves the description itself, with one question to answer or a wording fix
  const labelOf=h=>String(h).replace(/<[^>]+>/g,"").split(":")[0].trim().toLowerCase().replace(/[.]$/,"");
  const seen=new Set(), list=[];
  const body=h=>String(h).replace(/<[^>]+>/g,"").replace(/^[^:]{1,40}:\s*/,"").toLowerCase().replace(/[.\s]+$/,"");
  const add=(lvl,html)=>{ const l=labelOf(html), b=body(html); if(seen.has(l) || (b.length>12 && list.some(x=>{ const o=body(x.html); return o.includes(b)||b.includes(o); }))) return; seen.add(l); list.push({lvl,html}); };
  items.forEach(x=>add(x.lvl,x.html));
  (S.sd&&S.sd.detail&&S.sd.detail.open_points||[]).forEach(x=>add("info",esc(x)));
  gaps.optional.filter(g=>(g.key && DESC_FACTS.includes(g.key)) || g.secs.includes("Definitions")).forEach(g=>{
    const html=`<span><b>${esc(g.secs.join(", "))}</b>: ${g.key?`${esc(cap1(g.why))}.`:`${esc(cap1(g.why))}. ${esc(g.fix)}.`}</span>${g.key&&!S.submitted?`<button class="lnk" data-act="addopt" data-key="${esc(g.key)}">Answer one more question</button>`:""}`;
    add("opt", html); });
  return `<div class="sec qual"><div class="qhead"><span class="qbadge ${cls}">${q.rating}</span><span>Quality check · ${q.score}/100 · ${q.complete}% of the needed details given${oks?` · ${oks} answer${oks>1?"s":""} clarified`:""}</span></div>
    ${list.length?`<h5 class="qh">Still to clarify</h5><ul class="qlist">${list.map(p=>`<li class="${p.lvl}">${/^<span>/.test(p.html)?p.html:`<span>${p.html}</span>`}</li>`).join("")}</ul>`:`<ul class="qlist"><li class="ok">No gaps or inconsistencies found.</li></ul>`}</div>`;
}

async function saveEdit(k, raw){
  if(S.busy) return;
  const t=String(raw||"").trim(); let v;
  if(k==="category"){ const code=(t.match(/\bL4-\d{4}\b/i)||[])[0], e=code?l4ByCode(code.toUpperCase()):null, w=!e&&t?catFromText(t):null;
    v=e?{cat:e.cat,l4:e.code}:w&&w.l4?w:null; }
  else if(k==="value") v=parseMoney(t);
  else if(NUM_KEYS.includes(k)){ const n=t.replace(/(\d),(\d{3})/g,"$1$2").match(/\d+/); v=n?+n[0]:/not sure|unsure/i.test(t)?"unsure":null; }
  else if(BOOL_KEYS.includes(k)) v= t==="yes"?true:t==="no"?false:"unsure";
  else if(k==="entity") v=t||null;
  else v=t?cap1(t):null;
  if(v===null||v===undefined||v===""){ const i=$("#edv"); if(i) i.style.borderColor="var(--bad)"; return; }
  S.editing=null; S.pending=null; S.pendingCorr=null; S.offerImprove=null;
  // the category set with ✎ answers the category question, if it is still open
  if(k==="category" && !known(S.f.l4_pick)){ const cid=S.cid; pickL4(v.l4, "chosen"); S.busy=true; render();
    try{ await afterChanges([], cid, {lead:`Thanks, I'll use **${l4ByCode(v.l4).name}** (${v.l4}).`}); }
    catch(e){ if(!(e instanceof Stale)) console.error(e); }
    finally{ if(S.cid===cid){ S.busy=false; render(); } }
    return; }
  const done=applyChanges({[k]:v});
  if(!done.length){ renderSide(); return; }
  const cid=S.cid; S.busy=true; render();
  try{ await afterChanges(done, cid); }
  catch(e){ if(!(e instanceof Stale)) console.error(e); }
  finally{ if(S.cid===cid){ S.busy=false; render(); } }
}

   10. HOW IT WORKS (a specification generated from this code)
   ========================================================= */
// One block model feeds the panel and the Markdown download. Values, question lists and prompts are read from the code,
// so they stay current; the prose describes determine, controlsFor, findIssue, computeQuality and handleTurn —
// update it when you change them.
// tree: a yes/no ladder (Decision tree): steps [{q, detail, yes:outcome, no}], then end, one outcome or several, for the last "no".
// An outcome is {label, title, sub, items, kind}: kind route (green), flag (a review), none (no flag), choice (the requester decides).
// figure: a picture as inline SVG for the panel, Mermaid text for the download.
const SB={ h:(n,text)=>({t:"h",n,text}), p:text=>({t:"p",text}), ul:items=>({t:"ul",items}), ol:items=>({t:"ol",items}),
  table:(head,rows)=>({t:"table",head,rows}), prompt:(label,text)=>({t:"prompt",label,text}),
  tree:(steps,end)=>({t:"tree",steps,end:[].concat(end||[])}), figure:(svg,mermaid,caption)=>({t:"figure",svg,mermaid,caption}) };
const specInline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
const dtOutHtml = o => `<div class="dt-out"><span class="dt-lbl">${specInline(o.label||"Yes")} →</span><div class="dt-end k-${o.kind||"route"}"><b class="dt-t">${specInline(o.title)}</b>${o.sub?`<p>${specInline(o.sub)}</p>`:""}${o.items&&o.items.length?`<ul>${o.items.map(x=>`<li>${specInline(x)}</li>`).join("")}</ul>`:""}</div></div>`;
const dtOutMd = (o, ind="") => `**${o.label||"Yes"} →** ${o.title}${o.sub?`: ${o.sub}`:""}${(o.items||[]).map(x=>`\n${ind}  - ${x}`).join("")}`;
function specHtml(blocks){
  return blocks.map(b=>
    b.t==="h" ? `<h${b.n}${b.n===1?' id="specH1"':""}>${specInline(b.text)}</h${b.n}>` :
    b.t==="p" ? `<p>${specInline(b.text)}</p>` :
    b.t==="ul"||b.t==="ol" ? `<${b.t}>${b.items.map(x=>`<li>${specInline(x)}</li>`).join("")}</${b.t}>` :
    b.t==="table" ? `<div class="tw"><table><tr>${b.head.map(x=>`<th>${specInline(x)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr>${r.map(x=>`<td>${specInline(String(x))}</td>`).join("")}</tr>`).join("")}</table></div>` :
    b.t==="prompt" ? `<details class="prompt"><summary>Show full prompt: ${esc(b.label)}</summary><pre>${esc(b.text)}</pre></details>` :
    b.t==="tree" ? `<div class="dt">${b.steps.map((s,i)=>`<div class="dt-step"><div class="dt-q"><span class="dt-n">${i+1}</span><div><b>${specInline(s.q)}</b>${s.detail?`<p>${specInline(s.detail)}</p>`:""}</div></div>${dtOutHtml(s.yes)}</div>
      <div class="dt-no"><span>${specInline(s.no||"No")} ↓</span></div>`).join("")}<div class="dt-last">${b.end.map(dtOutHtml).join("")}</div></div>` :
    b.t==="figure" ? `<figure class="dt-fig"><div class="dt-frame">${b.svg}</div>${b.caption?`<figcaption>${specInline(b.caption)}</figcaption>`:""}</figure>` : "").join("\n");
}
function specMd(blocks){
  const cell=x=>String(x).replace(/\|/g,"\\|").replace(/\n+/g," ");
  return blocks.map(b=>
    b.t==="h" ? `${"#".repeat(b.n)} ${b.text}` :
    b.t==="p" ? b.text :
    b.t==="ul" ? b.items.map(x=>`- ${x}`).join("\n") :
    b.t==="ol" ? b.items.map((x,i)=>`${i+1}. ${x}`).join("\n") :
    b.t==="table" ? [`| ${b.head.map(cell).join(" | ")} |`, `| ${b.head.map(()=>"---").join(" | ")} |`, ...b.rows.map(r=>`| ${r.map(cell).join(" | ")} |`)].join("\n") :
    b.t==="prompt" ? (()=>{ const fence="`".repeat(Math.max(2,...(b.text.match(/`+/g)||[]).map(x=>x.length))+1); return `**${b.label}**\n\n${fence}text\n${b.text}\n${fence}`; })() :
    b.t==="tree" ? [...b.steps.map((s,i)=>`${i+1}. **${s.q}**${s.detail?` ${s.detail}`:""}\n   - ${dtOutMd(s.yes,"   ")}\n   - **${s.no||"No"} →** ${i+2<=b.steps.length?`step ${i+2}`:"see below"}`), "", ...b.end.map(o=>`- ${dtOutMd(o)}`)].join("\n") :
    b.t==="figure" ? `\`\`\`mermaid\n${b.mermaid}\n\`\`\`${b.caption?`\n\n${b.caption}`:""}` : "").join("\n\n")+"\n";
}
// runs fn on a fresh copy of the app started with one example message, then puts the user's conversation back exactly
// (synchronous: nothing else can run in between; never renders)
function withExampleState(text, fn){
  const saved={...S}, seq=CONV_SEQ;
  try{
    Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, fresh());
    S.msgs.push({role:"user",text}); offlineRead(text, null); refresh();
    if(S.det){ S.l4Initial=initialL4(); S.l4Cands=l4Candidates(); }
