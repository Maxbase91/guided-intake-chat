<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Intake Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Guided Intake Chat (prototype)
   - Rules decide the buying route AND what must be known for that route.
   - The AI only talks: it phrases one question at a time and reads the answers.
   ========================================================= */
:root{
  --navy:#0f2147; --navy-2:#1b3266; --navy-3:#2c4a8a;
  --amber:#f2a900; --amber-soft:#fff4d6; --amber-ink:#8a5d00;
  --bg:#f5f6fa; --card:#fff; --line:#e4e7ef; --line-2:#eef0f5;
  --ink:#141b2d; --ink-2:#4a5470; --ink-3:#7c859e;
  --ok:#11845b; --ok-soft:#e5f5ee; --warn:#b4570b; --warn-soft:#fdf0e3;
  --bad:#b42318; --bad-soft:#fdecea; --info:#2c4a8a; --info-soft:#eaf0fb;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;flex:none}
.top-in{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#ffcf5c);display:grid;place-items:center;color:var(--navy);font-weight:800;flex:none}
.brand b{display:block;font-family:"Inter Tight";font-size:16px}
.brand span{font-size:12px;color:#aab6d3}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#dfe6f7;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7c859e}
.dot.on{background:#3ad29f;box-shadow:0 0 0 3px rgba(58,210,159,.2)}
.tb{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.tb:hover{background:rgba(255,255,255,.18)}
.only-m{display:none}
@media(max-width:900px){.only-m{display:inline-flex}.brand span,.pill{display:none}}

/* layout */
.app{flex:1;min-height:0;max-width:1280px;width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:0}}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:900px){.chat{border-radius:0;border:0}}
.msgs{flex:1;overflow-y:auto;padding:26px 24px 12px}
@media(max-width:600px){.msgs{padding:16px 12px 8px}}

/* welcome */
.welcome{max-width:600px;margin:24px auto 10px}
.welcome h1{font-size:26px}
.welcome p{color:var(--ink-2);margin:8px 0 18px}
.tries{border-top:1px solid var(--line-2)}
.tries button{display:flex;gap:12px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 4px;text-align:left;cursor:pointer;color:var(--ink-2);font-size:14.5px}
.tries button:hover{color:var(--navy);background:#fafbfd}
.tries small{flex:none;width:118px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
@media(max-width:600px){.tries small{width:90px}}

/* messages */
.m{display:flex;gap:10px;margin:0 0 16px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:9px;background:var(--navy);color:var(--amber);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.bub{max-width:min(600px,85%);padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.u .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.m.a .bub{background:#f3f5fa;border-bottom-left-radius:5px}
.m.a .bub b{color:var(--navy)}
.m .wide{flex:1;min-width:0;max-width:680px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sys{font-size:12.5px;color:var(--ink-3);text-align:center;margin:-4px 0 14px}

/* answer shortcuts: small, quiet, only for closed questions */
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px}
.qr button{border:1px solid var(--line);color:var(--ink-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.qr button:hover{border-color:var(--navy-3);color:var(--navy)}

/* composer */
.comp{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 14px;resize:none;max-height:160px;min-height:48px;outline:none;line-height:1.45}
.comp textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 4px rgba(44,74,138,.12)}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.45;cursor:not-allowed}

/* recommendation + description cards */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rec-h{padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#2c4a8a 0%,var(--navy) 60%);color:#fff}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink)}
.rec-h .eyebrow{color:#ffd36b}
.rec-h h2{font-size:23px;margin:3px 0 2px}
.rec-h .meta{font-size:13px;color:#c9d3ea}
.sec{padding:14px 20px;border-top:1px solid var(--line-2);font-size:14px}
.sec:first-of-type{border-top:0}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.chk{display:flex;gap:8px;padding:3px 0}
.chk i{font-style:normal;flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;background:var(--info-soft);color:var(--info)}
.chk i.w{background:var(--warn-soft);color:var(--warn)} .chk i.b{background:var(--bad-soft);color:var(--bad)}
.chk span{color:var(--ink-3);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line-2);background:#fafbfd}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn-p{background:var(--navy);color:#fff}
.btn-a{background:var(--amber);color:var(--navy)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.lnk{background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.more{padding:12px 20px;border-top:1px solid var(--line-2);font-size:13.5px;background:#fafbfd}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.ovr{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;color:#6b3a06;margin-top:8px}
.old{opacity:.6;font-size:13px;padding:10px 14px}
.sec.lead{background:#fbfaf5;border-left:3px solid var(--amber);font-size:14.5px;line-height:1.6}
.sec.chips{display:flex;flex-wrap:wrap;gap:6px}
.sec.chips span{background:var(--line-2);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.sec.brdlink{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#f6f8fd}
.docwrap{position:fixed;inset:0;z-index:50;background:rgba(10,18,40,.55);overflow:auto;padding:0 12px 40px}
.doctools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:900px;margin:0 auto;padding:12px 4px;color:#fff}
.doctools .muted{color:#c9d3ea}.doctools .sp{flex:1}
.paper{max-width:860px;margin:0 auto;background:#fff;border-radius:6px;padding:48px 56px;box-shadow:0 20px 50px rgba(0,0,0,.3);outline:none}
@media(max-width:700px){.paper{padding:24px 18px}.hide-sm{display:none}.brd .two{grid-template-columns:1fr}}
body.doc-open{overflow:hidden}
@media print{
  body{display:block;height:auto;background:#fff}
  body.doc-open>*:not(#docRoot){display:none!important}
  .docwrap{position:static;background:none;padding:0;overflow:visible}.doctools{display:none}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  .brd h2{break-after:avoid}.brd tr{break-inside:avoid}
}
.sd-h{background:var(--navy);color:#fff;padding:14px 20px}
.sd-h small{font-size:11.5px;color:#aab6d3;letter-spacing:.06em;text-transform:uppercase}
.sd-h .t{font-family:"Inter Tight";font-size:17px;font-weight:700;outline:none;margin-top:2px}
.sd [contenteditable]{outline:none;border-radius:6px}
.sd [contenteditable]:focus{background:#f6f8fd;box-shadow:0 0 0 2px rgba(44,74,138,.15)}

/* side panel */
.side{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.side{position:fixed;inset:0 0 0 auto;width:min(360px,92%);background:var(--bg);z-index:30;padding:16px;transform:translateX(100%);transition:.25s;box-shadow:-20px 0 40px rgba(0,0,0,.15)}.side.open{transform:none}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.route{font-family:"Inter Tight";font-size:18px;color:var(--navy);font-weight:700;margin-top:4px}
.prov{font-size:12px;color:var(--ink-3)}
.prog{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c544);transition:width .4s}
.fact{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px;align-items:flex-start}
.fact:first-of-type{border-top:0}
.fact .ic{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.fact.ok .ic{background:var(--ok);border-color:var(--ok)}
.fact.next .ic{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.fact .k{color:var(--ink-3);flex:none;width:112px}
.fact .v{flex:1;text-align:right;font-weight:500;word-break:break-word}
.fact:not(.ok) .v{color:var(--ink-3);font-weight:400}
.muted{color:var(--ink-3);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,40,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.15)}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer section+section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.drawer label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.seg{display:flex;background:var(--line-2);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.tgl{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.tgl input{width:18px;height:18px;accent-color:var(--navy)}
.alert{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.err{background:var(--bad-soft);color:var(--bad)}
</style>
<style id="doccss"></style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">G</div>
    <div class="brand"><b>Guided Intake</b><span>Tell us what you need. We find the right way to buy it.</span></div>
    <div class="sp"></div>
    <span class="pill"><span class="dot" id="aiDot"></span><span id="aiLabel">Offline</span></span>
    <button class="tb only-m" id="sumBtn">Summary</button>
    <button class="tb" id="newBtn">New</button>
    <button class="tb" id="cfgBtn">Rules</button>
  </div>
</header>

<div class="app">
  <section class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="qr" id="qr"></div>
    <form class="comp" id="comp">
      <textarea id="inp" rows="1" placeholder="Describe what you need…"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
  <aside class="side" id="side"></aside>
</div>
<div id="drawerRoot"></div>
<div id="docRoot"></div>

<script>
/* =========================================================
   1. CONFIGURATION
   Hosted on Vercel: the key lives in Vercel environment variables
   (GEMINI_API_KEY or GROQ_API_KEY) and never reaches the browser.
   Opened as a local file: paste a key into keys below instead.
   ========================================================= */
const CONFIG = {
  provider: "auto",                       // "auto" | "server" | "gemini" | "groq" | "offline"
  keys: { gemini: "", groq: "" },
  models: { gemini: "gemini-2.5-flash", groq: "llama-3.3-70b-versatile" },
  accessCode: "",                         // only if ACCESS_CODE is set on Vercel
  currency: "EUR",
  thresholds: { pcardMax: 2500, quickQuoteMax: 50000, materialityMin: 1000000, renewalWindowDays: 180 }
};

/* =========================================================
   2. REFERENCE DATA (mock — replace with your own)
   ========================================================= */
const CATEGORIES = [
  {id:"it-hardware", name:"IT hardware",                   type:"goods",    kw:["laptop","notebook","monitor","headset","keyboard","printer","hardware","docking","screen","smartphone"]},
  {id:"software",    name:"Software and SaaS",             type:"software", kw:["licence","license","software","saas","subscription","seats","system","platform","tool"]},
  {id:"it-services", name:"IT services and development",   type:"services", kw:["develop","implementation","integration","migration","testing","build an app"]},
  {id:"cloud",       name:"Cloud and hosting",             type:"services", kw:["cloud","hosting","aws","azure","data centre"]},
  {id:"consulting",  name:"Management consulting",         type:"services", kw:["consult","advisory","strategy","redesign","transformation","assessment","operating model"]},
  {id:"legal",       name:"Legal services",                type:"services", kw:["legal","lawyer","counsel","litigation","law firm"]},
  {id:"marketing",   name:"Marketing and events",          type:"services", kw:["event","marketing","campaign","conference","agency","offsite","dinner","sponsorship","ticket"]},
  {id:"facilities",  name:"Facilities and real estate",    type:"services", kw:["cleaning","facility","facilities","office move","maintenance","catering","security guard"]},
  {id:"contingent",  name:"External workers",             type:"contingent_labour", kw:["contractor","temp ","temporary staff","freelance","interim","day rate"]},
  {id:"market-data", name:"Market data",                   type:"software", kw:["market data","data feed","terminal","ratings data"]},
  {id:"training",    name:"Training and learning",         type:"services", kw:["training","course","workshop","coaching","certification"]},
  {id:"office",      name:"Office supplies and furniture", type:"goods",    kw:["paper","stationery","toner","chair","desk","supplies","furniture"]},
  {id:"telecom",     name:"Telecom",                       type:"services", kw:["mobile contract","telecom","network","sim card","connectivity"]}
];
const DEMAND_TYPES = {goods:"Goods", services:"Services", software:"Software", contingent_labour:"External workers"};

const CATALOGUE = [
  {id:"CAT-1001", name:"Standard laptop 14\"",        supplier:"Northwind IT",    price:1150, kw:["laptop","notebook"]},
  {id:"CAT-1002", name:"27\" monitor",                supplier:"Northwind IT",    price:240,  kw:["monitor","screen"]},
  {id:"CAT-1003", name:"Noise-cancelling headset",    supplier:"Northwind IT",    price:180,  kw:["headset","headphones"]},
  {id:"CAT-1004", name:"Smartphone, standard",        supplier:"Fabrikam Mobile", price:690,  kw:["smartphone","mobile phone","iphone"]},
  {id:"CAT-1005", name:"Docking station",             supplier:"Northwind IT",    price:210,  kw:["docking"]},
  {id:"CAT-2001", name:"Ergonomic office chair",      supplier:"Contoso Office",  price:420,  kw:["chair"]},
  {id:"CAT-2002", name:"Stationery bundle",           supplier:"Contoso Office",  price:35,   kw:["stationery","pens","toner"]},
  {id:"CAT-3001", name:"Collaboration suite licence", supplier:"Adatum Software", price:280,  kw:["collaboration licence","microsoft 365","m365"]}
];
const CONTRACTS = [
  {id:"CTR-4410", supplier:"Contoso Cloud",      category:"cloud",       title:"Cloud hosting framework",           expires:"2028-03-31", remaining:2400000},
  {id:"CTR-3122", supplier:"Lakeshore Advisory", category:"consulting",  title:"Operations consulting framework",   expires:"2027-06-30", remaining:600000},
  {id:"CTR-2087", supplier:"BrightClean",        category:"facilities",  title:"Facilities cleaning, EMEA",         expires:"2027-12-31", remaining:900000},
  {id:"CTR-5590", supplier:"Tailspin Talent",    category:"contingent",  title:"External workers MSP",              expires:"2028-01-31", remaining:5000000},
  {id:"CTR-6013", supplier:"Wingtip Legal",      category:"legal",       title:"Legal panel, commercial",           expires:"2027-09-30", remaining:350000},
  {id:"CTR-7120", supplier:"Litware Learning",   category:"training",    title:"Learning services framework",       expires:"2026-11-30", remaining:80000},
  {id:"CTR-8801", supplier:"Proseware Digital",  category:"it-services", title:"Application development framework", expires:"2027-10-31", remaining:1200000}
];
const PREFERRED = {
  "it-hardware":["Northwind IT"],"software":["Adatum Software"],"it-services":["Proseware Digital","Fourth Coffee Tech"],
  "cloud":["Contoso Cloud"],"consulting":["Lakeshore Advisory","Blue Yonder Partners"],"legal":["Wingtip Legal"],
  "marketing":["Coho Creative"],"facilities":["BrightClean"],"contingent":["Tailspin Talent"],
  "market-data":["Datum Feeds"],"training":["Litware Learning"],"office":["Contoso Office"],"telecom":["Fabrikam Mobile"]
};
const ALL_SUPPLIERS = [...new Set([...CONTRACTS.map(c=>c.supplier),...Object.values(PREFERRED).flat(),...CATALOGUE.map(c=>c.supplier)])];

/* =========================================================
   3. ROUTES — what each one is, and what must be known for it
   ========================================================= */
const CHANNELS = {
  catalogue: {name:"Catalogue order",            days:"1–3",   doc:"Request summary"},
  pcard:     {name:"P-card purchase",            days:"1–2",   doc:"Request summary"},
  contract:  {name:"Contract call-off",          days:"3–7",   doc:"Scope of work"},
  renewal:   {name:"Contract renewal",           days:"10–20", doc:"Renewal brief"},
  quote:     {name:"Quick quote",                days:"7–15",  doc:"Service description"},
  sourcing:  {name:"Sourcing project",           days:"30–60", doc:"Service description"},
  contingent:{name:"External workers request",   days:"10–20", doc:"Role profile"}
};

// Facts the chat can collect. q = plain question, ex = example, why = optional reason, choices = shortcuts for closed questions.
const DELIV_EX = {
  "consulting":"a current-state process map, a target process design and a rollout plan",
  "it-services":"a tested software release, technical documentation and a handover to support",
  "marketing":"venue and catering, the agenda and guest management",
  "facilities":"a cleaning schedule, monthly service reports and a named site contact",
  "legal":"a written legal opinion and draft contract wording",
  "training":"three course sessions for 20 people, course materials and attendance records",
  "cloud":"a hosting environment with 99.9% uptime and migration support",
  "telecom":"50 mobile contracts with data bundles and a support line",
  "software":"user licences, set-up and training for the admin team",
  "market-data":"a real-time data feed for two desks with an API",
  "_":"the main result you expect, for example a report, a working system or a delivered service"
};
const FACTS = {
  need:           {label:"What you need",   q:()=>"Could you tell me a bit more about what you need?", ex:()=>"For example: \"an agency to run a client dinner for 40 people in March\"."},
  item:           {label:"Item",            q:f=>f.demand_type==="services"?"What exactly are you buying?":"Which item or product do you need?", ex:f=>f.demand_type==="software"?"For example: \"a project-tracking tool for 25 users\".":f.demand_type==="services"?"For example: \"one ticket for the Procurement Leaders conference\".":"For example: \"a 27-inch monitor\" or a product link."},
  quantity:       {label:"Quantity",        q:f=>f.demand_type==="software"?"How many users or licences?":"How many do you need?", ex:()=>""},
  value:          {label:"Budget",          q:()=>"Roughly what will this cost in total?", ex:f=>`A rough figure is fine${f.duration?`, for the full ${f.duration}`:""}. If you don't know, just say so and I'll estimate it.`, why:()=>"The amount decides how much competition is needed."},
  deliverables:   {label:"Deliverables",    q:f=>f.demand_type==="contingent_labour"?"What will they work on?":"What should the supplier deliver?", ex:f=>f.demand_type==="contingent_labour"?"For example: \"building the new payments API with our team\".":`For example: ${DELIV_EX[f.category]||DELIV_EX._}.`},

  needed_by:      {label:"Start / delivery",q:f=>["goods","software"].includes(f.demand_type)?"When do you need it?":"When should it start?", ex:()=>"A date or \"as soon as possible\" is fine."},
  location:       {label:"Location",        q:f=>["goods","software"].includes(f.demand_type)?"Where should it be delivered?":"Where will the work happen?", ex:f=>["goods","software"].includes(f.demand_type)?"An office or building is enough.":"", choices:f=>["goods","software"].includes(f.demand_type)?null:["On site","Remote, same country","Remote, other country"]},
  supplier:       {label:"Supplier",        q:f=>S.det&&S.det.route==="contract"&&S.det.contract&&!hasSupplier(f)?`We already have the ${S.det.contract.title} with ${S.det.contract.supplier} for this kind of work. Are you happy to use them?`:"Do you already have a supplier in mind?", ex:f=>S.det&&S.det.route==="contract"&&!hasSupplier(f)?"That's usually the quickest way, because no new competition is needed.":`It's fine to say no.${(PREFERRED[f.category]||[]).length?` Our preferred ones for this are ${PREFERRED[f.category].join(" and ")}.`:""}`, choices:f=>S.det&&S.det.route==="contract"&&!hasSupplier(f)?["Yes, use them","No, someone else"]:["No preference"]},
  supplier_reason:{label:"Why this supplier",q:f=>`Why ${f.supplier} in particular?`, ex:()=>"For example: they built the current system, or nobody else offers it.", why:()=>"Without a reason, a purchase this size needs competing offers."},
  personal_data:  {label:"Personal data",   q:()=>"Will the supplier see personal or client data?", ex:()=>"", why:()=>"If so, a data protection review is added.", choices:["Yes","No","Not sure"]},
  ict_outsourcing:{label:"Runs IT for us",  q:()=>"Will the supplier run or host any IT system or business process for us?", ex:()=>"For example, hosting an application or running payroll.", choices:["Yes","No","Not sure"]},
  budget_approved:{label:"Budget approved", q:()=>"Is the budget already approved?", ex:()=>"", why:()=>"Sourcing only starts once the budget is confirmed.", choices:["Yes","Not yet","Partly"]},
  role:           {label:"Role",            q:()=>"What role do you need to fill?", ex:()=>"For example: \"senior Java developer\" or \"interim project manager\"."},
  headcount:      {label:"People",          q:()=>"How many people?", ex:()=>"", choices:["1","2","3","More"]},
  skills:         {label:"Key skills",      q:()=>"What skills or experience must they have?", ex:()=>"For example: \"Java 17, Spring Boot, payments experience\"."},
  day_rate:       {label:"Rate or budget",  q:()=>"Do you have a day rate or total budget in mind?", ex:()=>"For example: \"around €700 a day\" or \"€150k in total\". \"Not sure\" is fine."},
  system_access:  {label:"System access",   q:()=>"Will they need access to our systems or client data?", ex:()=>"", choices:["Yes","No","Not sure"]},
  renewal_change: {label:"Changes",         q:()=>"Does anything change compared with the current contract?", ex:()=>"For example: \"same scope, 20% more volume\" or \"no changes\"."},
  contract_ok:    {label:"Use existing contract", q:()=>S.det&&S.det.contract?`We already have the ${S.det.contract.title} with ${S.det.contract.supplier} for this kind of work. Would you like to use it?`:"Would you like to use the existing contract?", ex:()=>"That's usually the quickest way, because no new competition is needed.", choices:["Yes, use it","No, look wider"]},
  // ---- sourcing ----
  background:     {label:"Why now",         q:()=>"What's behind this need? Why now?", ex:()=>"For example: a new regulation, a growing team, or a system reaching end of life.", why:()=>"It helps suppliers propose the right approach."},
  acceptance:     {label:"Success looks like", q:()=>"How will you know the work has been done well?", ex:f=>f.demand_type==="contingent_labour"?"":`For example: ${f.category==="consulting"?"\"the new process is live in all countries and onboarding takes under 5 days\"":f.category==="marketing"?"\"the event runs on budget and guest feedback averages 4 out of 5\"":"\"it is live, tested and signed off by the business owner\""}.`},
  evaluation_priority:{label:"Most important", q:()=>"When we compare offers, what matters most to you?", ex:()=>"", choices:["Best price","Best quality","Fastest delivery","A balance"]},
  supplier_requirements:{label:"Supplier must have", q:()=>"Must the supplier have any certifications or specific experience?", ex:f=>["it-services","cloud","software","market-data"].includes(f.category)?"For example: ISO 27001 certification, or experience in financial services.":"For example: at least three similar projects, or a team that speaks German."},
  current_supplier:{label:"Today's provider", q:()=>"Is this replacing or continuing something you have today?", ex:()=>"If so, who provides it now? \"No, it's new\" is fine."},
  volume:         {label:"Volume",          q:f=>f.category==="training"?"How many people will take part?":f.category==="facilities"?"How many sites or how much floor space?":f.category==="telecom"?"How many users or lines?":"How many people, sites or users is this for?", ex:()=>""},
  support_needs:  {label:"Install & support", q:()=>"Do you need installation, warranty or ongoing support with it?", ex:()=>"For example: on-site installation and a 3-year warranty."},
  // ---- risk ----
  data_details:   {label:"Data involved",   q:()=>"What kind of data will they see, and where would it be stored?", ex:()=>"For example: \"employee names and salaries, stored in the EU\".", why:()=>"This shapes the data protection review."},
  criticality:    {label:"If it stopped",   q:()=>"If this stopped working for a day, what would happen?", ex:()=>"For example: \"clients couldn't log in\" or \"a short delay, nothing serious\".", why:()=>"It tells us how critical the supplier is."},
  subcontracting: {label:"Subcontractors",  q:()=>"Is the supplier likely to use subcontractors or teams in other countries?", ex:()=>"", choices:["No","Yes","Not sure"]},
  // ---- contract ----
  pricing_model:  {label:"Payment model",   q:()=>"How would you prefer to pay?", ex:()=>"A fixed price suits a clear scope, a day rate suits flexible work, and a monthly fee suits an ongoing service.", choices:["Fixed price","Day rate","Monthly fee","Not sure"]},
  service_levels: {label:"Service levels",  q:()=>"Which service levels matter to you?", ex:f=>f.category==="facilities"?"For example: daily cleaning before 8am and issues fixed within 24 hours.":"For example: 99.9% availability, a response within 4 hours, or a monthly report."},
  ip_ownership:   {label:"Who owns the work", q:()=>"Should we own what the supplier creates, such as designs, code or materials?", ex:()=>"", choices:["Yes, we own it","Shared use is fine","Not sure"]},
  performance:    {label:"Supplier so far", q:f=>`How has ${hasSupplier(f)?f.supplier:"the supplier"} performed so far?`, ex:()=>"Anything to fix in the renewal is useful to know.", choices:["Very well","Okay","Some issues"]},
  cost_centre:    {label:"Cost centre",     q:()=>"Last one: which cost centre or budget pays for this?", ex:()=>"A cost centre number or the budget owner's name is enough."}
};
const GOODSLIKE = f => f.demand_type==="goods" || f.demand_type==="software";
// relevance rules: an extra question is only asked when it matters
const REL = {
  pd:       f => yes(f.personal_data) || yes(f.system_access),
  techy:    f => yes(f.ict_outsourcing) || ["cloud","it-services","software","market-data","telecom"].includes(f.category),
  ongoing:  f => yes(f.ict_outsourcing) || ["facilities","cloud","telecom","software","market-data"].includes(f.category),
  creates:  f => ["it-services","consulting","marketing"].includes(f.category) || (f.category==="software" && /build|develop|custom/.test(userText())),
  volume:   f => ["training","facilities","telecom","marketing"].includes(f.category),
  subcon:   f => yes(f.personal_data) || yes(f.ict_outsourcing),
};
function requiredFor(route, f){
  const g=GOODSLIKE(f), sw=f.demand_type==="software", on=(c,k)=>c?[].concat(k):[];
  const risk = () => ["personal_data", ...on(REL.pd(f),"data_details")];
  switch(route){
    case "catalogue":  return ["item","quantity","needed_by","location","cost_centre"];
    case "pcard":      return ["item","value","supplier","needed_by"];
    case "contract":   return [...on(!contractAgreed(f),"contract_ok"),
                               ...(g ? ["item","quantity","value","needed_by","location"]
                                     : ["deliverables","value","duration","needed_by","location",...risk(),"acceptance"]),"cost_centre"];
    case "renewal":    return ["value","duration","renewal_change","performance",...risk(),...on(REL.ongoing(f),"service_levels"),"cost_centre"];
    case "quote":      return g ? ["item","quantity","value","needed_by","location","support_needs",...on(sw,risk()),"supplier","cost_centre"]
                                : ["deliverables","value","duration","needed_by","location",...on(REL.volume(f),"volume"),...risk(),"acceptance","pricing_model","supplier","cost_centre"];
    case "sourcing":   return g
      ? ["item","quantity","background","value","needed_by","location","support_needs",
         ...on(sw,[...risk(),"ict_outsourcing","criticality",...on(REL.subcon(f),"subcontracting"),"service_levels","pricing_model"]),
         "supplier_requirements","current_supplier","evaluation_priority","supplier",...on(hasSupplier(f),"supplier_reason"),"budget_approved","cost_centre"]
      : ["deliverables","background","value","duration","needed_by","location",...on(REL.volume(f),"volume"),
         ...risk(),"ict_outsourcing",...on(REL.techy(f),"criticality"),...on(REL.subcon(f),"subcontracting"),...on(REL.ongoing(f),"service_levels"),
         ...on(REL.creates(f),"ip_ownership"),"acceptance","pricing_model","supplier_requirements","current_supplier","evaluation_priority",
         "supplier",...on(hasSupplier(f),"supplier_reason"),"budget_approved","cost_centre"];
    case "contingent": return ["role","deliverables","headcount","skills","duration","needed_by","location","day_rate","system_access",...on(REL.pd(f),"data_details"),"cost_centre"];
  }
  return [];
}

  volume:null,support_needs:null,data_details:null,criticality:null,subcontracting:null,pricing_model:null,service_levels:null,ip_ownership:null,performance:null,cost_centre:null,role:null,headcount:null,skills:null,day_rate:null,system_access:null,renewal_change:null,wants_renewal:null};
const S = fresh();

/* =========================================================
   5. RULES ENGINE (deterministic)
   ========================================================= */
const catById = id => CATEGORIES.find(c=>c.id===id) || {id, name:id||"–", type:"services"};
const known = v => v!==null && v!==undefined && v!=="";
const contractAgreed = f => f.contract_ok===true || (S.det && S.det.contract && hasSupplier(f) && String(f.supplier).toLowerCase().includes(S.det.contract.supplier.toLowerCase().split(" ")[0]));
const hasSupplier = f => known(f.supplier) && !/^(none|no|no preference|not sure|n\/a)$/i.test(String(f.supplier).trim());
const yes = v => v===true || /^y/i.test(String(v));
const userText = () => " "+S.msgs.filter(m=>m.role==="user").map(m=>m.text).join(" ").toLowerCase()+" ";
const catalogueMatches = () => { const t=userText(); return CATALOGUE.filter(i=>i.kw.some(k=>t.includes(k))); };
const daysTo = d => (new Date(d) - new Date())/864e5;

function contractFor(f){
  if(f.decline_contract) return null;
  const today=new Date(), list=CONTRACTS.filter(c=>c.category===f.category && new Date(c.expires)>today);
  if(!hasSupplier(f)) return list[0]||null;
  const s=String(f.supplier).toLowerCase();
  return list.find(c=>c.supplier.toLowerCase().includes(s)||s.includes(c.supplier.toLowerCase()))||null;
}

function determine(){
  const f=S.f, T=CONFIG.thresholds, v=known(f.value)?Number(f.value):null;
  const risk = yes(f.personal_data)||yes(f.ict_outsourcing)||yes(f.critical_service)||yes(f.offshore)||yes(f.system_access);
  const cat = catalogueMatches(), ctr = contractFor(f);
  let route, why;
  if(f.demand_type==="contingent_labour"){ route="contingent"; why="You need external people, so this goes through the external workers channel and our managed service provider."; }
  else if(cat.length && GOODSLIKE(f)){ route="catalogue"; why=`${cat.map(i=>i.name).join(" and ")} ${cat.length>1?"are":"is"} in the catalogue, so you can order directly at the agreed price.`; }
  else if(ctr && hasSupplier(f) && (f.wants_renewal || daysTo(ctr.expires)<T.renewalWindowDays || (v!=null && v>ctr.remaining))){
    route="renewal";
    why = daysTo(ctr.expires)<T.renewalWindowDays ? `Your ${ctr.title} with ${ctr.supplier} ends on ${fmtDate(ctr.expires)}, so this needs a renewal rather than a new purchase.`
        : v!=null && v>ctr.remaining ? `The ${ctr.title} with ${ctr.supplier} has only ${money(ctr.remaining)} left, so it needs to be extended.`
        : `You want to continue with ${ctr.supplier} under the ${ctr.title}, so the contract is renewed or extended.`;
  }
  else if(ctr){ route="contract"; why=`The ${ctr.title} with ${ctr.supplier} already covers this, with ${money(ctr.remaining)} left until ${fmtDate(ctr.expires)}. No new competition is needed.`; }
  else if(v!=null && v<=T.pcardMax && !risk){ route="pcard"; why=`At ${money(v)} it is under the ${money(T.pcardMax)} card limit and carries no data or IT risk.`; }
  else if(v!=null && v<=T.quickQuoteMax){ route="quote"; why=`At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is under the ${money(T.quickQuoteMax)} limit for a full sourcing event, and no contract covers it. Three quotes are enough.`; }
  else { route="sourcing"; why = v==null ? "The value is not known yet, so I assume a full sourcing event until it is." : `At ${money(v)}${f.value_is_estimate?" (estimated)":""} it is above the ${money(T.quickQuoteMax)} quick-quote limit and no contract covers it, so suppliers compete in a sourcing event.`; }
  return {route, why, contract:ctr, catalogue:cat, controls:controlsFor(route,ctr), steps:nextSteps(route,cat,ctr)};
}

function controlsFor(route, ctr){
  const f=S.f, T=CONFIG.thresholds, v=known(f.value)?Number(f.value):null, out=[];
  if(route==="sourcing") out.push(["i","Approval to source","Budget owner confirms need and budget before the event starts."]);
  if(route==="contract") out.push(["i","Confirm contract use","Contract owner confirms the scope fits."]);
  if(route==="renewal")  out.push(["i","Renewal review","Contract owner and procurement agree terms before expiry."]);
  if(yes(f.personal_data)||yes(f.system_access)) out.push(["w","Data protection review","The supplier will see personal or client data."]);
  if(yes(f.ict_outsourcing)||yes(f.critical_service)) out.push(["w","ICT and outsourcing assessment","The supplier runs IT or a process for us."]);
  if(yes(f.offshore)||/other country/i.test(f.location||"")) out.push(["w","Offshoring check","Work happens outside your country."]);
  if(yes(f.subcontracting)) out.push(["w","Subcontractor check","The supplier may use subcontractors."]);
  if(["contingent","contract","quote","sourcing","renewal"].includes(route) && /on.?site|office/i.test(f.location||"") && f.demand_type!=="goods") out.push(["i","Site access","Building access is arranged before the start."]);
  if(v!=null && v>=T.materialityMin) out.push(["w","Material spend review",`Value is ${money(T.materialityMin)} or more.`]);
  if(hasSupplier(f) && ["quote","sourcing","pcard"].includes(route) && !(PREFERRED[f.category]||[]).some(p=>p.toLowerCase()===String(f.supplier).toLowerCase()))
    out.push(["b","Non-preferred supplier",`${f.supplier} is not a preferred supplier for this category.`]);
  if(route==="sourcing" && known(f.supplier_reason) && hasSupplier(f)) out.push(["b","Single-source justification","You asked for one named supplier. Procurement checks the reason."]);
  if(["contract","renewal","quote","sourcing","contingent"].includes(route) && f.demand_type!=="goods") out.push(["i","Risk questionnaire, pre-filled","Answers come from this conversation. You only confirm them."]);
  return out;
}
function nextSteps(route, cat, ctr){
  const f=S.f;
  switch(route){
    case "catalogue": return [`Add ${cat.map(i=>i.name).join(" and ")} to your basket${known(f.quantity)?` (${f.quantity})`:""}.`, `Delivery to ${f.location||"your office"}${known(f.needed_by)?`, needed ${f.needed_by}`:""}.`, "Submit. Standard items go straight through."];
    case "pcard":     return [`Check that ${hasSupplier(f)?f.supplier:"the supplier"} accepts card payment.`, "Pay with your purchasing card.", "Upload the receipt within 5 working days."];
    case "contract":  return [`A call-off is raised against ${ctr.id} with ${ctr.supplier}.`, "The scope of work from this conversation is attached.", "The contract owner confirms, then the order goes out."];
    case "renewal":   return [`Procurement contacts ${ctr.supplier} and the contract owner to agree terms.`, "If scope or price change a lot, a short market check may be added.", `The extension is signed before ${fmtDate(ctr.expires)}.`];
    case "quote":     return [`Ask at least 3 suppliers for a quote${(PREFERRED[f.category]||[]).length?`, ideally including ${PREFERRED[f.category].join(" and ")}`:""}.`, "Send them the service description so the quotes compare like for like.", "Raise the request with the chosen quote attached."];
    case "sourcing":  return ["Submit. A sourcing project is created with the service description attached.", "A buyer contacts you within 2 working days to agree timeline and evaluation team.", "Risk and supplier checks run in parallel with the event."];
    case "contingent":return ["The role profile goes to our managed service provider.", "They shortlist candidates for you to interview.", "Onboarding and system access follow after selection."];
  }
  return [];
}

function refresh(){
  const f=S.f;
  if(!known(f.category)){ S.det=null; S.missing=["need"]; return; }
  // catalogue items: fill item and an estimated value automatically
  S.det = determine();
  if(S.det.route==="catalogue"){
    if(!known(f.item)) f.item = S.det.catalogue.map(i=>i.name).join(", ");
    if(known(f.quantity) && !known(f.value)){ f.value = S.det.catalogue[0].price*(parseInt(f.quantity)||1); f.value_is_estimate=true; }
  }
  if(S.det.route==="contingent" && !known(f.value) && known(f.day_rate)){ const v=parseMoney(f.day_rate); if(v) f.value = v<5000 ? v*20*monthsOf(f.duration) * (parseInt(f.headcount)||1) : v; if(v) f.value_is_estimate=v<5000; }
  S.det = determine();
  const req = requiredFor(S.det.route, f);
  const needsValue = !["catalogue","contingent"].includes(S.det.route);
  let order = needsValue && !known(f.value) ? ["value",...req.filter(k=>k!=="value")] : req;
  if(order.includes("contract_ok")) order=["contract_ok",...order.filter(k=>k!=="contract_ok")];
  S.missing = order.filter(k=>!known(f[k]));
}
const monthsOf = d => { const m=String(d||"").match(/(\d+)\s*(?:-|–|to)?\s*(\d+)?\s*(month|week|year)/i); if(!m) return 6; const n=Number(m[2]||m[1]); return /week/i.test(m[3])?n/4.3:/year/i.test(m[3])?n*12:n; };

   6. AI CLIENT
   ========================================================= */
let SERVER=null;
const aiReady = () => CONFIG.provider==="server" ? !!SERVER : (["gemini","groq"].includes(CONFIG.provider) && !!CONFIG.keys[CONFIG.provider]);
const providerLabel = () => CONFIG.provider==="server" ? ({gemini:"Gemini",groq:"Groq",mistral:"Mistral"}[(SERVER&&SERVER.last)||(SERVER&&SERVER.provider)]||"Server") : CONFIG.provider==="gemini"?"Gemini":"Groq";
async function detectServer(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{ const r=await fetch("/api/llm"); if(!r.ok) return; const d=await r.json(); if(d&&d.ok) SERVER=d; }catch(e){}
}
function resolveProvider(){
  if(CONFIG.provider!=="auto") return;
  CONFIG.provider = SERVER ? "server" : CONFIG.keys.gemini ? "gemini" : CONFIG.keys.groq ? "groq" : "offline";
}
async function callLLM(system, history, retried){
  const p=CONFIG.provider, key=CONFIG.keys[p], model=CONFIG.models[p];
  if(p==="server"){
    const r=await fetch("/api/llm",{method:"POST",signal:AbortSignal.timeout(58000),headers:{"Content-Type":"application/json","x-access-code":CONFIG.accessCode||""},body:JSON.stringify({system,history})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401) throw new Error("Access code missing or wrong. Enter it under Rules.");
    // short per-minute limit: wait the few seconds the provider asks for, then try once more
    if(r.status===429 && (retried||0)<2 && d.retryAfter && d.retryAfter<=20){ await new Promise(res=>setTimeout(res,(d.retryAfter+1)*1000)); return callLLM(system, history, (retried||0)+1); }
    if(!r.ok){ const e=new Error(d.error||`Server error ${r.status}`); e.quota=r.status===429||!!d.quota; throw e; }
    if(SERVER && d.provider) SERVER.last=d.provider;
    return parseJSON(d.text);
  }
  if(p==="gemini"){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json"},body:JSON.stringify({
      systemInstruction:{parts:[{text:system}]},
      contents:history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
      generationConfig:{temperature:0.4,responseMimeType:"application/json",...(/flash/i.test(model)?{thinkingConfig:{thinkingBudget:0}}:{})}})});
    const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Gemini error ${r.status}`);
    return parseJSON((d.candidates?.[0]?.content?.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join(""));
  }
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",signal:AbortSignal.timeout(30000),headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},
    body:JSON.stringify({model,temperature:0.4,response_format:{type:"json_object"},messages:[{role:"system",content:system},...history]})});
  const d=await r.json(); if(!r.ok) throw new Error(d?.error?.message||`Groq error ${r.status}`);
  return parseJSON(d.choices?.[0]?.message?.content);
}
function parseJSON(t){ t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim(); try{return JSON.parse(t);}catch(e){const m=t.match(/\{[\s\S]*\}/); if(m){ try{return JSON.parse(m[0]);}catch(e2){} } return {_raw:true, reply:t}; } }

/* ---------- conversation prompt ---------- */
function chatSystem(){
  return `You are the intake assistant of a corporate procurement team. You talk with business colleagues who want to buy something.
You only have a conversation. Fixed rules decide the buying route and which facts are needed. Each turn you get the current state, including the ordered list "still_needed".

Your job each turn:
1. Read the user's latest message and record EVERY fact it contains in "facts", for any key in the list below, not only the one you asked about.
   Business users often put many details into one message (budget, dates, place, data, supplier, success criteria). Capture all of them so they are never asked again. Use null for unknown. Never invent facts.
   If they say they don't know the value, estimate a realistic total in ${CONFIG.currency} (€, never £ or $), set value_is_estimate true, and tell them your estimate and its basis.
   Any answer counts, including "no", "not sure" or "none". Record it.
2. Write "reply":

      const out = await callLLM(chatSystem(), [{role:"user",content:`${transcript?`Conversation so far:\n${transcript}\n\n`:""}Latest user message:\n${text}${stateBlock()}\n\nAnswer with the JSON object only.`}]);

  } else {
    let next=S.missing[0];

const NUM_KEYS=["value","quantity","headcount"];
function normFact(k,v){

function parseMoney(s){
  const str=String(s).toLowerCase().replace(/(\d),(\d{3})/g,"$1$2");

    if(!m[1] && !unit && /^(people|persons?|users?|months?|weeks?|days?|years?|hours?|guests?|licen[cs]es?|seats?|laptops?|pcs|units?|x)$/.test(after)) continue;

    if(score>bestScore){ bestScore=score; best=m; }

}

  // stakeholders

  const scope_out=["Anything not listed under in scope", ...({consulting:["Implementing the new design, unless agreed separately (proposed)"],"it-services":["Support after handover, unless agreed separately (proposed)"],

  return {
    background: [g("background")&&cap(g("background")).replace(/\.?$/,"."), g("current_supplier")&&g("current_supplier")!=="None"?`Today this is provided by ${g("current_supplier")}.`:g("current_supplier")==="None"?"This is a new need.":null].filter(Boolean).join(" "),
    objectives: [g("deliverables")?`Get ${lf(g("deliverables"))}${g("needed_by")?` from ${g("needed_by")}`:""}.`:f.demand_type==="software"?`Have ${lf(g("item")||c.name)} live${g("quantity")?` for ${fmtN(g("quantity"))} users`:""}${g("needed_by")?` by ${g("needed_by")}`:""}.`:goods?`Have ${g("quantity")?fmtN(g("quantity"))+" × ":""}${lf(g("item")||c.name)} available${g("needed_by")?` by ${g("needed_by")}`:""}.`:cont?`Fill ${g("headcount")||1} ${lf(g("role")||"role")} position(s) on time.`:null,
                 g("background")?`Address the need: ${lf(g("background")).replace(/\.$/,"")}.`:null, known(f.value)?`Stay within the budget of ${money(Number(f.value))}.`:null].filter(Boolean),

/* ---------- AI prompt for the summary and the full requirements document ---------- */
const DOC_SYSTEM = () => `You write two things for a corporate procurement request, based on the conversation and the facts:
1. "summary": the SERVICE DESCRIPTION SUMMARY. One holistic paragraph of 150 to 230 words (60 to 100 for a simple catalogue or card purchase) in plain English that brings everything together:
   what is needed and why, scope and deliverables, timing, location, volume, budget and payment, how success is judged, the risk profile (data, systems, criticality, subcontracting, offshoring),
   supplier situation, cost centre and the recommended route. Someone who reads only this paragraph must understand the whole request.
2. "brd": the BUSINESS REQUIREMENTS DOCUMENT content, complete enough for the sourcing, risk and contract teams to work from without asking again.
Rules: use every fact and every detail from the conversation. Never invent names, numbers or dates. Where something important is unknown, put it in open_points.
Money: the currency is ${CONFIG.currency} (€). Quote the value exactly as given in value_display. Never recalculate or re-estimate amounts.
Do not use internal labels such as "contingent labour" or category ids; use plain words. Do not rate the overall risk level yourself; describe the facts.
You may propose sensible out-of-scope items, milestones, assumptions and evaluation weights that follow from the facts; mark proposals with "(proposed)".
Requirements: clear, testable, one per line, written as "The supplier shall ..." or as a plain statement. Types: Service, Supply, Timing, Location, Service level, Acceptance, Data protection,
Security, Resilience, Compliance, Supplier, Commercial, Contract, Resourcing, Skills. Priority: Must, Should or Could. 8 to 20 requirements.
Plain language, short sentences, no marketing words, no jargon.
Return JSON only:
{"title":"short title","summary":"",
 "brd":{"background":"","objectives":[""],"success_criteria":[""],"scope_in":[""],"scope_out":[""],
  "requirements":[{"type":"","text":"","priority":"Must"}],"deliverables":[""],"milestones":[{"milestone":"","timing":""}],
  "timeline":"","location":"","volumes":"","service_levels":[""],"supplier_requirements":[""],"risk_and_compliance":[""],
  "commercials":[""],"evaluation":[{"criterion":"","weight":"40%"}],"stakeholders":[{"role":"","who":""}],
  "assumptions":[""],"dependencies":[""],"open_points":[""]}}`;

const nonEmpty = v => Array.isArray(v) ? v.filter(x=>x&&(typeof x!=="object"||Object.values(x).some(Boolean))).length>0 : !!(v&&String(v).trim());
function mergeBRD(base, ai){
  const out={...base};
  if(ai && typeof ai==="object") for(const [k,v] of Object.entries(ai)) if(nonEmpty(v) && k in base) out[k]=v;
  if(Array.isArray(out.requirements)) out.requirements=out.requirements.filter(r=>r&&r.text).map((r,i)=>({id:`BR-${String(i+1).padStart(2,"0")}`,type:r.type||"Requirement",text:r.text,priority:r.priority||"Must"}));
  // facts the rules depend on are never dropped by the AI version
  out.risk_and_compliance=[...new Set([...(out.risk_and_compliance||[]),...(base.risk_and_compliance||[]).filter(x=>!(out.risk_and_compliance||[]).length)])];
  return out;
}

async function buildDoc(){
  const key=JSON.stringify(S.f)+S.det.route;
  if(S.sd && S.docKey===key){ S.msgs.push({role:"assistant",kind:"sd"}); return; }
  const base=offlineSummary();
  let ai=null;
  if(aiReady()){
    try{
      const convo=S.msgs.filter(m=>!m.kind).map(m=>`${m.role==="user"?"User":"Assistant"}: ${m.text}`).join("\n");
      ai=await callLLM(DOC_SYSTEM(),[{role:"user",content:`Conversation:\n${convo}\n\nFacts: ${JSON.stringify({...cleanFacts(), value_display: known(S.f.value)?money(Number(S.f.value))+(S.f.value_is_estimate?" (estimate)":""):"unknown"})}\nCategory: ${catById(S.f.category).name}\n`+
        `Recommended route: ${CHANNELS[S.det.route].name}. ${S.det.why}\nChecks triggered: ${S.det.controls.map(c=>c[1]).join(", ")||"none"}\nExisting contract: ${S.det.contract?`${S.det.contract.title} with ${S.det.contract.supplier}`:"none"}\nPreferred suppliers: ${(PREFERRED[S.f.category]||[]).join(", ")||"none"}`}]);
      if(!ai || !ai.summary) throw new Error("empty");
    }catch(e){ ai=null; S.msgs.push({role:"assistant",kind:"sys",text:"The AI couldn't write the documents just now, so they are built from your answers."}); }
  }
  S.sd = {title:(ai&&ai.title)||base.title, summary:guardSummary(ai&&ai.summary)||base.summary, brd:mergeBRD(offlineBRD(base.risk), ai&&ai.brd), _ai:!!ai, _date:new Date()};
  S.docKey=key; S.brdEdited=null;
  S.msgs.push({role:"assistant",kind:"sd"});
}
// hard checks on the AI summary: right currency, the agreed total, no risk verdicts of its own
function guardSummary(t){
  if(!t || typeof t!=="string") return null;
  if(/£|\$\s?\d|\bUSD\b|\bGBP\b/.test(t)) return null;
  t=t.split(/(?<=[.!?])\s+/).filter(x=>!/\brisk (?:profile|level|rating)\b[^.]*\b(?:is|as|considered|assessed|rated)\b/i.test(x)).join(" ");
  t=t.replace(/(\d[\d,.]*)\s*EUR\b/g,(m,n)=>"€"+n);
  if(known(S.f.value)){ const amt=money(Number(S.f.value)); if(!t.includes(amt)) t=t.replace(/\s*$/,"")+` The ${S.f.value_is_estimate?"estimated ":""}total value is ${amt}.`; }
  return t;
}
const cleanFacts = () => Object.fromEntries(Object.entries(S.f).filter(([k,v])=>known(v)&&k!=="decline_contract").map(([k,v])=>[k,v===true?"yes":v===false?"no":v]));

async function refineSD(text){
  S.msgs.push({role:"user",text}); S.busy=true; render();
  try{ const d=await callLLM(DOC_SYSTEM(),[{role:"user",content:`Current summary and requirements document: ${JSON.stringify({title:S.sd.title,summary:S.sd.summary,brd:S.sd.brd})}\nChange request: ${text}\nReturn the full updated JSON in the same shape. Keep the summary holistic.`}]);
       S.sd={...S.sd,title:d.title||S.sd.title,summary:d.summary||S.sd.summary,brd:mergeBRD(S.sd.brd,d.brd)}; S.brdEdited=null;
       S.msgs.push({role:"assistant",text:"Done, both the summary and the requirements document are updated."}); S.msgs.push({role:"assistant",kind:"sd"}); }
  catch(e){ S.msgs.push({role:"assistant",kind:"sys",text:"The AI couldn't update it just now. You can edit the text directly."}); }
  S.busy=false; render();
}
function submit(){

  const id="REQ-"+Math.floor(1e5+Math.random()*9e5), ch=CHANNELS[S.override||S.det.route].name;

    ${S.showMore?`<div class="more">
      <label class="muted">Use a different route</label>
      <select class="inp" id="ovr" style="margin-top:6px"><option value="">Keep ${esc(c.name)}</option>${Object.entries(CHANNELS).filter(([k])=>k!==R.route).map(([k,v])=>`<option value="${k}" ${S.override===k?"selected":""}>${v.name}</option>`).join("")}</select>
      ${ovr?`<div class="ovr">${faster[S.override]<faster[R.route]?"This skips the standard route. It adds an exception approval and a procurement review, about 7 to 12 extra working days.":"A stricter route than needed. Allowed, but slower."}<textarea class="inp" id="just" rows="2" style="margin-top:8px" placeholder="Why does the standard route not work?"></textarea></div>`:""}
      <div style="margin-top:10px"><button class="lnk" data-act="json">Download the request as JSON</button></div>
    </div>`:""}
  </div>`;
}
function sdHTML(){
  const d=S.sd, f=S.f, ch=CHANNELS[S.override||S.det.route];
  const chips=[ch.name, known(f.value)&&money(Number(f.value))+(f.value_is_estimate?" est.":""), f.needed_by&&f.needed_by!=="Not given"&&`From ${f.needed_by}`, f.duration&&f.duration!=="Not given"&&f.duration, f.location&&f.location!=="Not given"&&f.location].filter(Boolean);
  const n=(d.brd.requirements||[]).length;
  return `<div class="card sd"><div class="sd-h"><small>Service description summary · click the text to edit</small><div class="t" contenteditable data-sd="title">${esc(d.title||"Untitled")}</div></div>
    <div class="sec lead"><div contenteditable data-sd="summary">${esc(d.summary)}</div></div>
    <div class="sec chips">${chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
    <div class="sec brdlink"><div><b>Business requirements document</b><br><span class="muted">${n} requirements, risk and compliance, commercial terms, evaluation, approvals${S.sd._ai?"":" · built from your answers"}</span></div>
      <button class="btn btn-a" data-act="brd">Open document</button></div>
    <div class="acts">${S.submitted?`<span class="muted">Submitted as <b>${esc(S.submitted)}</b></span>`:`<button class="btn btn-p" data-act="submit">Looks right, submit</button>`}
      <button class="lnk" data-act="copy">Copy summary</button><span class="muted">Something to change? Just tell me.</span></div></div>`;
}
function sdText(){ return `${S.sd.title}\n\n${S.sd.summary}`; }

/* ---------- business requirements document ---------- */
const DOC_CSS=`.brd{font-family:Inter,Arial,sans-serif;color:#141b2d;font-size:13.5px;line-height:1.55}
.brd h1{font-family:"Inter Tight",Arial,sans-serif;font-size:24px;margin:0 0 2px;color:#0f2147}
.brd .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a5d00;font-weight:700}
.brd h2{font-family:"Inter Tight",Arial,sans-serif;font-size:15.5px;color:#0f2147;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid #f2a900}
.brd h3{font-size:13px;margin:12px 0 4px;color:#4a5470}
.brd p{margin:0 0 8px}.brd ul{margin:0 0 8px;padding-left:20px}.brd li{margin:2px 0}
.brd table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12.8px}
.brd th{background:#0f2147;color:#fff;text-align:left;padding:7px 9px;font-weight:600}
.brd td{border-bottom:1px solid #e4e7ef;padding:7px 9px;vertical-align:top}
.brd table.kv td:first-child{width:34%;color:#4a5470;background:#f8f9fc;font-weight:500}
.brd .lead{background:#fbfaf5;border-left:3px solid #f2a900;padding:10px 14px;margin:6px 0 10px}
.brd .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.brd .pri-Must{color:#b42318;font-weight:600}.brd .pri-Should{color:#b4570b;font-weight:600}.brd .pri-Could{color:#4a5470}
.brd .small{font-size:12px;color:#7c859e}.brd .conv p{margin:0 0 5px}.brd .conv b{color:#0f2147}`;

function brdHTML(){
  const d=S.sd, B=d.brd, f=S.f, D=S.det, route=S.override||D.route, ch=CHANNELS[route];
  const L=a=>(a||[]).filter(Boolean), ul=a=>L(a).length?`<ul>${L(a).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  let n=0; const H=t=>`<h2>${++n}. ${t}</h2>`;
  const sec=(t,body)=>body&&body.replace(/<[^>]+>/g,"").trim()?H(t)+body:"";
  const date=(d._date?new Date(d._date):new Date()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const facts=Object.entries(f).filter(([k,v])=>FACTS[k]&&known(v)).map(([k,v])=>`<tr><td>${esc(FACTS[k].label)}</td><td>${esc(show(k,v))}</td></tr>`).join("");
  const convo=S.msgs.filter(m=>!m.kind).map(m=>`<p><b>${m.role==="user"?"Requester":"Intake assistant"}:</b> ${esc(m.text)}</p>`).join("");
  return `<div class="brd">
  <div class="kicker">Business requirements document</div><h1>${esc(d.title)}</h1>
  <table class="kv" style="margin-top:12px">
    <tr><td>Reference</td><td>${esc(S.submitted||"Draft, not yet submitted")}</td></tr><tr><td>Version and status</td><td>${S.submitted?"1.0, submitted":"0.1, draft for review"}</td></tr>
    <tr><td>Date</td><td>${date}</td></tr><tr><td>Category</td><td>${esc(catById(f.category).name)} (${esc(DEMAND_TYPES[f.demand_type]||"")})</td></tr>
    <tr><td>Recommended route</td><td>${esc(ch.name)}${S.override?` (override, standard route: ${esc(CHANNELS[D.route].name)})`:""}</td></tr>
    <tr><td>Estimated value</td><td>${known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"To be confirmed"}</td></tr>
    <tr><td>Cost centre</td><td>${esc(f.cost_centre&&f.cost_centre!=="Not given"?f.cost_centre:"To be confirmed")}</td></tr>
  </table>
  ${H("Service description summary")}<div class="lead">${esc(d.summary)}</div>
  ${sec("Background and business need",B.background?`<p>${esc(B.background)}</p>`:"")}
  ${sec("Objectives and success criteria",(L(B.objectives).length?`<h3>Objectives</h3>${ul(B.objectives)}`:"")+(L(B.success_criteria).length?`<h3>Success criteria</h3>${ul(B.success_criteria)}`:""))}
  ${sec("Scope",`<div class="two"><div><h3>In scope</h3>${ul(B.scope_in)||"<p class='small'>To be confirmed</p>"}</div><div><h3>Out of scope</h3>${ul(B.scope_out)}</div></div>`)}
  ${sec("Requirements",L(B.requirements).length?`<table><tr><th style="width:62px">ID</th><th style="width:120px">Type</th><th>Requirement</th><th style="width:70px">Priority</th></tr>${B.requirements.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.type)}</td><td>${esc(r.text)}</td><td class="pri-${esc(r.priority)}">${esc(r.priority)}</td></tr>`).join("")}</table>`:"")}
  ${sec("Deliverables and milestones",(L(B.deliverables).length?`<h3>Deliverables</h3>${ul(B.deliverables)}`:"")+(L(B.milestones).length?`<h3>Milestones</h3><table><tr><th>Milestone</th><th>Timing</th></tr>${B.milestones.filter(m=>m&&m.milestone).map(m=>`<tr><td>${esc(m.milestone)}</td><td>${esc(m.timing||"")}</td></tr>`).join("")}</table>`:""))}
  ${sec("Timing, location and volumes",[B.timeline&&`<tr><td>Timing</td><td>${esc(B.timeline)}</td></tr>`,B.location&&`<tr><td>Location</td><td>${esc(B.location)}</td></tr>`,B.volumes&&`<tr><td>Volumes</td><td>${esc(B.volumes)}</td></tr>`].filter(Boolean).join("")?`<table class="kv">${[B.timeline&&`<tr><td>Timing</td><td>${esc(B.timeline)}</td></tr>`,B.location&&`<tr><td>Location</td><td>${esc(B.location)}</td></tr>`,B.volumes&&`<tr><td>Volumes</td><td>${esc(B.volumes)}</td></tr>`].filter(Boolean).join("")}</table>`:"")}
  ${sec("Service levels",ul(B.service_levels))}
  ${sec("Supplier requirements",ul(B.supplier_requirements))}
  ${sec("Risk, data and compliance",ul(B.risk_and_compliance)+(D.controls.length?`<h3>Checks triggered by the rules</h3><ul>${D.controls.map(([k,t,x])=>`<li><b>${esc(t)}</b>: ${esc(x)}</li>`).join("")}</ul>`:""))}
  ${sec("Commercial and contract terms",ul(B.commercials))}
  ${sec("Buying route and evaluation",`<p><b>${esc(ch.name)}</b>, typically ${ch.days} working days. ${esc(D.why)}</p>`+(L(B.evaluation).length?`<h3>How offers are compared</h3><table><tr><th>Criterion</th><th style="width:90px">Weight</th></tr>${B.evaluation.filter(e=>e&&e.criterion).map(e=>`<tr><td>${esc(e.criterion)}</td><td>${esc(e.weight||"")}</td></tr>`).join("")}</table>`:""))}
  ${sec("Stakeholders",L(B.stakeholders).length?`<table><tr><th>Role</th><th>Who</th></tr>${B.stakeholders.filter(x=>x&&x.role).map(x=>`<tr><td>${esc(x.role)}</td><td>${esc(x.who||"")}</td></tr>`).join("")}</table>`:"")}
  ${sec("Assumptions, dependencies and open points",(L(B.assumptions).length?`<h3>Assumptions</h3>${ul(B.assumptions)}`:"")+(L(B.dependencies).length?`<h3>Dependencies</h3>${ul(B.dependencies)}`:"")+(L(B.open_points).length?`<h3>Open points</h3>${ul(B.open_points)}`:""))}
  ${sec("Approvals and next steps",`<h3>Approvals</h3><table><tr><th>Approval</th><th>By</th><th style="width:110px">Status</th></tr><tr><td>Business need and budget</td><td>${esc(f.cost_centre&&f.cost_centre!=="Not given"?"Owner of cost centre "+f.cost_centre:"Budget owner")}</td><td>${f.budget_approved==="yes"?"Approved":"Pending"}</td></tr>${D.controls.filter(c=>c[0]!=="i"||/Approval|Confirm|Renewal/.test(c[1])).map(([k,t])=>`<tr><td>${esc(t)}</td><td>${esc(/Data/.test(t)?"Data protection":/ICT|Offshoring|Subcontractor/.test(t)?"Risk and IT security":/Non-preferred|Single-source|Material/.test(t)?"Procurement":/Approval to source/.test(t)?"Budget owner and procurement":/Renewal/.test(t)?"Contract owner and procurement":"Contract owner")}</td><td>Pending</td></tr>`).join("")}</table><h3>Next steps</h3><ol>${D.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`)}
  <h2>Appendix A. Details captured in the intake</h2><table class="kv">${facts}</table>
  <h2>Appendix B. Intake conversation</h2><div class="conv small">${convo}</div>
  </div>`;
}
function openBRD(){
  const html = S.brdEdited || brdHTML();
  $("#docRoot").innerHTML=`<div class="docwrap"><div class="doctools">
      <b>Business requirements document</b><span class="muted hide-sm">Click any text to edit</span><span class="sp"></span>
      <button class="btn btn-g" data-doc="print">Print or save as PDF</button><button class="btn btn-g" data-doc="word">Download Word</button>
      <button class="btn btn-g hide-sm" data-doc="json">JSON</button><button class="btn btn-p" data-doc="close">Close</button></div>
    <div class="paper" id="paper" contenteditable="true" spellcheck="false">${html}</div></div>`;
  document.body.classList.add("doc-open");
  $("#paper").addEventListener("input",()=>S.brdEdited=$("#paper").innerHTML);
  document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.doc;
    if(a==="close"){ $("#docRoot").innerHTML=""; document.body.classList.remove("doc-open"); }
    if(a==="print") window.print();
    if(a==="json") download();
    if(a==="word") downloadWord();
  });
}
function downloadWord(){
  const body=($("#paper")||{}).innerHTML || brdHTML();
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(S.sd.title)}</title><style>${DOC_CSS}.brd .two{display:block}</style></head><body>${body}</body></html>`;
  const b=new Blob(["﻿",doc],{type:"application/msword"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`BRD - ${S.sd.title.replace(/[^\w\- ]+/g,"").slice(0,60)}.doc`; a.click();
}
function bind(){
  const o=$("#ovr"); if(o) o.onchange=e=>{S.override=e.target.value;render();};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="submit") submit(); if(a==="json") download(); if(a==="brd") openBRD();
    if(a==="more"){ S.showMore=!S.showMore; render(); }
    if(a==="copy") navigator.clipboard?.writeText(sdText()).then(()=>b.textContent="Copied");
  });
  document.querySelectorAll("[data-sd]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sd; S.sd[k]=el.textContent.trim(); S.brdEdited=null;}));
}

function renderSide(){
  const f=S.f, D=S.det;
  if(!D){ $("#side").innerHTML=`<div class="panel"><div class="eyebrow">Your request</div><p class="muted" style="margin:8px 0 0">Start by describing what you need. The route and what's needed for it appear here.</p></div>${sideNote()}`; return; }
  const req=requiredFor(D.route,f), needsValue=!["catalogue","contingent"].includes(D.route)&&!req.includes("value");
  const list=[...(needsValue?["value"]:[]),...req];
  const done=list.filter(k=>known(f[k])).length, pct=Math.round(done/list.length*100);
  $("#side").innerHTML=`<div class="panel">
      <div class="eyebrow">Route ${S.missing.length?"so far":""}</div>
      <div class="route">${CHANNELS[S.override||D.route].name}</div>
      <div class="prov">${S.missing.length?"May change as you answer":"Ready"} · ${esc(catById(f.category).name)}</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="muted" style="margin-bottom:8px">${done} of ${list.length} details for this route</div>
      ${list.map(k=>{const ok=known(f[k]), nx=!ok&&S.missing[0]===k; return `<div class="fact ${ok?"ok":""} ${nx?"next":""}"><span class="ic">${ok?"✓":""}</span><span class="k">${FACTS[k].label}</span><span class="v">${ok?esc(show(k,f[k])):nx?"asking now":"—"}</span></div>`;}).join("")}
    </div>${sideNote()}`;
}
const sideNote=()=>`<div class="panel muted">The route and the details it needs come from fixed rules (editable under Rules). The AI only runs the conversation and writes the description.</div>`;

/* =========================================================
   10. SETTINGS
   ========================================================= */
function openSettings(){
  const T=CONFIG.thresholds, hosted=!!SERVER;
  const aiOn=CONFIG.provider!=="offline";
  const names={gemini:"Gemini",groq:"Groq",mistral:"Mistral"};
  const chain=hosted?[SERVER.providers.gemini&&"Gemini",SERVER.providers.groq&&"Groq",SERVER.providers.mistral&&"Mistral"].filter(Boolean):[];
  $("#drawerRoot").innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer">
    <header><h3>Rules</h3><button class="btn btn-g" id="close">Close</button></header>
    <div class="body">
      <section><div class="eyebrow">Route rules</div>
        <p class="muted" style="margin:6px 0 0">Owned by the business. Changes apply to the current request straight away.</p>
        <label>Card purchase limit (${CONFIG.currency})</label><input class="inp" type="number" id="t1" value="${T.pcardMax}">
        <label>Quick-quote limit (${CONFIG.currency})</label><input class="inp" type="number" id="t2" value="${T.quickQuoteMax}">
        <label>Material spend review from (${CONFIG.currency})</label><input class="inp" type="number" id="t3" value="${T.materialityMin}">
        <label>Renewal window before contract end (days)</label><input class="inp" type="number" id="t4" value="${T.renewalWindowDays}"></section>
      <section><div class="eyebrow">AI</div>
        ${hosted?`
          <label class="tgl"><input type="checkbox" id="aiToggle" ${aiOn?"checked":""}><span>Use AI for the conversation and the documents</span></label>
          <p class="muted" style="margin:8px 0 0">${aiOn?`Connected through the server: ${chain.join(", then ")}${chain.length>1?" as backup":""}. Keys are stored on Vercel, never in this page.${SERVER.last?` Last answer from ${names[SERVER.last]||SERVER.last}.`:""}`:"Off: standard questions and documents built from the rules. Nothing leaves the browser."}</p>
          ${SERVER.accessRequired&&aiOn?`<label>Access code</label><input class="inp" type="password" id="ac" value="${esc(CONFIG.accessCode)}">`:""}`
        :`<div class="seg" id="prov">${["gemini","groq","offline"].map(p=>`<button data-p="${p}" class="${CONFIG.provider===p?"on":""}">${({gemini:"Gemini key",groq:"Groq key",offline:"Offline"})[p]}</button>`).join("")}</div>
          <p class="muted" style="margin:8px 0 0">No server found, so this page is running from a file. A key entered here stays in this tab only.</p>
          <div id="pf"></div><div id="test"></div>`}
      </section>
    </div></div>`;
  if(hosted){
    $("#aiToggle").onchange=e=>{ CONFIG.provider=e.target.checked?"server":"offline"; render(); openSettings(); };
    const ac=$("#ac"); if(ac) ac.oninput=e=>{ CONFIG.accessCode=e.target.value.trim(); try{sessionStorage.setItem("ac",CONFIG.accessCode);}catch(x){} };
  } else {
    const pf=()=>{const p=CONFIG.provider;
      if(p==="offline"||p==="auto"){ $("#pf").innerHTML=`<div class="alert info">Standard questions with examples. Nothing leaves the browser.</div>`; return; }
      $("#pf").innerHTML=`<label>${names[p]} API key</label><input class="inp" type="password" id="key" value="${esc(CONFIG.keys[p])}"><label>Model</label><input class="inp" id="model" value="${esc(CONFIG.models[p])}"><button class="btn btn-g" id="tbtn" style="margin-top:12px">Test connection</button>`;
      $("#key").oninput=e=>{CONFIG.keys[p]=e.target.value.trim();render();}; $("#model").oninput=e=>CONFIG.models[p]=e.target.value.trim();
      $("#tbtn").onclick=async()=>{$("#test").innerHTML=`<div class="alert info">Testing…</div>`;try{await callLLM('Return JSON {"ok":true}',[{role:"user",content:"ping, reply in json"}]);$("#test").innerHTML=`<div class="alert info">Connected.</div>`;}catch(e){$("#test").innerHTML=`<div class="alert err">${esc(e.message)}</div>`;}};
    };
    pf();
    document.querySelectorAll("#prov button").forEach(b=>b.onclick=()=>{CONFIG.provider=b.dataset.p;document.querySelectorAll("#prov button").forEach(x=>x.classList.toggle("on",x===b));pf();render();});
  }
  [["#t1","pcardMax"],["#t2","quickQuoteMax"],["#t3","materialityMin"],["#t4","renewalWindowDays"]].forEach(([id,k])=>$(id).oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v))CONFIG.thresholds[k]=v;});
  const close=()=>{$("#drawerRoot").innerHTML=""; if(S.det){refresh(); if(!S.missing.length) showRecommendation();} render();};
  $("#close").onclick=close; $("#scrim").onclick=close;
}

/* =========================================================
   11. WIRING
   ========================================================= */
function reset(){ Object.assign(S,fresh()); render(); $("#inp").focus(); }
const inp=$("#inp");
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#comp").requestSubmit();}});
$("#comp").onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value="";inp.style.height="auto";handleUser(t);};
$("#doccss").textContent=DOC_CSS;
$("#cfgBtn").onclick=openSettings; $("#newBtn").onclick=reset; $("#sumBtn").onclick=()=>$("#side").classList.toggle("open");
(async()=>{
  render(); await detectServer(); resolveProvider();
  if(CONFIG.provider==="server" && SERVER.accessRequired && !CONFIG.accessCode){
    try{CONFIG.accessCode=sessionStorage.getItem("ac")||"";}catch(e){}
    if(!CONFIG.accessCode){ const c=prompt("Enter the access code for this demo:"); if(c){CONFIG.accessCode=c.trim(); try{sessionStorage.setItem("ac",CONFIG.accessCode);}catch(e){}} }
  }
  render();
})();
</script>
</body>
</html>
