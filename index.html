.brd th{background:#0f2147;color:#fff;text-align:left;padding:7px 9px;font-weight:600}
.brd td{border-bottom:1px solid #e4e7ef;padding:7px 9px;vertical-align:top}
.brd table.kv td:first-child{width:34%;color:#4a5470;background:#f8f9fc;font-weight:500}
.brd .lead{background:#fbfaf5;border-left:3px solid #f2a900;padding:10px 14px;margin:6px 0 10px}
.brd .lead h5{margin:8px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a5d00}.brd .lead h5:first-child{margin-top:0}.brd .lead .hl{font-size:14.5px}.brd .lead table{background:#fff}.brd .lead .narr{margin-top:10px;padding-top:8px;border-top:1px dashed #e6d9b0}.brd .lead p{margin:0 0 4px}.brd .lead ul{margin:0 0 4px}
.brd .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.brd .pri-Must{color:#b42318;font-weight:600}.brd .pri-Should{color:#b4570b;font-weight:600}.brd .pri-Could{color:#4a5470}
.brd .small{font-size:12px;color:#7c859e}.brd .conv p{margin:0 0 5px}.brd .conv b{color:#0f2147}`;

function brdHTML(){
  if(S.sd.detail) return detailHTML();
  const d=S.sd, B=d.brd, f=S.f, D=S.det, route=S.override||D.route, ch=CHANNELS[route];
  const L=a=>(a||[]).filter(Boolean), ul=a=>L(a).length?`<ul>${L(a).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  let n=0; const H=t=>`<h2>${++n}. ${t}</h2>`;
  const sec=(t,body)=>body&&body.replace(/<[^>]+>/g,"").trim()?H(t)+body:"";
  const date=(d._date?new Date(d._date):new Date()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const facts=Object.entries(f).filter(([k,v])=>FACTS[k]&&known(v)).map(([k,v])=>`<tr><td>${esc(FACTS[k].label)}</td><td>${esc(show(k,v))}</td></tr>`).join("");
  const convo=S.msgs.filter(m=>!m.kind).map(m=>`<p><b>${m.role==="user"?"Requester":"Intake assistant"}:</b> ${esc(m.text)}</p>`).join("");
  return `<div class="brd">
  <div class="kicker">Business requirements document</div><h1>${esc(d.title)}</h1>
  <table class="kv" style="margin-top:12px">
    <tr><td>Reference</td><td>${esc(S.submitted||"Draft, not yet submitted")}</td></tr><tr><td>Version and status</td><td>${S.submitted?"1.0, submitted":"0.1, draft for review"}</td></tr>
    <tr><td>Date</td><td>${date}</td></tr><tr><td>Category</td><td>${esc(catById(f.category).name)} (${esc(DEMAND_TYPES[f.demand_type]||"")})</td></tr>
    <tr><td>Recommended route</td><td>${esc(ch.name)}${S.override?` (override, standard route: ${esc(CHANNELS[D.route].name)})`:""}</td></tr>
    <tr><td>Estimated value</td><td>${known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"To be confirmed"}</td></tr>
  </table>
  ${H("Service description")}<div class="lead">${descHTML(false)}</div>
  ${H("Captured for procurement")}<table class="kv">${intakeRecord().map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
  ${S.quality?H("Intake quality check")+`<p><b>${esc(S.quality.rating)}</b>, ${S.quality.score}/100. ${S.quality.complete}% of the details needed for this route were given.</p>`+(S.quality.points.length?`<table><tr><th style="width:90px">Type</th><th>Point</th></tr>${S.quality.points.map(p=>`<tr><td>${p.lvl==="warn"?"To check":p.lvl==="ok"?"Clarified":"Note"}</td><td>${esc(p.text)}</td></tr>`).join("")}</table>`:"<p>No gaps or inconsistencies found.</p>"):""}
  ${sec("Background and business need",B.background?`<p>${esc(B.background)}</p>`:"")}
  ${sec("Objectives and success criteria",(L(B.objectives).length?`<h3>Objectives</h3>${ul(B.objectives)}`:"")+(L(B.success_criteria).length?`<h3>Success criteria</h3>${ul(B.success_criteria)}`:""))}
  ${sec("Scope",`<div class="two"><div><h3>In scope</h3>${ul(B.scope_in)||"<p class='small'>To be confirmed</p>"}</div><div><h3>Out of scope</h3>${ul(B.scope_out)}</div></div>`)}
  ${sec("Requirements",L(B.requirements).length?`<table><tr><th style="width:62px">ID</th><th style="width:120px">Type</th><th>Requirement</th><th style="width:70px">Priority</th></tr>${B.requirements.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.type)}</td><td>${esc(r.text)}</td><td class="pri-${esc(r.priority)}">${esc(r.priority)}</td></tr>`).join("")}</table>`:"")}
  ${sec("Deliverables and milestones",(L(B.deliverables).length?`<h3>Deliverables</h3>${ul(B.deliverables)}`:"")+(L(B.milestones).length?`<h3>Milestones</h3><table><tr><th>Milestone</th><th>Timing</th></tr>${B.milestones.filter(m=>m&&m.milestone).map(m=>`<tr><td>${esc(m.milestone)}</td><td>${esc(m.timing||"")}</td></tr>`).join("")}</table>`:""))}
  ${sec("Timing, location and volumes",[B.timeline&&`<tr><td>Timing</td><td>${esc(B.timeline)}</td></tr>`,B.location&&`<tr><td>Location</td><td>${esc(B.location)}</td></tr>`,B.volumes&&`<tr><td>Volumes</td><td>${esc(B.volumes)}</td></tr>`].filter(Boolean).join("")?`<table class="kv">${[B.timeline&&`<tr><td>Timing</td><td>${esc(B.timeline)}</td></tr>`,B.location&&`<tr><td>Location</td><td>${esc(B.location)}</td></tr>`,B.volumes&&`<tr><td>Volumes</td><td>${esc(B.volumes)}</td></tr>`].filter(Boolean).join("")}</table>`:"")}
  ${sec("Service levels",ul(B.service_levels))}
  ${sec("Supplier requirements",ul(B.supplier_requirements))}
  ${sec("Risk, data and compliance",ul(B.risk_and_compliance)+(D.controls.length?`<h3>Checks triggered by the rules</h3><ul>${D.controls.map(([k,t,x])=>`<li><b>${esc(t)}</b>: ${esc(x)}</li>`).join("")}</ul>`:""))}
  ${sec("Commercial and contract terms",ul(B.commercials))}
  ${sec("Buying route and evaluation",`<p><b>${esc(ch.name)}</b>, typically ${ch.days} working days. ${esc(D.why)}</p>`+(L(B.evaluation).length?`<h3>How offers are compared</h3><table><tr><th>Criterion</th><th style="width:90px">Weight</th></tr>${B.evaluation.filter(e=>e&&e.criterion).map(e=>`<tr><td>${esc(e.criterion)}</td><td>${esc(e.weight||"")}</td></tr>`).join("")}</table>`:""))}
  ${sec("Stakeholders",L(B.stakeholders).length?`<table><tr><th>Role</th><th>Who</th></tr>${B.stakeholders.filter(x=>x&&x.role).map(x=>`<tr><td>${esc(x.role)}</td><td>${esc(x.who||"")}</td></tr>`).join("")}</table>`:"")}
  ${sec("Assumptions, dependencies and open points",(L(B.assumptions).length?`<h3>Assumptions</h3>${ul(B.assumptions)}`:"")+(L(B.dependencies).length?`<h3>Dependencies</h3>${ul(B.dependencies)}`:"")+(L(B.open_points).length?`<h3>Open points</h3>${ul(B.open_points)}`:""))}
  ${sec("Approvals and next steps",`<h3>Approvals</h3><table><tr><th>Approval</th><th>By</th><th style="width:110px">Status</th></tr><tr><td>Business need and budget</td><td>Budget owner</td><td>${f.budget_approved==="yes"?"Approved":"Pending"}</td></tr>${D.controls.filter(c=>c[0]!=="i"||/Approval|Confirm|Renewal/.test(c[1])).map(([k,t])=>`<tr><td>${esc(t)}</td><td>${esc(/Data/.test(t)?"Data protection":/ICT|Offshoring|Subcontractor/.test(t)?"Risk and IT security":/Non-preferred|Single-source|Material/.test(t)?"Procurement":/Approval to source/.test(t)?"Budget owner and procurement":/Renewal/.test(t)?"Contract owner and procurement":"Contract owner")}</td><td>Pending</td></tr>`).join("")}</table><h3>Next steps</h3><ol>${D.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`)}
  <h2>Appendix A. Details captured in the intake</h2><table class="kv">${facts}</table>
  <h2>Appendix B. Intake conversation</h2><div class="conv small">${convo}</div>
  </div>`;
}
function detailHTML(){
  const d=S.sd, X=d.detail, B=d.brd, f=S.f, D=S.det, route=S.override||D.route, ch=CHANNELS[route], cl=classify(f), o=cl.o, fin=d.l4Final||{}, ini=(S.l4Initial||[])[0];
  const L=a=>[].concat(a||[]).filter(Boolean), val=v=>{ const a=L(v); if(!a.length) return `<p class="tbd">To be determined</p>`; return a.length>1?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p>${esc(a[0])}</p>`; };
  const date=(d._date?new Date(d._date):new Date()).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const kv=rows=>`<table class="kv">${rows.filter(r=>r&&r[1]!==undefined&&r[1]!==null&&r[1]!=="").map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>`;
  const qual=`<h3>Category (Level 4)</h3>${kv([["Initial classification",ini?`${ini.name} (${ini.code}), ${ini.match}% match`:"—"],["Final classification",fin.code?`${fin.name} (${fin.code})${fin.match?`, ${fin.match}% match`:""}`:"—"],["Reasoning",fin.reason],["Uncertainty",fin.uncertainty||"None noted"]])}
    <h3>Information and communication technology</h3><p>${esc(cl.ict?cl.ict.text:"To be determined.")}</p>
    <h3>Critical or important function</h3><p>${isImportant(f)?"May apply, based on the impact described. Flagged for the outsourcing and materiality review; not a final decision.":"Nothing in the answers indicates a critical or important function. To be confirmed in the review."}</p>
    <h3>Outsourcing determination</h3>${kv([["Provisioning legal entity",o.entity?`${o.entity.name}, ${o.entity.country}`:"To be determined"],["Rule set",`${o.rs.instrument}. ${o.rs.status}.`],
      ...o.steps.map(([a,b])=>[a,b]),["Result",o.result],["Based on",o.reasons.join(" ")],["Checked by the requester",known(f.confirm_derived)&&!isTBD(f.confirm_derived)?(f.confirm_derived==="Confirmed"?"Yes, confirmed":String(f.confirm_derived)):"No"]])}
    <h3>Future rule set (versioned separately)</h3>${kv([["Rule set",`${RULESETS.future.instrument}. ${RULESETS.future.status}.`],["Indicative result",o.future.result],["Why",o.future.why],["Use","For information only; it does not change the result above until it applies."]])}
    <p class="small">This is a flag for the outsourcing review, not a final determination. EBA/GL/2019/02 is applied as the group standard for every provisioning legal entity; local requirements may add to it. ICT services are assessed separately under DORA. Rule set: ${esc(RULESET_VERSION)}.</p>
    <h3>Materiality</h3><p>Materiality cannot be finally determined from this intake alone. The captured attributes are input to the applicable materiality determination process.</p>`;
  const sections={title:`<p><b>${esc(d.title)}</b></p>`, purpose:val(X.purpose), qualification:qual,
    scope:`<div class="two"><div><h3>In scope</h3>${val(X.scope_in)}</div><div><h3>Out of scope</h3>${val(X.scope_out)}</div></div>`,
    obligations: L(B.requirements).length?`<table><tr><th style="width:62px">ID</th><th style="width:110px">Type</th><th>Obligation</th><th style="width:70px">Priority</th></tr>${B.requirements.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.type)}</td><td>${esc(String(r.text).replace(/^The supplier shall/i,"The Service Provider shall"))}</td><td class="pri-${esc(r.priority)}">${esc(r.priority)}</td></tr>`).join("")}</table>`:val([]),
    open_points: val(X.open_points)};
  const body=DETAIL_SECTIONS.map(([k,t],i)=>`<h3 class="dsec">${i+1}. ${esc(t)}</h3>${sections[k]!==undefined?sections[k]:val(X[k])}`).join("");
  const attrs=sourcingAttributes().map(([g,rows])=>`<h3>${esc(g)}</h3>${kv(rows)}`).join("");
  const a=accessFlags(f);
  const mat=`<ul>${[`Information and communication technology: ${cl.ict?cl.ict.flag:"To be determined"}`,`Critical or important function: ${isImportant(f)?"may apply":"no indication"}`,`Outsourcing: ${o.result}${` (${o.rs.short})`}`,
    `Data, system, money and account access: ${a.any?(givenText(f.data_details)||"yes"):f.personal_data===false?"none":"to be determined"}${a.money?" (money or accounts)":""}`,`Location and cross-border: ${givenText(f.location)||"to be determined"}${isOffshore(f)?" (cross-border)":""}`,
    `Estimated value: ${known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"to be determined"}`,`Subcontracting: ${known(f.subcontracting)?show("subcontracting",f.subcontracting):"to be determined"}`,
    `Known dependencies: ${L(X.our_deps).join("; ")||"none stated"}`,`Known assumptions: ${L(X.assumptions).join("; ")||"none stated"}`,`Open points: ${L(X.open_points).length}`].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <p>Materiality cannot be finally determined from this intake alone. The captured attributes should be used as input to the applicable materiality determination process.</p>`;
  const q=sectionQuality();
  const qtab=`<table><tr><th style="width:30%">Section</th><th style="width:110px">Status</th><th>Issue or gap</th><th>Recommended improvement</th></tr>${q.map(r=>`<tr><td>${esc(r.sec)}</td><td class="st-${r.status.replace(/\s/g,"")}">${esc(r.status)}</td><td>${esc(r.issue)}</td><td>${esc(r.fix)}</td></tr>`).join("")}</table>`;
  const facts=Object.entries(f).filter(([k,v])=>FACTS[k]&&known(v)&&!bundleOf(k)&&k!=="ict_outsourcing").map(([k,v])=>`<tr><td>${esc(FACTS[k].label)}</td><td>${esc(show(k,v))}</td></tr>`).join("");
  const convo=S.msgs.filter(m=>!m.kind).map(m=>`<p><b>${m.role==="user"?"Requester":"Intake assistant"}:</b> ${esc(m.text)}</p>`).join("");
  return `<div class="brd">
  <div class="kicker">Service description for approval to source</div><h1>${esc(d.title)}</h1>
  ${kv([["Reference",S.submitted||"Draft, not yet submitted"],["Version and status",S.submitted?"1.0, submitted":"0.1, draft for review"],["Date",date],["Category (Level 4)",fin.code?`${fin.name} (${fin.code})`:"—"],["Buying route",`${ch.name}, typically ${ch.days} working days`],["Quality",S.quality?`${S.quality.rating}, ${S.quality.score}/100 (threshold ${CONFIG.thresholds.qualityMin})${S.quality.score<CONFIG.thresholds.qualityMin?(S.submitted?", submitted below the threshold":", below the threshold"):""}`:""],["Estimated value",known(f.value)?money(Number(f.value))+(f.value_is_estimate?" (estimate)":""):"To be determined"]])}
  <h2>Part 1. Executive service description</h2><div class="lead">${descHTML(false)}</div>
  <h2>Part 2. Detailed service description</h2>${body}
  <h2>Part 3. Structured sourcing input attributes</h2>${attrs}
  <h2>Part 4. Materiality and governance input summary</h2>${mat}
  <h2>Part 5. Compact sourcing request description</h2><div class="lead"><p>${esc(d.compact)}</p></div>
  <h2>Part 6. Service description quality check</h2><p><b>${esc(S.quality?S.quality.rating:"")}</b>${S.quality?`, ${S.quality.score}/100`:""}.</p>${qtab}
  <h2>Part 7. Level 4 classification, final validation</h2>${kv([["Final",fin.code?`${fin.name} (${fin.code})${fin.match?`, ${fin.match}% match`:""}`:"—"],["Reasoning",fin.reason],["Remaining uncertainty",fin.uncertainty||"None noted"]])}
  <p><b>${fin.changed?"The Level 4 classification has changed due to refined scope.":"The initial Level 4 classification is confirmed."}</b>${fin.changed?` Initial: ${esc(fin.from.name)} (${esc(fin.from.code)}). Final: ${esc(fin.name)} (${esc(fin.code)}). ${esc(fin.why)}`:""}</p>
  <h2>Appendix A. Details captured in the intake</h2><table class="kv">${facts}</table>
  <h2>Appendix B. Intake conversation</h2><div class="conv small">${convo}</div>
  </div>`;
}
function openBRD(){
  const html = S.brdEdited || brdHTML();
  $("#docRoot").innerHTML=`<div class="docwrap"><div class="doctools">
      <b>${S.sd.detail?"Service description":"Business requirements document"}</b><span class="muted hide-sm">Click any text to edit</span><span class="sp"></span>
      <button class="btn btn-g" data-doc="print">Print or save as PDF</button><button class="btn btn-g" data-doc="word">Download Word</button>
      <button class="btn btn-g hide-sm" data-doc="json">JSON</button><button class="btn btn-p" data-doc="close">Close</button></div>
    <div class="paper" id="paper" contenteditable="true" spellcheck="false">${html}</div></div>`;
  document.body.classList.add("doc-open");
  $("#paper").addEventListener("input",()=>S.brdEdited=$("#paper").innerHTML);
  document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.doc;
    if(a==="close") closeDoc();
    if(a==="print") window.print();
    if(a==="json") download();
    if(a==="word") downloadWord();
  });
}
function downloadWord(){
  const body=($("#paper")||{}).innerHTML || brdHTML();
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(S.sd.title)}</title><style>${DOC_CSS}.brd .two{display:block}</style></head><body>${body}</body></html>`;
  const b=new Blob(["﻿",doc],{type:"application/msword"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=`BRD - ${S.sd.title.replace(/[^\w\- ]+/g,"").slice(0,60)}.doc`; a.click();
}
function bind(){
  const o=$("#ovr"); if(o) o.onchange=e=>{S.override=e.target.value;render();};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="submit") submit(); if(a==="json") download(); if(a==="brd") openBRD(); if(a==="addopt") startOptional(b.dataset.key);
    if(a==="more"){ S.showMore=!S.showMore; render(); }
    if(a==="copy") navigator.clipboard?.writeText(sdText()).then(()=>b.textContent="Copied");
    if(a==="copycompact") navigator.clipboard?.writeText(S.sd.compact||"").then(()=>b.textContent="Copied");
  });
  document.querySelectorAll("[data-sd]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sd; S.sd[k]=el.textContent.trim(); S.brdEdited=null;}));
  document.querySelectorAll("[data-sec]").forEach(el=>el.addEventListener("blur",()=>{const k=el.dataset.sec, d=S.sd.desc;
    d[k] = Array.isArray(d[k]) ? el.innerText.split(el.tagName==="TD"?/;|\n/:/\n/).map(x=>x.trim()).filter(Boolean) : k==="narrative" ? clampText(el.textContent) : k==="exec" ? [...el.querySelectorAll("p")].map(p=>p.textContent.trim()).filter(Boolean).join("\n\n")||el.innerText.trim() : el.textContent.trim();
    S.brdEdited=null;}));
}

function renderSide(){
  const f=S.f, D=S.det;
  if(!D){ $("#side").innerHTML=`<div class="panel"><div class="eyebrow">Your request</div><p class="muted" style="margin:8px 0 0">Start by describing what you need. The route and what's needed for it appear here.</p></div>`; return; }
  const req=S.req||[], done=req.filter(k=>known(f[k])).length, pct=req.length?Math.round(done/req.length*100):100;
  // only the step being asked is open; the others fold to one line and open with a click.
  // Long answers sit under their label, cut to two lines, and show in full when clicked.
  S.sideOpen=S.sideOpen||{}; S.sideFull=S.sideFull||{};
  const groups=S.stageIds.filter(id=>id!=="review").map(id=>{
    const ks=stageFacts(id), n=ks.filter(k=>known(f[k])).length, all=n===ks.length;
    const open = S.sideOpen[id]!==undefined ? S.sideOpen[id] : ks.includes(S.missing[0]) || ks.includes(S.editing);
    return `<button class="grp${open?" open":""}" data-grp="${id}" aria-expanded="${open}"><span>${esc(stageById(id).name)}</span>${all?`<em>✓ ${n} ${n===1?"detail":"details"}</em>`:`<i>${n} of ${ks.length}</i>`}</button>`+
      `<div class="gfacts"${open?"":" hidden"}>`+
      ks.map(k=>{const ok=known(f[k]), nx=!ok&&S.missing[0]===k, can=ok&&canEdit(k), v=ok?show(k,f[k]):nx?"asking now":"—", long=ok&&String(v).length>34;
        if(S.editing===k) return `<div class="fact ok editing"><span class="ic">✓</span><span class="k">${FACTS[k].label}</span>${editorHTML(k)}</div>`;
        return `<div class="fact ${ok?"ok":""} ${nx?"next":""}${long?" long":""}${long&&S.sideFull[k]?" full":""}"><span class="ic">${ok?"✓":""}</span><span class="k">${FACTS[k].label}</span><span class="v"${long?` data-full="${k}" title="${S.sideFull[k]?"Show less":"Show all"}"`:""}>${esc(v)}</span>${can?`<button class="ed" data-edit="${k}" title="Change" aria-label="Change ${esc(FACTS[k].label)}">✎</button>`:""}</div>`;}).join("")+
      `</div>`;
  }).join("");
  $("#side").innerHTML=`<div class="panel">
      <div class="eyebrow">Route ${S.missing.length?"so far":""}</div>
      <div class="route">${CHANNELS[S.override||D.route].name}</div>
      <div class="prov">${S.missing.length?"May change as you answer":"Ready"} · ${esc(catById(f.category).name)} <button class="ed" data-edit="category" title="Change the category" aria-label="Change the category">✎</button></div>
      ${S.editing==="category"?`<div class="fact editing">${editorHTML("category")}</div>`:""}
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="muted">${done} of ${req.length} details for this route</div>
      ${groups}
    </div>`;
  bindEdits();
}
// editing a captured detail in the side panel
const canEdit = k => !bundleOf(k) && !["confirm_derived","need","profile"].includes(k) && FACTS[k];
function editorHTML(k){
  const f=S.f, opt=(v,t,sel)=>`<option value="${esc(String(v))}"${sel?" selected":""}>${esc(t)}</option>`;
  let ctl;
  if(k==="category") ctl=`<select id="edv">${L4.map(e=>opt(e.code,`${e.name} (${catById(e.cat).name})`,e.code===f.l4)).join("")}</select>`;
  else if(k==="entity") ctl=`<select id="edv">${ENTITIES.map(e=>opt(e.id,e.name,e.id===f.entity)).join("")}</select>`;
  else if(BOOL_KEYS.includes(k)) ctl=`<select id="edv">${opt("yes","Yes",f[k]===true)}${opt("no","No",f[k]===false)}${opt("unsure","Not sure",f[k]==="unsure")}</select>`;

async function saveEdit(k, raw){
  if(S.busy) return;
  const t=String(raw||"").trim(); let v;
  if(k==="category"){ const e=l4ByCode(t); v=e?{cat:e.cat,l4:e.code}:null; }
  else if(k==="value") v=parseMoney(t);
  else if(NUM_KEYS.includes(k)){ const n=t.replace(/(\d),(\d{3})/g,"$1$2").match(/\d+/); v=n?+n[0]:/not sure|unsure/i.test(t)?"unsure":null; }
  else if(BOOL_KEYS.includes(k)) v= t==="yes"?true:t==="no"?false:"unsure";
  else if(k==="entity") v=t||null;
  else v=t?cap1(t):null;
  if(v===null||v===undefined||v===""){ const i=$("#edv"); if(i) i.style.borderColor="var(--bad)"; return; }
  S.editing=null; S.pending=null; S.pendingCorr=null; S.offerImprove=null;
  const done=applyChanges({[k]:v});
  if(!done.length){ renderSide(); return; }
  const cid=S.cid; S.busy=true; render();
  try{ await afterChanges(done, cid); }
  catch(e){ if(!(e instanceof Stale)) console.error(e); }
  finally{ if(S.cid===cid){ S.busy=false; render(); } }
}

      "**Guards on facts:** a place the AI takes from an answer about users or data is not used as the work location; an off-topic verdict only counts for the question just asked; a storage place counts only when the requester said it."]),
    prompt(`A. Chat turn: system prompt (example: “${main}”)`, ex.chatSys),
    prompt("A. Chat turn: message sent with the first answer", ex.chatMsg),
    h(3,"B. Suggestion"),
    ul(["**Cleaned:** no internal keys, no dates, at most 4 points per line.",
      "**Checked:** for bundles every line label must be there, otherwise the rules' draft is used. Accepted lines are stored by the app, never by the AI."]),
    ...(ex.sugKey?[prompt(`B. Suggestion: system prompt (for “${specLabel(ex.sugKey)}”)`, ex.sugSys), prompt("B. Suggestion: message sent", ex.sugMsg)]:[]),
    h(3,"C. Documents"),
    ul(["**Scrubbed:** the description loses amounts, dates, places, supplier names, the route and risk answers, and must meet its word limits.",
      "**Merged with the rules:** the requirements keep the rules' risk lines; the Level 4 confirmed at the check step stays (the AI's pick only adds a note); up to 2 AI remarks join the quality check."]),
    prompt("C. Documents: system prompt for new demand", ex.docSys),
    prompt("C. Documents: message sent (example, right after the first message)", ex.docMsg),
    prompt(`C. Documents: system prompt for other routes (example route: ${exCat.route})`, exCat.docSys),
    h(3,"D. Document change"),
    prompt("D. Document change: message sent (with the documents prompt above)", refineUser({description:{name:"(current service description)"},brd:"(current requirements)"}, "Make the summary shorter")),
    h(3,"E. Connection test"),
    prompt("E. Connection test", `System: ${TEST_PROMPT.system}\nMessage: ${TEST_PROMPT.user}`));

  B.push(h(2,"8. Classification"),
    ul(["**Category:** keywords as whole words (plurals count; `*` marks a stem such as `consult*`). The category with most keywords wins; on a tie the one named last before “for”, “to”, “with”, “that” or a comma. A goods word after “to”, “trading”, “service”, “help” … does not count. With no keyword, management consulting is a guess, never a framework call-off. With AI, the AI's category is used.",
      "**Level 4:** scored within the category (keywords, overlap with name and description). The AI may propose one with the first message. The value confirmed at the check step is final.",
      "**ICT service (DORA):** whether technology is involved comes from the rules or the answer; for software the type follows Level 4 (SaaS or licensing), otherwise keywords.",
      `**Outsourcing, group standard ${R.current.id}** (the legal entity does not change the result): 1. excluded under paragraph 28 (goods, statutory audit, card schemes, clearing, SWIFT, correspondent banking, legal, facilities, market data, telecom, training, marketing, external workers) → not outsourcing; 2. not performed on a recurrent or ongoing basis (paragraph 26) → not outsourcing (likely); a project with set deliverables is one-off whatever its length (see Kinds of work); 3. work the bank does or could realistically do itself (paragraph 26) → outsourcing (likely); otherwise not outsourcing (likely), or to be determined when unclear. A critical or important function (paragraphs 29–31) is a flag for review, never a decision.`,
      `**Future rule set ${R.future.id}** (${R.future.status}): shown as a preview only.`,
      "**Critical or important function:** from the answer on impact (clients, payments, regulatory, trading, outage, audit) or a known bank domain (KYC, payments, payroll, contact centre, regulatory reporting, service desk); never for events, training, office or hardware.",
      "**Offshoring:** the provider works from a country other than the entity's. An explicit “no” wins; where users or data are does not count."]));

  B.push(h(2,"9. Quality"),
    h(3,"Checks on each answer"),
    ul(["**Off-topic:** nothing to do with the request; asked again once, then recorded as “Not given”.",
      "**Too vague:** “tbd”, “stuff”, one or two words for a free-text item.",
      "**Data without a storage place:** asked once (always).",
      "**Implausible amounts:** a day-rate mismatch over 50%, project work under €5,000, months of work under €3,000, over €20 million.",
      "**Contradictions:** “no personal data” or “no technology” against the request; “no impact” despite audit or regulatory context.",
      "**Dates:** in the past, or tighter than the route usually takes."]),
    p(`At most one follow-up per item and three per conversation (off-topic and data location are always asked). With AI, the AI's own judgement adds checks after the rules. A hidden 1–10 rating of each answer gives one tip for a thin new-demand answer when it is ${T.answerTip} or lower (at most three tips; 0 under Rules switches tips off).`),
    h(3,"The overall score"),
    p(`Score = 100 − ${QUALITY.warn} × warnings − ${QUALITY.info} × notes − ${QUALITY.incomplete} × (100 − % of needed details given) − a section penalty (at most ${QUALITY.sectionCap}: ${QUALITY.partialSection} per partial section the route asks for, ${QUALITY.riskSection} per risk), never below ${QUALITY.floor}.`),
    table(["Score","Rating"], QUALITY.bands.map(([min,name],i)=>[`${Math.max(min,QUALITY.floor)}–${i?QUALITY.bands[i-1][0]-1:100}`, name])),
    ul(["**Warnings:** an answer confirmed despite a check, no usable answer, a needed detail still open, data without a storage place, budget not approved for an RFP.",
      "**Notes:** a flexible start date, an estimated budget, a tight timeline, up to 2 remarks from the AI."]),
    p(`**Improvement round:** for new demand scoring below ${T.qualityMin} (set under Rules), the chat offers to go through up to 8 points that would lift it; “Submit anyway” stays possible and is recorded as submitted below the threshold.`),
    p("**To improve** lists gaps in what the route asked, and risks. **Optional for this request** lists sections the route did not ask, only when they matter for this demand (for example governance for long or critical services, change management for software), each with its reason and, where the chat has a question, an Add button."));

  B.push(h(2,"10. What comes out"),
    ul([`**Service description:** for new demand a headline (${ex.limits.headMin}–${ex.limits.head} words for an RFP, ${exQuote.limits.headMin}–${exQuote.limits.head} for three quotes), an executive description (${ex.limits.execMin}–${ex.limits.exec} words; ${exQuote.limits.execMin}–${exQuote.limits.exec}) and a summary table (${EXEC_ROWS.map(r=>r[1]).join(", ")}). Other routes get a short description. It never contains amounts, dates, places, suppliers, the route or risk answers.`,
      "**Captured for procurement:** the record table with the route, Level 4, budget, timing, supplier, entity, data access, outsourcing, ICT, critical function, materiality and the check-step result.",
      "**Sourcing request text:** one paragraph for the RFP.",
      `**Detailed document (new demand):** ${DETAIL_SECTIONS.length} sections (${DETAIL_SECTIONS.map(s=>s[1]).join(", ")}), obligations as “The Service Provider shall …”, sourcing attributes, materiality inputs, quality by section, the Level 4 check, and appendices with the facts and the conversation.`,
      "**Business requirements document (other routes):** requirements with priority, milestones, evaluation, stakeholders, risk and compliance.",
      `**JSON on submit:** ${ex.payloadKeys}.`]));

  B.push(h(2,"11. Settings and reference data"),
    table(["Setting (Rules)","Value","Effect"],[
      ["Business-led sourcing up to", eur(T.quickQuoteMax), "Three quotes up to it, RFP above; also the most a catalogue order can be without a quantity"],
      ["Material spend review from", eur(T.materialityMin), "Adds the material spend review"],
      ["Quality needed before submitting", String(T.qualityMin), "Below it the chat offers an improvement round"],
      ["Tips for thin answers", String(T.answerTip), "One tip when a new-demand answer rates this or lower (0 = off)"]]),
    table(["Category","Type","Keywords (first five)","Framework contract"], CATEGORIES.map(c=>[c.name, DEMAND_TYPES[c.type]||c.type, c.kw.slice(0,5).join(", "), (frameworks.find(x=>x.category===c.id)||{}).supplier||"–"])),
    table(["Level 4","Name","Category"], L4.map(e=>[e.code, e.name, catById(e.cat).name])),
    p("All reference data (catalogue, contracts, preferred suppliers, entities) is mock data; replace it with your own."));

  B.push(h(2,"12. To rebuild it"),
    ol(["**Reference data:** categories with keywords, the Level 4 list, catalogue, framework contracts, preferred suppliers, legal entities.",
      "**Rules:** category and Level 4, the route (section 5), the questions per route and their order, worded for the kind of work (section 6), facts worked out from answers, reviews, outsourcing per the group standard (section 8), answer checks and the quality score (section 9).",
      "**The conversation loop** in section 4, with a rule-based reader as a backup for every AI step.",
      "**Prompts A–E** (section 7) with their JSON shapes. Always validate and override the AI's output as described.",
      "**A server function** with provider fallback, time and usage limits and an access code; keys only on the server.",
      "**Outputs and quality** (sections 9–10), and tests for each route and check (see `tests/e2e`)."]));
  return B;
}
// the panel: built on click, read-only, printable, downloadable; Escape or Close returns to the chat
function openSpec(){
  const trigger=document.activeElement, model=specModel(true);
  $("#docRoot").innerHTML=`<div class="docwrap" role="dialog" aria-modal="true" aria-labelledby="specTitle"><div class="doctools">
      <b id="specTitle">How it works</b><span class="sp"></span>
      <button class="btn btn-g" data-spec="md">Download (.md)</button><button class="btn btn-g hide-sm" data-spec="print">Print</button><button class="btn btn-p" data-spec="close">Close</button></div>
    <div class="paper spec" id="specPaper" tabindex="-1"><div class="brd">${specHtml(model)}</div></div></div>`;
  document.body.classList.add("doc-open");
  document.querySelectorAll(".top,.app").forEach(x=>x.inert=true);
  S.specBack=trigger;
  document.querySelectorAll("[data-spec]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.spec;
    if(a==="close") closeDoc();
    if(a==="md"){ const blob=new Blob([specMd(specModel(false))],{type:"text/markdown"}), l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download="guided-intake-how-it-works.md"; l.click(); }
    if(a==="print"){ const shut=[...document.querySelectorAll("#specPaper details:not([open])")]; shut.forEach(d=>d.open=true);
      window.addEventListener("afterprint",()=>shut.forEach(d=>d.open=false),{once:true}); window.print(); }
  });
  $('[data-spec="close"]').focus();
}
// closes the document or How-it-works overlay and gives the page back
function closeDoc(){
  $("#docRoot").innerHTML=""; document.body.classList.remove("doc-open");
  document.querySelectorAll(".top,.app").forEach(x=>x.inert=false);
  const back=S.specBack; S.specBack=null; if(back&&back.focus) back.focus();
}

/* =========================================================
   12. WIRING
   ========================================================= */
function reset(){ typeFlush(); Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,fresh()); render(); $("#inp").focus(); }
const inp=$("#inp");
inp.addEventListener("input",()=>{typeFlush();inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#comp").requestSubmit();}});
$("#comp").onsubmit=e=>{e.preventDefault();const t=inp.value;inp.value="";inp.style.height="auto";handleUser(t);};
$("#doccss").textContent=DOC_CSS;
$("#cfgBtn").onclick=openSettings; $("#howBtn").onclick=openSpec;
// Escape closes How it works
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#specPaper")) closeDoc(); });
$("#newBtn").onclick=reset; $("#sumBtn").onclick=()=>$("#side").classList.toggle("open");
// access gate: the page stays locked until the server confirms the code
async function verifyCode(c){
  try{ const r=await fetch("/api/llm?verify=1",{headers:{"x-access-code":c}}); return r.ok; }catch(e){ return null; }
}
async function accessGate(){
  let saved=CONFIG.accessCode; if(!saved){ try{saved=sessionStorage.getItem("ac")||"";}catch(e){} }
  if(saved && await verifyCode(saved)===true){ CONFIG.accessCode=saved; $("#gate").hidden=true; return; }
  try{sessionStorage.removeItem("ac");}catch(e){}
  const g=$("#gate"), inpC=$("#gateCode"), btn=$("#gateBtn"), err=$("#gateErr");
  $("#gateForm").hidden=false; inpC.focus();
  await new Promise(done=>{
    $("#gateForm").onsubmit=async e=>{ e.preventDefault(); const c=inpC.value.trim(); if(!c){ err.textContent="Please enter the code."; return; }
      btn.disabled=true; err.textContent=""; const ok=await verifyCode(c); btn.disabled=false;
      if(ok===true){ CONFIG.accessCode=c; try{sessionStorage.setItem("ac",c);}catch(x){} g.hidden=true; done(); }
      else { err.textContent= ok===null ? "Can't reach the server. Please try again." : "That code isn't right."; inpC.value=""; inpC.focus(); } };
  });
}
(async()=>{
  render(); await detectServer(); resolveProvider();
  if(SERVER && SERVER.accessRequired) await accessGate(); else $("#gate").hidden=true;
  render(); $("#inp").focus();
})();
