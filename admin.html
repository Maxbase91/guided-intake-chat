<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guided Intake: rules and settings</title>
<style>
:root{--navy:#0f2147;--navy3:#2c4a8a;--amber:#f2a900;--amberSoft:#fff4d6;--ok:#11845b;--okSoft:#e5f5ee;--bad:#b3261e;--badSoft:#fdecea;--ink:#141b2d;--ink2:#4a5470;--ink3:#7c859e;--line:#d5dae6;--bg:#f4f6fa;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1{font-size:18px;margin:0}h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top a{color:#d6deef}.top .btn{color:var(--ink)}
.top .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:#eef0f5;color:var(--ink2)}
.pill.ok{background:var(--okSoft);color:var(--ok)}.pill.warn{background:var(--amberSoft);color:#8a5d00}.pill.bad{background:var(--badSoft);color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy3)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.a{background:var(--amber);border-color:var(--amber);color:#3b2a00}
.btn.s{padding:2px 8px;font-weight:500;font-size:13px}.btn.x{color:var(--bad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid transparent;background:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tab[aria-selected=true]{background:var(--card);border-color:var(--line);color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--ink3);font-size:13px}.hint{color:var(--ink2);font-size:13.5px;margin:2px 0 12px}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #edf0f5;vertical-align:top}
tr:last-child td{border-bottom:0}
input[type=text],input[type=number],input[type=password],select,textarea{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;max-width:100%}
input[type=number]{width:130px}textarea{width:100%;min-height:54px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy3);outline-offset:1px}
.changed{background:var(--amberSoft)}
.row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fbfcfe}
.row.else{background:#f3f5f9}
.row .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0}
.kw{font-weight:700;color:var(--navy);font-size:12.5px;letter-spacing:.04em;min-width:44px}
.rownum{font-weight:700;color:var(--ink3);min-width:22px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{font-size:13.5px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.problems{background:var(--badSoft);border:1px solid #f2b8b5;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.problems ul{margin:4px 0 0 18px;padding:0}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.login label{display:block;font-weight:600;margin:12px 0 4px}.login input{width:100%}
.err{color:var(--bad);margin-top:10px;min-height:1.3em}
.given{display:flex;gap:6px;flex-wrap:wrap}
.given .g{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:2px 6px;background:#fff;font-size:13px}
.given .g .n{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.given .g select,.given .g input{border:0;padding:2px;font-size:13px}.given .g input[type=number]{width:92px}
code{background:#eef0f5;border-radius:4px;padding:0 4px;font-size:13px}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;box-shadow:0 6px 24px rgba(15,33,71,.25)}
@media (max-width:700px){.wrap{padding:12px}td,th{padding:5px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script src="admin.js"></script>
</body>
</html>
